
# A running kzen-auto system-under-test subprocess. The engine key is FAMILY-qualified per SUT name —
# `sut:main`, `sut:other` — matching KzenAutoSubprocessRegistry.resourceKey(name), so a `sut` export carries
# every named SUT as an independent registration. Because a qualifier is a step parameter and may be
# computed, the runtime requires gate and the static analysis both reason at the family level: they answer
# "is SOME SUT started", and a name mismatch surfaces at read with the step's own diagnostic.
SutContext:
  is: Context
  type:
    class: tech.kzen.auto.test.server.process.SutHandle
    generics: []
    nullable: false
  key: sut
  icon: PlayCircle
  title: "SUT"
  description: "A kzen-auto subprocess under test, addressed by name"


StartKzenAutoStep:
  abstract: true
  is:
    - ScriptStep
    - ContextBinder
    - ResourceOwner
  class: tech.kzen.auto.test.server.script.step.StartKzenAutoStep
  icon: PlayCircle
  title: "Start SUT"
  description: "Spawn a vanilla kzen-auto JVM as a system-under-test"
  binds: SutContext
  name: "main"
  fixture: ""
  # 0 = pick a free port at run time, so a SUT never contends with a developer's own kzen-auto
  #  instances. Navigate to it with BrowserGetSutStep, which addresses the SUT by name. Pin a
  #  literal port only when you want a predictable URL to attach to.
  port: 0
  meta:
    name: String
    fixture:
      is: String
      summary: TextAttributeView
    port: Int


BrowserGetSutStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.test.server.script.step.BrowserGetSutStep
  icon: "material-symbols:http"
  title: "Browse to SUT"
  description: "Navigate the browser to a running SUT, addressed by name"
  # Both: it reads the driver AND the SUT handle.
  uses:
    - BrowserContext
    - SutContext
  name: "main"
  path: ""
  screenshotDelayMilliseconds: 0
  meta:
    name:
      is: String
      summary: TextAttributeView
    path:
      is: String
      summary: TextAttributeView
    screenshotDelayMilliseconds: Long


StopKzenAutoStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.test.server.script.step.StopKzenAutoStep
  icon: StopCircle
  title: "Stop SUT"
  description: "Kill a previously-started kzen-auto SUT subprocess"
  # `releases:`, not `uses:` — this step's tolerant "nothing to stop" branch is deliberate, and the
  # uniform requires gate would turn it into a hard failure plus a pause-on-error park.
  releases: SutContext
  name: "main"
  meta:
    name:
      is: String
      summary: TextAttributeView
