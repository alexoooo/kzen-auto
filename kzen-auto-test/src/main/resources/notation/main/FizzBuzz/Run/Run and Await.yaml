main:
  is: Script

main.steps/Click:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Run']"

main.steps/Await:
  is: DoWhileStep
  condition: 'State == "Pause"'

main.steps/Await.steps/Wait:
  is: WaitStep
  milliseconds: 250

main.steps/Await.steps/State:
  is: BrowserReadStep
  target:
    type: Xpath
    value: "//button[@title='Run' or @title='Pause' or @title='Continue running']"
  attribute: title

# The reactive Await exits the instant the run-state flips to idle, but the SUT client paints the
# Display step's Detail one poll cycle later — brief, bounded settle so the read below sees it.
main.steps/Settle:
  is: WaitStep
  milliseconds: 2000

main.steps/Read Display:
  is: BrowserReadStep
  target:
    type: Xpath
    value: "(//div[@title='Detail'])[last()]"