# The receiving end of an export chain, and the whole ownership rule in one document: the sub-script below
# declares `context.exports` for the SUT and the browser, so both climb out of it and rest HERE — the first
# document that does not export them onward. The provider offers; the receiver takes ownership by saying
# nothing. Both are therefore disposed at THIS document's settle, and the browser's `keepOnFailure` keys off
# this run's outcome.
main:
  is: Script

main.steps/Open Kzen and Browser:
  is: RunStep
  instructions: "main/FizzBuzz/Open Kzen and Browser.yaml#main"

main.steps/Build Item:
  is: RunStep
  instructions: "main/FizzBuzz/Item/Build Item.yaml#main"

main.steps/Build Loop:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Build Loop.yaml#main"

main.steps/Run:
  is: RunStep
  instructions: "main/FizzBuzz/Run/Run and Await.yaml#main"

main.steps/Close Browser and Kzen:
  is: RunStep
  instructions: "main/FizzBuzz/Close Browser and Kzen.yaml#main"