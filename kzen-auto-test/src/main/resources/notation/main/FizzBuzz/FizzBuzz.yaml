# This document OWNS the SUT and the browser: the sub-script below opens both, and without these slots each
# would bind to that sub-script and be disposed at its settle, leaving every later sub-script with nothing.
main:
  is: Script
  context:
    slots:
      - SutContext
      - BrowserContext

main.steps/Open Kzen and Browser:
  is: RunStep
  instructions: "main/FizzBuzz/Open Kzen and Browser.yaml#main"

main.steps/Build Item:
  is: RunStep
  instructions: "main/FizzBuzz/Item/Build Item.yaml#main"

main.steps/Build Loop:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Build Loop.yaml#main"

main.steps/Run:
  is: RunStep
  instructions: "main/FizzBuzz/Run/Run and Await.yaml#main"

main.steps/Close Browser and Kzen:
  is: RunStep
  instructions: "main/FizzBuzz/Close Browser and Kzen.yaml#main"