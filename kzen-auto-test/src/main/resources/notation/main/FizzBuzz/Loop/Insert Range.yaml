main:
  is: Script
  context:
    requires:
      - BrowserContext

# "Number range" was removed along with the other deprecated literal steps; a Formula holding the
# Kotlin expression 1..100 replaces it, and the ForEach names it in scope (see Insert Loop.yaml).
'main.steps/Click "Formula" ribbon tool':
  is: BrowserClickStep
  target:
    type: Text
    value: Formula

"main.steps/Click [add] target in script":
  is: BrowserClickStep
  target:
    value: "main/Actions/Plus Circle/~main.yaml#main"
    type: Visual

main.steps/Click Code:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//label[text()='Code']/..//textarea"
    # The multiline editor renders a second (hidden) autosize-shadow textarea; the visible one is
    # the first (as in FizzBuzz Formula.yaml). No [Expand] click precedes this: a newly created step
    # opens its body straight away (ScriptBranchDisplay.onCreate).
    policy: first

'main.steps/Write "1..100"':
  is: BrowserWriteStep
  text: "1..100"

# Clicking [Rename] also blurs the textarea, which commits the debounced code edit above.
"main.steps/Click [Rename]":
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Rename']"

'main.steps/Set name = "Range"':
  is: BrowserWriteStep
  text: Range
  overwrite: true

main.steps/Enter:
  is: BrowserEnterStep
