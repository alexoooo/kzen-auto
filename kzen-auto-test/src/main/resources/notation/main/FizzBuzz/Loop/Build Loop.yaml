# A pure aggregator — see the note in `../Item/Build Item.yaml`: every sub-script it hosts requires the
# browser, so this document declares the requirement it passes through.
main:
  is: Script
  context:
    requires:
      - BrowserContext

main.steps/Create Script:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Create Loop Script.yaml#main"

main.steps/Insert Range:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Insert Range.yaml#main"

main.steps/Insert Loop:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Insert Loop.yaml#main"

main.steps/Insert Run:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Insert Run.yaml#main"

main.steps/Insert Display:
  is: RunStep
  instructions: "main/FizzBuzz/Loop/Insert Display.yaml#main"