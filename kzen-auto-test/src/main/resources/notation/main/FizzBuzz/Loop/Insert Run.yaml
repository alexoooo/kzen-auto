main:
  is: Script

main.steps/Click:
  is: BrowserClickStep
  target:
    type: Text
    value: Logic / Control

main.steps/Click 2:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[text()='Run']"

main.steps/Click 6:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//div[text()='Add steps from the toolbar (above)']/..//button"

main.steps/Click 4:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//label[text()='Instructions']/..//input"

main.steps/Write:
  is: BrowserWriteStep
  text: FizzBuzz Item

main.steps/Enter:
  is: BrowserEnterStep

# The argument rows below do not exist until the committed Instructions round-trips and the client
# re-derives the callee's parameter list (RunStepArgumentsEditor.onClientState). Selenium runs with a
# zero implicit wait, so without this the next click races that render.
main.steps/Settle Arguments:
  is: WaitStep
  milliseconds: 1000

main.steps/Click 5:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//label[text()='number']/..//input"

main.steps/Write 2:
  is: BrowserWriteStep
  text: Item

main.steps/Enter 2:
  is: BrowserEnterStep