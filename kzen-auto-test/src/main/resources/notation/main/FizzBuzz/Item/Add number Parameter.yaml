  target:
    type: Xpath
    value: "//button[@title='Add parameter']"

main.steps/Click:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//input[@placeholder='parameter name']"

main.steps/Write:
  is: BrowserWriteStep
