# A pure aggregator: it hosts only sub-scripts, but every one of them declares `requires: [BrowserContext]`,
# so this document cannot run standalone either — and saying so is what keeps its RunSteps clean and lets the
# analysis check the requirement at ITS caller (FizzBuzz.yaml, which owns the slot) instead.
main:
  is: Script
  context:
    requires:
      - BrowserContext

main.steps/Create Item Script:
  is: RunStep
  instructions: "main/FizzBuzz/Item/Create Item Script.yaml#main"

'main.steps/Add "number" parameter':
  is: RunStep
  instructions: "main/FizzBuzz/Item/Add number Parameter.yaml#main"

main.steps/Add result type:
  is: RunStep
  instructions: "main/FizzBuzz/Item/Add Result Type.yaml#main"

main.steps/Add Formula:
  is: RunStep
  instructions: "main/FizzBuzz/Item/FizzBuzz Formula.yaml#main"

main.steps/Add Return:
  is: RunStep
  instructions: "main/FizzBuzz/Item/Add Result Step.yaml#main"