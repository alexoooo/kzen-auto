main:
  is: Script

main.steps/Click:
  is: BrowserClickStep
  target:
    type: Text
    value: Formula

main.steps/Run:
  is: RunStep
  instructions: "main/Actions/Insert Last.yaml#main"

main.steps/Click 2:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Expand']"

main.steps/Click 3:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//label[text()='Code']/..//textarea"
    # The multiline editor renders a second (hidden) autosize-shadow textarea; the visible one is
    # the first (migrated from the pre-policy silent first-match when `unique` became the default)
    policy: first

main.steps/Write:
  is: BrowserWriteStep
  text: |-
    if (number % 3 == 0 && number % 5 == 0) "fizzbuzz"
    else if (number % 3 == 0) "fizz"
    else if (number % 5 == 0) "buzz"
    else number.toString()
