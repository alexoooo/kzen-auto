# Offers both resources it opens to its caller: the SUT (`auto`) and the browser (`keepOnFailure`). Without
# these exports each would be private to this script and disposed at its settle, leaving every later
# sub-script of the run with nothing.

main:
  is: Script
  context:
    exports:
      - SutContext
      - BrowserContext

main.steps/Start SUT:
  is: StartKzenAutoStep
  name: main
  fixture: fixtures/empty-project
  closePolicy: auto

main.steps/Wait:
  is: WaitStep

main.steps/Open Browser:
  is: BrowserOpenStep
  closePolicy: keepOnFailure

main.steps/Navigate:
  is: BrowserGetSutStep
  name: main
  screenshotDelayMilliseconds: 1000

main.steps/Wait 2:
  is: WaitStep