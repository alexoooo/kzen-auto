main:
  is: Script

# Distinct name from the FizzBuzz SUT ("main") so the two smoke tests never collide when they share one
# tester JVM; the port needs no coordination, since each SUT takes a free one. The fixture preloads
# "Throwing Formula" into the SUT.
main.steps/Start SUT:
  is: StartKzenAutoStep
  name: formula-error-sut
  fixture: fixtures/formula-error
  closePolicy: auto

main.steps/Open Browser:
  is: BrowserOpenStep
  closePolicy: manual

main.steps/Navigate:
  is: BrowserGetSutStep
  name: formula-error-sut
  screenshotDelayMilliseconds: 1000
