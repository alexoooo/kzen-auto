main:
  is: Script
  context:
    requires:
      - BrowserContext

# Open the preloaded failing Script from the SUT navigation tree (it shows by its document name).
main.steps/Open Script:
  is: BrowserClickStep
  target:
    type: Text
    value: Throwing Formula

# Expand BEFORE running: a pre-run validation error's text renders ONLY in the expanded body
# (ScriptStepDisplayDefault.renderValidation — a title-less div; collapsed shows just a tooltip icon).
# The expansion persists across the run, so the runtime Error section below needs no second click —
# and if it ever collapsed, the Read Error step would fail loudly, never a silent pass.
main.steps/Expand Step:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Expand']"

# Let the async validation refresh arrive and the expanded body render.
main.steps/Settle Validation:
  is: WaitStep
  milliseconds: 2000

# Capture the whole page BEFORE the run: the test asserts this contains no "Error:" text — a formula
# that fails validation (e.g. inferred-Nothing compile error) shows up here, where the runtime-error
# XPath below cannot see it. Read of //body never fails on absence, so the check lives in JUnit.
main.steps/Read Before Run:
  is: BrowserReadStep
  target:
    type: Xpath
    value: "//body"

main.steps/Click Run:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Run']"

# Reactive await: poll the Run/Pause toggle's @title and loop while the run is still executing ("Pause").
# When the Formula throws, the run leaves the executing state and the title is no longer "Pause".
main.steps/Await:
  is: DoWhileStep
  condition: 'State == "Pause"'

main.steps/Await.steps/Wait:
  is: WaitStep
  milliseconds: 250

main.steps/Await.steps/State:
  is: BrowserReadStep
  target:
    type: Xpath
    value: "//button[@title='Run' or @title='Pause' or @title='Continue running']"
  attribute: title

# Let the error trace arrive from the run and the expanded body render (the step is already expanded —
# see Expand Step above; the runtime Error section renders only in the expanded body).
main.steps/Settle:
  is: WaitStep
  milliseconds: 2000

# Read the failed step's rendered error (div title='Error', text "Error: intentional failure"). If the
# error isn't present/visible this read fails the run — surfaced loudly by awaitSuccess, never a false pass.
main.steps/Read Error:
  is: BrowserReadStep
  target:
    type: Xpath
    value: "(//div[@title='Error'])[last()]"
