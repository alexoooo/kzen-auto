# Receives the SUT by saying nothing: the sub-script below exports it, this document does not, so it rests
# here and the subprocess is killed at this document's settle. The browser arrives by the OTHER mechanism —
# that script keeps it private and opens it `manual`, so it outlives that script's settle and hands up one
# level to here. The asymmetry is deliberate: it keeps both routes to a caller under the smoke suite.
main:
  is: Script

main.steps/Open Kzen and Browser:
  is: RunStep
  instructions: "main/FormulaError/Open Kzen and Browser.yaml#main"

main.steps/Run and Read Error:
  is: RunStep
  instructions: "main/FormulaError/Run and Read Error.yaml#main"

main.steps/Close Browser and Kzen:
  is: RunStep
  instructions: "main/FormulaError/Close Browser and Kzen.yaml#main"
