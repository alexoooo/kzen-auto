main:
  is: Script
  steps:
    - main.steps/StartSut
    - main.steps/Open
    - main.steps/Navigate
    - main.steps/Click
    - main.steps/Click 2
    - main.steps/Click 3
    - main.steps/Click 4
    - main.steps/Click 5
    - main.steps/Write
    - main.steps/Close
    - main.steps/StopSut

main.steps/StartSut:
  is: StartKzenAutoStep
  name: main
  fixture: fixtures/empty-project
  port: 18082

main.steps/Open:
  is: BrowserOpenStep

main.steps/Navigate:
  is: BrowserGetStep
  location: "http://127.0.0.1:18082/"
  screenshotDelayMilliseconds: 1000

main.steps/Close:
  is: BrowserCloseStep

main.steps/StopSut:
  is: StopKzenAutoStep
  name: main

main.steps/Click:
  is: BrowserClickStep
  target:
    type: Text
    value: Project

main.steps/Click 2:
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Project options...']"

main.steps/Click 3:
  is: BrowserClickStep
  target:
    type: Text
    value: New Script...

main.steps/Click 4:
  is: BrowserClickStep
  target:
    type: Text
    value: Number range

main.steps/Click 5:
  is: BrowserClickStep
  target:
    value: "main/Plus Circle/~main.yaml#main"
    type: Visual

main.steps/Write:
  is: BrowserWriteStep
  target:
    type: Xpath
    value: "//label[text()='To']/..//input"
  text: 0