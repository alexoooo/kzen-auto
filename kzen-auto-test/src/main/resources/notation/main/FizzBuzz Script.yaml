main:
  is: Script
  steps:
    - main.steps/Start SUT
    - main.steps/Open Browser
    - main.steps/Navigate
    - 'main.steps/Click "Project"'
    - 'main.steps/Click "Project options..." button'
    - 'main.steps/Click "New Script..." menu option'
    - 'main.steps/Click "Number range" ribbon tool'
    - "main.steps/Click [add] target in script"
    - main.steps/Write
    - main.steps/Close Browser
    - main.steps/Stop SUT

main.steps/Start SUT:
  is: StartKzenAutoStep
  name: main
  fixture: fixtures/empty-project
  port: 18082

main.steps/Open Browser:
  is: BrowserOpenStep
  closePolicy: keepOnFailure

main.steps/Navigate:
  is: BrowserGetStep
  location: "http://127.0.0.1:18082/"
  screenshotDelayMilliseconds: 1000

main.steps/Close Browser:
  is: BrowserCloseStep

main.steps/Stop SUT:
  is: StopKzenAutoStep
  name: main

'main.steps/Click "Project"':
  is: BrowserClickStep
  target:
    type: Text
    value: Project

'main.steps/Click "Project options..." button':
  is: BrowserClickStep
  target:
    type: Xpath
    value: "//button[@title='Project options...']"

'main.steps/Click "New Script..." menu option':
  is: BrowserClickStep
  target:
    type: Text
    value: New Script...

'main.steps/Click "Number range" ribbon tool':
  is: BrowserClickStep
  target:
    type: Text
    value: Number range

"main.steps/Click [add] target in script":
  is: BrowserClickStep
  target:
    value: "main/Plus Circle/~main.yaml#main"
    type: Visual

main.steps/Write:
  is: BrowserWriteStep
  target:
    type: Xpath
    value: "//label[text()='To']/..//input"
  text: 0