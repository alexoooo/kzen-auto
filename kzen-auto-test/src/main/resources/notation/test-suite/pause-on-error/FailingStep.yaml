main:
  is: Script
  steps:
    - main.steps/Boom

# A single step that throws at runtime. Run with pauseOnError=true: instead of ending the run,
# the failure pauses it (status.active.state == "Paused", failed step trace state == Error), which
# is what PauseOnErrorSelfTest asserts. No browser / no SUT subprocess — runs in the tester JVM.
main.steps/Boom:
  is: FormulaStep
  code: 'throw RuntimeException("intentional pause-on-error failure")'
