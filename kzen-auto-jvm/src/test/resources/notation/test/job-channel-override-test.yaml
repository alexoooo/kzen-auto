# Per-channel override (JobChannelDefaultTest.perChannelOverrideObjectIsAdopted): an `is: Channel` object named
# exactly the deterministic synth name for the reader->filter connection (ch__reader__output), carrying its own
# batchSize / capacity but with the Worker ports LEFT OPEN. JobChannelSynthesis (ensureChannel is idempotent by
# object path) must ADOPT this object as-is — keeping its overrides — and only fill the Worker ports in the
# in-memory run copy, so the override survives and order-driven auto-wiring still holds.


main:
  is: Job
  batchSize: 1024
  capacity: 0

main.workers/reader:
  is: CsvReaderWorker
  path: build/job-channel-override/input.csv

main.workers/filter:
  is: FilterWorker
  where: 'flag eq "yes"'

main.workers/writer:
  is: CsvWriterWorker
  path: build/job-channel-override/output.csv

main.channels/ch__reader__output:
  is: Channel
  batchSize: 7
  capacity: 3
