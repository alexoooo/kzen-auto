# End-to-end Job exercising a RunWorker between real workers: CSV reader -> RunWorker(child Logic per batch)
# -> CSV writer. The RunWorker invokes job-run-batch-child-test.yaml#main (a RecordBatch identity Script) for
# each batch and emits its result, so the output file must equal the input. The channels are untyped (RunWorker
# is element-agnostic), so ChannelTypeDefiner's type check is skipped while single-reader still holds. See
# JobNestedLogicTest.
main:
  is: Job

main.channels/raw:
  is: Channel
  buffer: 8

main.channels/ran:
  is: Channel
  buffer: 8

main.workers/reader:
  is: CsvReaderWorker
  output: main.channels/raw
  path: build/job-run-worker/input.csv

main.workers/run:
  is: RunWorker
  input: main.channels/raw
  output: main.channels/ran
  instructions: "test/job-run-batch-child-test.yaml#main"

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/ran
  path: build/job-run-worker/output.csv
