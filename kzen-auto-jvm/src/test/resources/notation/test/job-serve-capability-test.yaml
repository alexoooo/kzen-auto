# Regression net for JobServeCapability (CC-17): a Job whose Workers exercise the one surviving serve capability
# (Summary, the upstream distinct-value source for the filter / pivot editors) alongside non-summary serve-bearing
# Workers and a non-serving sink, plus a 3rd-party SummaryServer SUBTYPE worker to prove capability classification
# is by the serve port's inheritance chain — so it recognizes types this code never names. Card rendering (preview
# sample / download) is NOT classified here — each Worker declares its own `display:` component — so preview /
# explore / pivot are (correctly) not summary sources. Never run: only its notation + metadata are read.


main:
  is: Job

main.workers/summary:
  is: SummaryWorker

# Serve-bearing, but NOT a summary source: their serve ports are plain ChannelServers (their cards come from the
# `display:` marker, not a serve-port capability), so JobServeCapability returns null for them.
main.workers/preview:
  is: PreviewWorker

main.workers/explore:
  is: ExploreWorker

main.workers/pivot:
  is: PivotWorker

# A sink with no serve port — no serve capability.
main.workers/writer:
  is: CsvWriterWorker

# A 3rd-party-style Worker whose serve port is a user-defined SummaryServer subtype (reusing SummaryWorker's
# class). Must classify as Summary purely via the inheritance chain, with no edit to JobServeCapability.
main.workers/customSummary:
  is: CustomSummaryWorker


#######################################################################################################################
# Test-only archetypes (unique names, declared once, so there's no whole-graph reference ambiguity).

CustomSummaryServer:
  abstract: true
  is: SummaryServer


CustomSummaryWorker:
  abstract: true
  is: Worker
  class: tech.kzen.auto.server.objects.job.worker.SummaryWorker
  input: ""
  output: ""
  serve: ""
  meta:
    input:
      is: ChannelInput
      of: DataRecord
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      of: DataRecord
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: CustomSummaryServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self
