# Two steps share the name `Shadowed`: an ObjectPath is name + nesting, so `main.steps/Shadowed` and
# `main.steps/Branch.branches/Branch.steps/Shadowed` are distinct steps that both escape to the identifier
# `Shadowed`. (The If step and its first branch group are both called `Branch` — that is just what the generated
# branch name happens to be here, incidental to the shadowing scenario under test.)
#
# `Shadow User`'s code names `Shadowed`, and the text alone cannot say which one it means. The analysis must
# therefore report BOTH as sources: attributing to a single winner would drop an edge, and a dropped edge means
# ScriptValueReferences would call a value unread when something reads it.

main:
  is: Script

main.steps/Shadowed:
  is: FormulaStep
  code: 1

main.steps/Flag:
  is: FormulaStep
  code: "true"

main.steps/Branch:
  is: IfStep

main.steps/Branch.branches/Branch:
  is: IfBranch
  condition: main.steps/Flag

main.steps/Branch.branches/Branch.steps/Shadowed:
  is: FormulaStep
  code: 2

main.steps/Branch.branches/Branch.steps/Shadow User:
  is: FormulaStep
  code: Shadowed + 1
