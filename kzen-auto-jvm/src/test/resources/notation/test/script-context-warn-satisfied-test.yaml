# The same document as script-context-warn-unsatisfied-test.yaml, with the author's assertion added: a
# caller provides the Context. That assertion seeds the local analysis, so the step is silent — which is why
# a sub-script declaring `context.requires` never ambers in its own document view, and why the breakage
# instead surfaces at the CALLER's RunStep.

main:
  is: Script
  context:
    requires:
      - TestSutContext

main.steps/Read:
  is: RequireContextTestStep
