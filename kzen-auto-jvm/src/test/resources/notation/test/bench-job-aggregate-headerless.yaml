main:
  is: Job

main.formats/input:
  is: ConfiguredCsv
  catalogVisible: false
  header: infer-labels

main.workers/reader:
  is: FileSourceWorker
  files:
    - location: build/bench/agg/input-headerless.csv
  format: main.formats/input

main.workers/pivot:
  is: PivotWorker
  pivot:
    rows:
      - "0|c0"
    values:
      "0|c1":
        - Min
        - Average
        - Max

main.workers/writer:
  is: CsvWriterWorker
  path: build/bench/agg/job-headerless-output.csv
