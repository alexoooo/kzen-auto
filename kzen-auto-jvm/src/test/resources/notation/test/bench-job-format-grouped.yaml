# JobReportBenchmark S4 grouped: bench-job-format.yaml with Format grouped by `cat`, so its records go to four
# interleaved outputs, one file each.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/reader:
  is: FileSourceWorker
  files:
    - location: build/bench/exp/input.csv

main.workers/reader Parse:
  is: Parse

main.workers/filter:
  is: ValueSetFilterWorker
  filter:
    "0|flag":
      type: RequireAny
      values:
        - yes

main.workers/formula:
  is: FormulaWorker
  formula:
    total: "qty.toBigDecimal() * price.toBigDecimal()"

main.workers/format:
  is: Format
  groupBy: cat
  columns:
    - "*"
    - meta.total

main.workers/write:
  is: Write
  directory: build/bench/exp/grouped
  compression: none
  existing: replace

main.workers/written:
  is: ResultSinkWorker
  keep: last
