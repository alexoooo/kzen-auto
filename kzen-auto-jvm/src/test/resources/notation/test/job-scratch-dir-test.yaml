# Test fixture for JobScratchDirTest: a source and a sink Worker each obtain their own scratch directory via
# JobControl.scratchDir(). The two Workers (distinct stable ids) must get ISOLATED dirs that are siblings under
# one run dir, and the whole run tree must be swept when the run settles. The worker archetypes are test-only
# (registered via ScratchWorkerTestModule; the production analogues live in notation/auto-jvm/job/job-worker.yaml).


#######################################################################################################################
# Test-only Worker archetypes.

ScratchProbeSourceWorker:
  abstract: true
  is: Worker
  title: "Scratch Probe Source (test)"
  class: tech.kzen.auto.server.objects.job.worker.test.ScratchProbeSourceWorker
  output: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
    selfLocation:
      is: ObjectLocation
      by: Self


ScratchProbeSinkWorker:
  abstract: true
  is: Worker
  title: "Scratch Probe Sink (test)"
  class: tech.kzen.auto.server.objects.job.worker.test.ScratchProbeSinkWorker
  input: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
    selfLocation:
      is: ObjectLocation
      by: Self


#######################################################################################################################
# The concrete Job: a probing source streams one element to a probing sink.

main:
  is: Job

main.channels/raw:
  is: Channel

main.workers/source:
  is: ScratchProbeSourceWorker
  output: main.channels/raw

main.workers/sink:
  is: ScratchProbeSinkWorker
  input: main.channels/raw
