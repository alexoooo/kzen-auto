# The single wired input binds the callee's first parameter (`number`); the `arguments` literal binds the
# second (`label`) by name.
main:
  is: Flow
  vertices:
  - FrargInput
  - FrargCall
  - FrargOutput
  edges: []

FrargInput:
  is: FlowInput
  parameter: "x"
  row: 0
  column: 0

FrargCall:
  is: RunLogic
  instructions: "test/script/result/script-two-param-child-test.yaml#main"
  arguments:
    label: "!"
  row: 1
  column: 0

FrargOutput:
  is: FlowOutput
  result: "out"
  row: 2
  column: 0
