# Leaf document for script-resource-run-scope-test.yaml: opens a resource under `sut` and exports the Context
# whose key that is. The mid document above re-exports it and the root does not, so ownership climbs two frames
# and the resource outlives both this leaf and the mid.

main:
  is: Script
  context:
    exports:
      - TestSutContext

main.steps/OpenSut:
  is: OpenResourceTestStep
  key: sut
  closePolicy: auto
