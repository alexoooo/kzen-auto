# Leaf document for script-resource-run-scope-test.yaml: opens a resource under `sut`. Neither this leaf nor
# the intermediate mid document declares a `sut` slot, so ownership walks past both to the ROOT, which does —
# the resource outlives them both.

main:
  is: Script

main.steps/OpenSut:
  is: OpenResourceTestStep
  key: sut
  closePolicy: auto
