main:
  is: Script

main.steps/Range:
  is: FormulaStep
  code: "1..3"

main.steps/Loop:
  is: ForEachStep
  items: Range

main.steps/Loop.item/Item:
  is: ForEachItemBinding

# Body terminal returns String (references the Int loop item by name), so the loop collects Strings:
# Loop's type must be List<String> (the body output), NOT List<Int> (the items element type).
main.steps/Loop.steps/Label:
  is: FormulaStep
  code: "Item.toString()"
