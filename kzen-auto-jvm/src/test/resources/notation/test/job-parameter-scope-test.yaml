# Declared parameters in Worker-expression scope (element-model phase 2): `threshold` (Int, default 2) gates a
# FilterWorker's `where` over the auto-flattened `value` column of a Double payload stream. Run BARE the filter
# reads the declared default (2 -> keeps 30.0 and 2.5); run with a bound `threshold` argument the argument wins
# (3 -> keeps only 30.0, unwrapped to a scalar by the sink's single-element convention). All ports BLANK ->
# JobChannelSynthesis derives the channels from Worker document order.
main:
  is: Job

main.parameters/threshold:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false
  default: "2"

main.workers/source:
  is: FormulaSourceWorker
  code: listOf(1.5, 30.0, 2.5)

main.workers/filter:
  is: FilterWorker
  where: value.number > threshold

main.workers/collect:
  is: ResultSinkWorker
