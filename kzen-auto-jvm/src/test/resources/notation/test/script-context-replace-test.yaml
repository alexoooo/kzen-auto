# Argument-free read off `provides` (ScriptContextRuntimeTest): a provider declares no `requires` — the
# spine's uniform gate would fail it before it could ever provide one — so the replace-existing read it does
# at the top of its own body can only resolve against its `provides` declaration. Two providers in a row plus
# a consumer prove the whole loop: the first sees nothing, the second sees the first's value, the consumer
# sees the second's.

main:
  is: Script

main.steps/Provide:
  is: ProvideContextTestStep
  value: first

main.steps/Provide Again:
  is: ProvideContextTestStep
  value: second

main.steps/Read:
  is: RequireContextTestStep
