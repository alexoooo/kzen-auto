# Step order is now the document order of the step objects (no explicit step lists).

main:
  is: Script

main.steps/Formula:
  is: FormulaStep
  code: 1..10

main.steps/ForEach:
  is: ForEachStep
  items: main.steps/Formula

main.steps/ForEach.steps/Item:
  is: BooleanLiteralStep

main.steps/ForEach.steps/Is divisible by:
  is: DivisibleCheckStep
  number: main.steps/ForEach.steps/Item
  divisor: 2

main.steps/Display:
  is: DisplayValueStep
  text: main.steps/ForEach
