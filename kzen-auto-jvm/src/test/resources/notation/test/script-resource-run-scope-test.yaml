# Root-slot resource fixture (ScriptExtensibilityTest), root document: root → mid → leaf. THIS document
# declares the `sut` slot; the leaf opens the resource and neither it nor the mid document declares one, so
# ownership walks up two levels to here. After the mid child has settled, the resource must still be open
# (checked here); the engine disposes it only when this root settles.

main:
  is: Script
  context:
    slots:
      - TestSutContext

main.steps/Run:
  is: RunStep
  instructions: "test/script-resource-run-scope-mid-test.yaml#main"

main.steps/CheckStillOpen:
  is: AssertDisposedStep
  key: sut
  expectedDisposed: false
