# Run-scoped resource fixture (ScriptExtensibilityTest), root document: root → mid → leaf. The leaf opens a
# resource under `sut` with the `run` policy, binding it to the whole run (this root). After the mid child has
# settled, the resource must still be open (checked here); the engine disposes it only when this root settles.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-resource-run-scope-mid-test.yaml#main"

main.steps/CheckStillOpen:
  is: AssertDisposedStep
  key: sut
  expectedDisposed: false
