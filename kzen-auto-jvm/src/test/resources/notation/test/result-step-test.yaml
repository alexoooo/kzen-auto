# A Script with a declared Int result and a Result step whose expression evaluates to that type. The run's
# main value is the Result step's value (Base + 21 = 42), NOT the last body step's value ("ignored tail") —
# the trailing FormulaStep runs but does not change the Script result (no last-step fallback).

main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/Base:
  is: FormulaStep
  code: 21

main.steps/Result:
  is: ResultStep
  code: Base + 21

main.steps/After:
  is: FormulaStep
  code: '"ignored tail"'
