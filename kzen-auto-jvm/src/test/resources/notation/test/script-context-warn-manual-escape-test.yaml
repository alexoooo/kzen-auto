# The Manual escape (ScriptContextValidationTest): structurally identical to
# script-context-warn-unslotted-provide-test.yaml — no slot anywhere — but the hosted document provides with
# `closePolicy: manual`, so the registration really does reach this document. BOTH warnings must therefore be
# absent. Without the manual branch in the analysis this fixture shows two false ones, on exactly the
# configuration the FormulaError self-test ships.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-context-manual-child-test.yaml#main"

main.steps/Read:
  is: RequireContextTestStep
