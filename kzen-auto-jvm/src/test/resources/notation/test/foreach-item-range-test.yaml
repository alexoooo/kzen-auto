main:
  is: Script

# items is an IntRange (an Iterable<Int> with no generic parameter), not a List<Int> — so the loop
# item's Int type comes from range-element mapping, not from a generic parameter.
main.steps/Range:
  is: FormulaStep
  code: 1..3

main.steps/Loop:
  is: ForEachStep
  items: main.steps/Range

main.steps/Loop.item/Item:
  is: ForEachItemBinding
