# A RunWorker Job whose child is the TWO-step identity (job-run-batch-child-2step-test.yaml), for the step-into
# integration test (JobNestedLogicTest.steppingRunWorkerDescendsIntoChildWithinJob): CSV reader -> RunWorker
# -> CSV writer over its own build/job-run-worker-stepping work dir (separate from the full-speed test's, so
# the two never contend on files). Stepping this Job must advance the RunWorker's child one fresh step at a
# time, so a single step cannot have run the first child to completion (nothing emitted to the writer yet).
main:
  is: Job

main.channels/raw:
  is: Channel
  buffer: 8

main.channels/ran:
  is: Channel
  buffer: 8

main.workers/reader:
  is: CsvReaderWorker
  output: main.channels/raw
  path: build/job-run-worker-stepping/input.csv

main.workers/run:
  is: RunWorker
  input: main.channels/raw
  output: main.channels/ran
  instructions: "test/job-run-batch-child-2step-test.yaml#main"

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/ran
  path: build/job-run-worker-stepping/output.csv
