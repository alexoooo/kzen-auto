# RunStep hosted-requires (ScriptContextValidationTest): the hosted document declares
# `context.requires: [TestSutContext]`, and nothing here provides it. The warning lands on the RunStep,
# because that is the only place the mismatch is visible — the callee's own steps stay clean, its
# `context.requires` having seeded its local analysis. This is also what actually ambers when a caller's slot
# declaration is deleted.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-context-warn-satisfied-test.yaml#main"
