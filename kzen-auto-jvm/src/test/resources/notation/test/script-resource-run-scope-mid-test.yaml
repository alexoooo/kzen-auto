# Intermediate document for script-resource-run-scope-test.yaml: runs the leaf that opens the resource, then
# asserts it survived the leaf's settle. This document declares NO slot, so it does not own the resource — the
# root two levels up does.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-resource-run-scope-leaf-test.yaml#main"

main.steps/CheckStillOpen:
  is: AssertDisposedStep
  key: sut
  expectedDisposed: false
