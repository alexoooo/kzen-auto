# resource, then asserts it survived the leaf's settle (a `run`-scoped resource is owned by the root, not this
# mid document).

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-resource-run-scope-leaf-test.yaml#main"

main.steps/CheckStillOpen:
  is: AssertDisposedStep
  key: sut
