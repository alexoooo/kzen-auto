main:
  is: Job
  results:
    outputs:
      class: kotlin.collections.List
      generics:
        - class: tech.kzen.auto.common.data.model.DataRef
          generics: []
          nullable: false
      nullable: false

main.parameters/from:
  is: ParameterBinding
  type:
    class: kotlin.String
    generics: []
    nullable: false
  default: "2026-01-01"

main.parameters/to:
  is: ParameterBinding
  type:
    class: kotlin.String
    generics: []
    nullable: false
  default: "2026-01-03"

main.workers/units:
  is: LogicSourceWorker
  instructions: test/datasource/logic/dated-sales-test.yaml#main
  arguments:
    - from
    - to
  emit: units

main.workers/run:
  is: RunWorker
  instructions: test/datasource/logic/job-dated-etl-child-test.yaml#main
  arguments:
    date: 'attributes["date"]'

main.workers/outputs:
  is: ResultSinkWorker
  result: outputs
  keep: all
