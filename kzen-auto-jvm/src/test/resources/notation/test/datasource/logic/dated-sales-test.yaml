main:
  is: Script
  results:
    main:
      class: kotlin.collections.List
      generics:
        - class: tech.kzen.auto.common.data.model.DataUnit
          generics: []
          nullable: false
      nullable: false

main.parameters/from:
  is: ParameterBinding
  type:
    class: kotlin.String
    generics: []
    nullable: false
  default: "2026-01-01"

main.parameters/to:
  is: ParameterBinding
  type:
    class: kotlin.String
    generics: []
    nullable: false
  default: "2026-01-03"

main.steps/Resolve:
  is: ResultStep
  code: |
    run {
        val config = tech.kzen.auto.common.data.read.DelimitedReadConfig(
            tech.kzen.auto.common.data.read.RecordFramingSpec("lf"),
            tech.kzen.auto.common.data.read.DelimitedDialectSpec(",", "\"", "double-quote", "empty", "none"),
            tech.kzen.auto.common.data.read.HeaderReadSpec("present", "exact-name"),
            tech.kzen.auto.common.data.read.CharacterDecodingSpec("UTF-8", "permit", "report", "report"),
            null,
            tech.kzen.auto.common.data.read.TypedDecodePolicy(null, "fail-part", emptyList()))
        val read = tech.kzen.auto.common.data.read.ResolvedReadSpec(
            tech.kzen.auto.common.data.read.ReaderCapabilityIdentity(
                "tech.kzen.auto", "configured-delimited", "1"),
            listOf(tech.kzen.auto.common.data.read.ContentCodingSpec.identity),
            config.asExecutionValue())
        fun part(role: tech.kzen.auto.common.data.model.DataRole, path: String):
                tech.kzen.auto.common.data.model.DataPart {
            return tech.kzen.auto.common.data.model.DataPart(
                role,
                tech.kzen.auto.common.data.model.DataRef(null, path),
                null,
                read)
        }
        generateSequence(java.time.LocalDate.parse(from)) { it.plusDays(1) }
            .takeWhile { it <= java.time.LocalDate.parse(to) }
            .map { date ->
                tech.kzen.auto.common.data.model.DataUnit.of(
                    mapOf("date" to date.toString()),
                    listOf(
                        part(
                            tech.kzen.auto.common.data.model.DataRole.main,
                            "build/dated-sales/input/$date/main.csv"),
                        part(
                            tech.kzen.auto.common.data.model.DataRole("reference"),
                            "build/dated-sales/ref/$date.csv")))
            }
            .toList()
    }
