# Classification / derivation net for JobSignatureCapability (J2, CC-17): a Job whose Workers exercise every
# signature-marker case — a ParameterSource (named `items`), a ParameterSource with a BLANK name (filtered from the
# signature), a 3rd-party ParameterSource SUBTYPE with a typed `of: String` output port (proves type derivation
# + inheritance-chain classification), a plain non-signature Worker (role null), a ResultSink with a blank result
# (-> `main`), and a ResultSink with a named result (`summary`). Worker document order IS signature order. Never
# run: only its notation + metadata are read.
main:
  is: Job

main.workers/param:
  is: ParameterSourceWorker
  parameter: "items"

# Blank parameter name -> streams null, absent from the signature (Flow parity).
main.workers/blankParam:
  is: ParameterSourceWorker

# 3rd-party ParameterSource subtype with a typed output port -> its `of: String` types the parameter.
main.workers/typedParam:
  is: TypedParamSource
  parameter: "records"

# Plain source, not a signature marker -> role null.
main.workers/plain:
  is: FormulaSourceWorker

# Blank result -> the `main` output component (the hosts' single-positional harvest convention).
main.workers/result:
  is: ResultSinkWorker

# Named result -> the `summary` output component.
main.workers/namedResult:
  is: ResultSinkWorker
  result: "summary"


#######################################################################################################################
# Test-only archetype (unique name, declared once, so there's no whole-graph reference ambiguity): a user-defined
# ParameterSource subtype reusing the production class, with a typed output port. Must classify as a Parameter and
# type its component String purely via the inheritance chain + metadata, with no edit to JobSignatureCapability.
TypedParamSource:
  abstract: true
  is: ParameterSource
  class: tech.kzen.auto.server.objects.job.worker.ParameterSourceWorker
  output: ""
  meta:
    output:
      is: ChannelOutput
      of: String
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self
