# Derivation net for JobSignatureCapability: INPUTS come from the `parameters` branch of typed ParameterBinding
# declarations — an untyped one (the archetype default types it Any), a String-typed one, and a generic
# List<Int> (proves TypeMetadata parsing incl. generics) — in document order; OUTPUTS come from the ResultSink
# marker Workers — a blank result (-> `main`), a named result (`summary`), and a 3rd-party ResultSink SUBTYPE
# with a typed `of: String` input port (proves type derivation + inheritance-chain classification, CC-17). A
# plain non-signature Worker classifies false. Never run: only its notation + metadata are read.
main:
  is: Job

main.parameters/items:
  is: ParameterBinding

main.parameters/records:
  is: ParameterBinding
  type:
    class: kotlin.String
    generics: []
    nullable: false

main.parameters/counts:
  is: ParameterBinding
  type:
    class: kotlin.collections.List
    generics:
      - class: kotlin.Int
        generics: []
        nullable: false
    nullable: false

# Plain source, not a signature marker -> not a ResultSink.
main.workers/plain:
  is: FormulaSourceWorker

# Blank result -> the `main` output component (the hosts' single-positional harvest convention).
main.workers/result:
  is: ResultSinkWorker

# Named result -> the `summary` output component.
main.workers/namedResult:
  is: ResultSinkWorker
  result: "summary"

# 3rd-party ResultSink subtype -> classifies via the inheritance chain; its `of: String` types the component.
main.workers/subtypeResult:
  is: TypedResultSink
  result: "typed"


#######################################################################################################################
# Test-only archetype (unique name, declared once, so there's no whole-graph reference ambiguity): a user-defined
# ResultSink subtype reusing the production class, with a typed input port. Must classify as a ResultSink and
# type its component String purely via the inheritance chain + metadata, with no edit to JobSignatureCapability.
TypedResultSink:
  abstract: true
  is: ResultSink
  class: tech.kzen.auto.server.objects.job.worker.ResultSinkWorker
  input: ""
  meta:
    input:
      is: ChannelInput
      of: String
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self
