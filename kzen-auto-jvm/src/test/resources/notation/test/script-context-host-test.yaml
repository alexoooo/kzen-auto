# Typed provide / consume across a RunStep (ScriptContextValidationTest, ScriptContextRuntimeTest), caller
# side: a hosted sub-Script provides the Context and exports it, this document declares NOTHING and therefore
# receives it, and a step back here reads it. The typed API resolves through the engine's export chain exactly
# as the raw string API does, and the provide survives the hosted document's settle because ownership climbed
# to this frame.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-context-host-child-test.yaml#main"

main.steps/Read:
  is: RequireContextTestStep
