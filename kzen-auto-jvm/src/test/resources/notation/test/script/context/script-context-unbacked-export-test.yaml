# An unkeepable export promise (ScriptContextValidationTest): this document exports a Context no step of its
# own provides, and the document it runs keeps that Context private — so the declaration can never deliver
# anything to a caller. A WARNING, not an error: the document still runs, it just offers nothing.

main:
  is: Script
  context:
    exports:
      - TestSutContext

main.steps/Run:
  is: RunStep
  instructions: "test/script/context/script-context-private-child-test.yaml#main"
