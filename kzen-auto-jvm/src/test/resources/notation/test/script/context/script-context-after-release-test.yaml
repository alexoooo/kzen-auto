# `releases:` removes availability (ScriptContextValidationTest): a consumer placed AFTER a closer errors,
# while the one before it is satisfied. One of the three jobs the third marker does that a
# `uses`-with-exemptions could not.

main:
  is: Script

main.steps/Provide:
  is: ProvideContextTestStep
  value: opened

main.steps/Read Before:
  is: RequireContextTestStep

main.steps/Release:
  is: ReleaseContextTestStep

main.steps/Read After:
  is: RequireContextTestStep
