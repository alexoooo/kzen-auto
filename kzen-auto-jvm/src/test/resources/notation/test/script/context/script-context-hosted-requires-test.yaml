# RunStep hosted-requires (ScriptContextValidationTest): the hosted document declares
# `context.requires: [TestSutContext]`, and nothing here binds it, so the call cannot work. The ERROR lands
# on the RunStep, because that is the only place the mismatch is visible — the callee's own steps stay clean,
# its `context.requires` having seeded its local analysis.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script/context/script-context-satisfied-test.yaml#main"
