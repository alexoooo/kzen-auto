# A re-export chain, root of three documents (ScriptContextValidationTest): the leaf provides and exports, the
# mid document re-exports what it receives, and this root declares nothing — so the Context climbs two frames
# and rests here, where the consumer reads it. Ownership travels exactly as far as the unbroken chain of
# `exports` declarations carries it.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script/context/script-context-export-chain-mid-test.yaml#main"

main.steps/Read:
  is: RequireContextTestStep
