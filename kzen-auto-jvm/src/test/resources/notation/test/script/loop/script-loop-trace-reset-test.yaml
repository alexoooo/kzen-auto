# Per-iteration trace-reset fixture (ServerLogicControllerLoopTraceResetTest): a ForEach whose body hosts a
# sub-script per item (script-loop-trace-reset-child-test.yaml — CountingStep + a binary film-strip detail +
# an item-dependent value). Each iteration's reset must clear the PRIOR child invocation's live trace values
# (so its steps read as not-run) and the parent body steps' own values, while every invocation's binary events
# survive in the retained history. Post is the unrelated edit target for the migration-compose test;
# Result = [10, 20, 30, 40].sum() + Post.

main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/Items:
  is: FormulaStep
  code: "1..4"

main.steps/Loop:
  is: ForEachStep
  items: Items

main.steps/Loop.item/Item:
  is: ForEachItemBinding

main.steps/Loop.steps/Run:
  is: RunStep
  instructions: "test/script/loop/script-loop-trace-reset-child-test.yaml#main"
  arguments:
    number: main.steps/Loop.item/Item

main.steps/Loop.steps/After:
  is: FormulaStep
  code: "Run"

main.steps/Post:
  is: FormulaStep
  code: "10"

main.steps/Result:
  is: ResultStep
  code: "Loop.sum() + Post"
