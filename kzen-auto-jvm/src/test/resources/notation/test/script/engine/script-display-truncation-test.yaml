# A big value is traced whole: `Big`'s trace shows all 10k chars, and `Result` reads Big.length.

main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/Big:
  is: FormulaStep
  code: '"x".repeat(10000)'

main.steps/Result:
  is: ResultStep
  code: Big.length
