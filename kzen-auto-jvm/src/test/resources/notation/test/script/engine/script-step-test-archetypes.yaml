# Shared test-only Script step archetypes for ScriptExtensibilityTest, declared ONCE here (the production
# analogues live in notation/auto-jvm/script/script-jvm.yaml). Each is backed by a test-source class registered
# by hand via ScriptStepTestModule — no @Reflect, no entry in any kzen dispatch. Declaring them in one archetype
# document (separate from the scenario documents that instantiate them) keeps every `is:` reference to them
# unambiguous — the AutowiredAttributeDefiner locates each object's archetype from a global host, so a duplicate
# declaration across scenario files would resolve ambiguously and fail the whole-graph build.

# Uppercases the referenced value and appends "!!!" — a step type kzen knows nothing about.
ShoutStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.ShoutStep
  icon: "material-symbols:campaign"
  title: "Shout (test)"
  input: ""
  meta:
    input:
      is: ObjectLocation
      by: Nominal


# The Context the resource-ownership fixtures declare slots for. `key: sut` deliberately matches the key the
# fixtures already open under through the RAW string API — that is what makes the interop assertion real:
# same key => same registration, so a slot declared with this typed Context owns a raw step's resource.
# A pure data object with no `meta:`, so it does not drag a JS-only editor reference into the JVM-only test
# graph (see the OpenResourceTestStep KDoc for the trap it would otherwise hit).
TestSutContext:
  is: Context
  type:
    class: kotlin.String
    generics: []
    nullable: false
  key: sut
  icon: "material-symbols:lock-open"
  title: "Test SUT"
  description: "Stand-in for a system-under-test resource, for the resource-ownership fixtures"


# The Context the GENERIC context steps (BindStep / UseContextStep / ReleaseStep) are exercised against. Same
# String contract as TestSutContext above, and deliberately a different `key:` — a shared key would make the two
# one registration graph-wide, so the generic-step fixtures would collide with the resource-ownership ones and
# LogicContextAnalysis would report both as aliases everywhere.
TestValueContext:
  is: Context
  type:
    class: kotlin.String
    generics: []
    nullable: false
  key: generic
  icon: "material-symbols:add-link"
  title: "Test Value"
  description: "An ambient String for the generic context-step fixtures"


# Opens a run-scoped resource under `key` with the named `closePolicy` (a plain String parsed in the step),
# recording its disposal into the ResourceDisposalLog sink.
OpenResourceTestStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.OpenResourceTestStep
  icon: "material-symbols:lock-open"
  title: "Open resource (test)"
  key: ""
  closePolicy: auto
  meta:
    key:
      is: String
    closePolicy:
      is: String


# Always throws — drives the run to a terminal Outcome.Failed to exercise failure-branch resource disposal.
FailStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.FailStep
  icon: "material-symbols:error"
  title: "Fail (test)"
  message: "deliberate test failure"
  meta:
    message:
      is: String


# Asserts whether the resource under `key` has already been disposed (in ResourceDisposalLog) at the point it
# runs, throwing on mismatch — placed after a RunStep to prove an ancestor-scoped resource outlives its opener's
# child settle.
AssertDisposedStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.AssertDisposedStep
  icon: "material-symbols:fact-check"
  title: "Assert disposed (test)"
  key: ""
  expectedDisposed: false
  meta:
    key:
      is: String
    expectedDisposed:
      is: Boolean


# Reads the live handle of the resource under `key` and returns it, throwing when no such resource is open —
# placed after a migration barrier to prove an open resource survived a live edit with its value readable.
ReadResourceStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.ReadResourceStep
  icon: "material-symbols:visibility"
  title: "Read resource (test)"
  key: ""
  meta:
    key:
      is: String


# Increments a process-global counter each invocation and returns the running count — placed inside a loop body
# so the mid-loop migration-resume tests can observe whether completed iterations re-executed.
CountingStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.CountingStep
  icon: "material-symbols:tag"
  title: "Counting (test)"


# Traces a small binary detail (a stand-in screenshot) that joins the run's retained history film-strip —
# placed inside a loop body so the per-iteration trace-reset tests can assert the film-strip survives while
# live per-step values clear.
BinaryDetailStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.BinaryDetailStep
  icon: "material-symbols:photo-camera"
  title: "Binary detail (test)"


# The typed context trio, mirroring the three declaration kinds a production step uses. `binds` /
# `uses` / `releases` are weak references (by: Nominal, declared on the ScriptStep/ContextBinder
# archetypes), so declaring them here is safe in the JVM-only test graph; `closePolicy` stays a plain
# String for the reason OpenResourceTestStep documents. NB: neither `is: ContextBinder` (whose `binds`
# meta would also apply) nor `is: ResourceOwner` (whose `closePolicy` would become the typed enum) — this
# fixture carries its own `binds` meta so the trio stays self-contained.
ProvideContextTestStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.ProvideContextTestStep
  icon: "material-symbols:lock-open"
  title: "Provide context (test)"
  binds: TestSutContext
  value: ""
  qualifier: ""
  closePolicy: auto
  meta:
    binds:
      is: ObjectLocation
      nullable: true
      by: Nominal
    value:
      is: String
    qualifier:
      is: String
    closePolicy:
      is: String


RequireContextTestStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.RequireContextTestStep
  icon: "material-symbols:visibility"
  title: "Require context (test)"
  uses:
    - TestSutContext


ReleaseContextTestStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.ReleaseContextTestStep
  icon: "material-symbols:lock"
  title: "Release context (test)"
  releases: TestSutContext
  qualifier: ""
  meta:
    qualifier:
      is: String


# Fails its first invocation (globally) then succeeds, returning its referenced `input` — a transient failure
# that clears on retry, for exercising pause-on-error park-then-resume of a nested-Logic Worker's child.
FlakyStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.exec.script.test.FlakyStep
  icon: "material-symbols:sync-problem"
  title: "Flaky (test)"
  input: ""
  meta:
    input:
      is: ObjectLocation
      by: Nominal
