# The callee the capability fixture's logic host invokes. Its own document rather than a shared one, so the
# call-graph fixtures that pin which documents host `script-engine-child-test.yaml` stay about the three
# production paradigms.
main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.parameters/number:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false
  default: 0

main.steps/Double:
  is: ResultStep
  code: "number * 2"
