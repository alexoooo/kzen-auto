# A Script with a declared Int result and a Result step whose expression evaluates to that type. The Result
# step ends the Script with Base + 21 = 42, so the trailing FormulaStep ("ignored tail") is unreachable and
# never runs.

main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/Base:
  is: FormulaStep
  code: 21

main.steps/Result:
  is: ResultStep
  code: Base + 21

main.steps/After:
  is: FormulaStep
  code: '"ignored tail"'
