# A declared Int result and NO Result step: the Script's value is its last root step's, so the sole
# FormulaStep's 99 IS the result (implicit result).

main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/OnlyStep:
  is: FormulaStep
  code: 99
