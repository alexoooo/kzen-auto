main:
  is: Script
  results:
    main:
      class: kotlin.collections.List
      generics:
        - class: kotlin.Int
          generics: []
          nullable: false
      nullable: false

main.steps/Range:
  is: FormulaStep
  code: "1..3"

main.steps/Loop:
  is: ForEachStep
  items: Range

main.steps/Loop.item/Item:
  is: ForEachItemBinding

main.steps/Loop.steps/Doubled:
  is: FormulaStep
  code: Item * 2

# Surfaces the loop's collected output (List<Int>) as the Script result (the run test's observation point).
main.steps/Result:
  is: ResultStep
  code: Loop
