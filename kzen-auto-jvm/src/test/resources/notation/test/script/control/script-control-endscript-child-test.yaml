# Child sub-Script whose ResultStep ends it early, returning 5. Its ChildTail (a CountingStep) never runs,
# proving End Script ends only this document (a signal never crosses a host() boundary).
main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/ChildEarly:
  is: ResultStep
  code: "5"

main.steps/ChildTail:
  is: CountingStep
