# A ResultStep (return) at the document root: captures the result (1) and ends the Script, so the later
# Tail (a CountingStep) never runs. Result == 1; CountingStep ran 0 times.
main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.steps/Early:
  is: ResultStep
  code: "1"

main.steps/Tail:
  is: CountingStep
