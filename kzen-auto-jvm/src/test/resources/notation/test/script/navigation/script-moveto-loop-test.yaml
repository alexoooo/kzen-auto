# Move-to loop fixture (ScriptMoveToTest): a ForEach over 1..3 whose body is a side-effect CountingStep. A jump
# TO the loop step restarts it at iteration 0 (its body outcomes drop); a jump INTO the loop body is rejected
# (execution-control decision 3 — a loop body is out of scope as a jump TARGET; a call-site inside one is still
# descendable, which script-moveto-loop-transit-test.yaml covers).
main:
  is: Script

main.steps/Range:
  is: FormulaStep
  code: "1..3"

main.steps/Loop:
  is: ForEachStep
  items: Range

main.steps/Loop.item/Item:
  is: ForEachItemBinding

main.steps/Loop.steps/Body:
  is: CountingStep

main.steps/Total:
  is: FormulaStep
  code: "Loop.sum()"
