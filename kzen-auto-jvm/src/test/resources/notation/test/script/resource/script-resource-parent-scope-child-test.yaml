# Child Script for script-resource-parent-scope-test.yaml and script-resource-export-migration-test.yaml: opens
# a run-scoped resource under `sut` and EXPORTS the Context whose key that is, offering ownership to its caller.
# Neither caller exports it in turn, so the chain stops one frame up and the resource outlives this child's own
# settle. Deliberately opened through the raw string API (OpenResourceTestStep), which pins the interop half:
# same key => same registration, typed or not — the export names a typed Context, the open is a plain string.

main:
  is: Script
  context:
    exports:
      - TestSutContext

main.steps/OpenSut:
  is: OpenResourceTestStep
  key: sut
  closePolicy: auto
