# Export-chain resource fixture (ScriptExtensibilityTest): this parent Script runs a child that opens a
# resource under `sut` and exports it. Receiving takes no declaration at all — this document is simply the
# first frame that does not export the Context, so ownership rests here and the resource is STILL open after
# the child has settled (an unexported open would already be disposed here). The engine disposes it when this
# parent Script settles.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script/resource/script-resource-parent-scope-child-test.yaml#main"

main.steps/CheckStillOpen:
  is: AssertDisposedStep
  key: sut
  expectedDisposed: false
