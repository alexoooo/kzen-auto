# Step order is now the document order of the step objects (no explicit step lists).

main:
  is: Script

main.steps/Formula:
  is: FormulaStep
  code: 1..10

main.steps/ForEach:
  is: ForEachStep
  items: Formula

main.steps/ForEach.steps/Item:
  is: FormulaStep
  code: "1"

main.steps/ForEach.steps/Is divisible by:
  is: FormulaStep
  code: "Item % 2 == 0"

main.steps/Display:
  is: DisplayValueStep
  text: main.steps/ForEach
