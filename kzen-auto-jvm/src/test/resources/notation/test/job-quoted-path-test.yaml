main:
  is: Job

main.channels/data:
  is: Channel
  buffer: 8

main.workers/reader:
  is: CsvReaderWorker
  output: main.channels/data
  path: '"build/job-quoted-path/input.csv"'
  batch: 4096

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/data
  path: '"build/job-quoted-path/output.csv"'
