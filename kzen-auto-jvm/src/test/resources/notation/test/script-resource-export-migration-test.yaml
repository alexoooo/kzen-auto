# Exported resource across a live edit (ScriptExtensibilityTest): a child Script opens a resource under `sut`
# and exports it, so ownership rests on THIS root. The test parks the run after the child has settled — proving
# the export outlived its opener — then drives RunEngine.migrate and lets the root's read step check the handle
# is still live. The barrier lifts the registration by its OWNER's stable id, so an exported resource must be
# re-adopted on the rebuilt root and disposed there, exactly once, when the run settles.

main:
  is: Script

main.steps/Run:
  is: RunStep
  instructions: "test/script-resource-parent-scope-child-test.yaml#main"

main.steps/Read:
  is: ReadResourceStep
  key: sut
