# Formula steps that reference prior steps by their variable identifier inside `code`, for exercising
# KzenAutoCodeReferenceRewriter (rename of a step rewrites the dependent expressions).

main:
  is: Script

main.steps/Source:
  is: FormulaStep
  code: 42

main.steps/Derived:
  is: FormulaStep
  code: Source + 1

main.steps/My Source:
  is: FormulaStep
  code: 7

main.steps/Backtick User:
  is: FormulaStep
  code: '`My Source` + 2'

main.steps/String Literal:
  is: FormulaStep
  code: '"Source stays in this string"'

# A typed parameter (rowless binding in the `parameters` branch) referenced by name from a step's code:
# exercises the cross-branch parameter -> step dependency edge.
main.parameters/threshold:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false

main.steps/Thresholded:
  is: FormulaStep
  code: threshold * 2
