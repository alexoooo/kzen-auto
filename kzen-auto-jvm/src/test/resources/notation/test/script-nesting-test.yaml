# Fixture for ScriptNestingAnalysisTest: a step at the root, an outer ForEach, an inner DoWhile, and an If inside
# the inner loop. Exercises enclosing-loop enumeration (innermost-first), rerun-flag detection over both loop
# types, and exclusion of If branch groups and the document root (which do not re-run).
main:
  is: Script

main.steps/Flag:
  is: FormulaStep
  code: "true"

main.steps/RootStep:
  is: FormulaStep
  code: "1"

main.steps/OuterRange:
  is: FormulaStep
  code: "1..2"

main.steps/OuterLoop:
  is: ForEachStep
  items: main.steps/OuterRange

main.steps/OuterLoop.item/OuterItem:
  is: ForEachItemBinding

main.steps/OuterLoop.steps/InnerLoop:
  is: DoWhileStep
  condition: "false"

main.steps/OuterLoop.steps/InnerLoop.steps/Branch:
  is: IfStep

main.steps/OuterLoop.steps/InnerLoop.steps/Branch.branches/Branch:
  is: IfBranch
  condition: Flag

main.steps/OuterLoop.steps/InnerLoop.steps/Branch.branches/Branch.steps/DeepStep:
  is: FormulaStep
  code: "2"

# A root-level If (not inside any loop) so ScriptJumpAnalysis can exercise a valid descend target: jumping to
# ThenStep re-runs TopIf's conditions (the descend/ancestor set) and parks at ThenStep. Its second branch pins
# that a sibling branch group is neither an ancestor of, nor in scope for, a step in the first one.
main.steps/TopIf:
  is: IfStep

main.steps/TopIf.branches/Branch:
  is: IfBranch
  condition: Flag

main.steps/TopIf.branches/Branch.steps/ThenStep:
  is: FormulaStep
  code: "3"

main.steps/TopIf.branches/Branch 2:
  is: IfBranch
  condition: Flag

main.steps/TopIf.branches/Branch 2.steps/ElseIfStep:
  is: FormulaStep
  code: "4"
