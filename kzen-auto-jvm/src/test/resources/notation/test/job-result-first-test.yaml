# `keep: first` fixture (JobSignatureTest): the source streams (1..3) as Int payloads and the ResultSink keeps
# the FIRST element (1) as the declared `main` result — the stream still drains to completion. Counterpart to
# the default keep-last lane exercised everywhere else. Ports BLANK -> JobChannelSynthesis derives the channel
# from Worker document order.
main:
  is: Job
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.workers/source:
  is: FormulaSourceWorker
  code: "(1..3)"

main.workers/collect:
  is: ResultSinkWorker
  keep: first
