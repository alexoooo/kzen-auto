# A tiny child Logic for the Job nested-Logic (RunWorker / JobLogicHost) tests: one Int parameter `number`,
# one FormulaStep computing `number * 10`. A Script's main result is its last step's value (see MultiStep), so
# running this to completion with number=N yields N*10 — a deterministic transform the concurrency test asserts
# per input. See JobNestedLogicTest.
main:
  is: Script

main.parameters/number:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false

main.steps/Result:
  is: FormulaStep
  code: number * 10
