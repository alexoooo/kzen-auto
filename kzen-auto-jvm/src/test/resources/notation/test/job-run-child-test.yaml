# A tiny child Logic for the Job nested-Logic (RunWorker / JobLogicHost) tests: one Int parameter `number`,
# one Result step returning `number * 10`. The Script's result is the Result step's value, so running this to
# completion with number=N yields N*10 — a deterministic transform the concurrency test asserts per input.
# See JobNestedLogicTest.
main:
  is: Script
  results:
    main:
      class: kotlin.Int
      generics: []
      nullable: false

main.parameters/number:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false

main.steps/Result:
  is: ResultStep
  code: number * 10
