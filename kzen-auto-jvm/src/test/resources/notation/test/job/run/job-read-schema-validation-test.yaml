main:
  is: Job

main.formats/input:
  is: ConfiguredCsv
  catalogVisible: false
  schema: test/job/run/job-read-schema-source-test.yaml#main

main.sources/input:
  is: FileDataSource
  format: main.formats/input

main.workers/read:
  is: ReadWorker
  source: main.sources/input

main.workers/write:
  is: CsvWriterWorker
  path: build/job-read-schema-validation.csv
