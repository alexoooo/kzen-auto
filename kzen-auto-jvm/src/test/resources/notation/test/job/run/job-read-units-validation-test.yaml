main:
  is: Job

main.sources/input:
  is: FileDataSource
  files:
    - location: build/job-read/validation-input.csv

main.workers/read:
  is: ReadWorker
  source: main.sources/input
  emit: units

main.workers/readPart:
  is: ReadPartWorker
  role: main

main.workers/write:
  is: CsvWriterWorker
  path: build/job-read/validation-output.csv
