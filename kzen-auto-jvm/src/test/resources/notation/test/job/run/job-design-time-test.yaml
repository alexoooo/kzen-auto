main:
  is: Job

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/job-design-time/in/a.csv
    - location: build/job-design-time/in/b.csv
  missing: skip

main.workers/parse:
  is: Parse

main.workers/filter:
  is: FilterWorker
  where: extra != null

main.workers/write:
  is: CsvWriterWorker
  path: build/job-design-time/out.csv
