# FormatWorkerTest: records grouped by a column whose values come back, so the groups interleave.
main:
  is: Job

main.workers/files:
  is: FileSourceWorker
  directory: build/format-worker/column
  filter: .csv

main.workers/parse:
  is: Parse

main.workers/format:
  is: Format
  groupBy: group

main.workers/sink:
  is: BytesSinkWorker
