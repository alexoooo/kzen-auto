# FormatWorkerTest: a format whose schema names other columns than the records have.
main:
  is: Job

main.formats/schema:
  is: ConfiguredCsv
  catalogVisible: false
  schema: test/job/content/content-schema-test.yaml#main

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/format-worker/superset/a.csv
    - location: build/format-worker/superset/b.csv

main.workers/parse:
  is: Parse

main.workers/format:
  is: Format
  format: main.formats/schema

main.workers/sink:
  is: BytesSinkWorker
