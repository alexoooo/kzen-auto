# Order-driven channel synthesis (JobExecutionTest.synthesizedLinearPipeline*): a linear
# reader -> filter -> writer pipeline with ALL Worker channel ports BLANK and NO Channel objects. The run only
# succeeds if JobChannelSynthesis derives the two channels from Worker document order (reader.output ->
# filter.input, filter.output -> writer.input) and wires them in the in-memory run copy.


main:
  is: Job

main.workers/reader:
  is: FileSourceWorker
  files:
    - location: build/job-synth-linear/input.csv

main.workers/filter:
  is: FilterWorker
  where: 'flag == "yes"'

main.workers/writer:
  is: CsvWriterWorker
  path: build/job-synth-linear/output.csv
