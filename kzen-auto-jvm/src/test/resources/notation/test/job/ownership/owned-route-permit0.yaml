# OwnedRouteTest route "permit0" (archetypes in owned-route-test.yaml).

# Arena-backed source (one permit) behind a batch of four, at channel capacities 0, 1 and 4: an owned item must
# flush at once or the source parks on a permit only that item's close would return.
main:
  is: Job

main.channels/items:
  is: Channel
  capacity: 0
  batchSize: 4

main.workers/source:
  is: OwnedSourceWorker
  output: main.channels/items

main.workers/sink:
  is: ObservingSinkWorker
  input: main.channels/items
  label: sink
