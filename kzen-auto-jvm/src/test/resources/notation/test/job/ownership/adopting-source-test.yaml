# Test fixture for ResourceTeardownTest: a source that retains resources through its own frame and
# emits scalars, feeding the collecting sink; the frame's settle must close every retained resource.


AdoptingSourceWorker:
  abstract: true
  is: Worker
  title: "Adopting Source (test)"
  class: tech.kzen.auto.server.objects.job.worker.test.AdoptingSourceWorker
  output: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
    selfLocation:
      is: ObjectLocation
      by: Self


main:
  is: Job

main.channels/items:
  is: Channel

main.workers/source:
  is: AdoptingSourceWorker
  output: main.channels/items

main.workers/sink:
  is: CollectingSinkWorker
  input: main.channels/items
