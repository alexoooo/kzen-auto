# OwnedSourceRouteTest route "listmigration": a plain list of closeable elements behind a gated sink; the
# migration re-evaluates and skips the delivered prefix, closing the skipped duplicates at once.
main:
  is: Job

main.channels/items:
  is: Channel
  capacity: 4
  batchSize: 1

main.workers/source:
  is: FormulaSourceWorker
  output: main.channels/items
  code: 'tech.kzen.auto.server.exec.job.ownership.ClosingStreams.resources(40)'

main.workers/sink:
  is: GatedCountingSinkWorker
  input: main.channels/items
  note: original
