# OwnedRouteTest route "scalar" (archetypes in owned-route-test.yaml).

# source → project to a scalar → sink
main:
  is: Job

main.channels/items:
  is: Channel

main.channels/names:
  is: Channel

main.workers/source:
  is: OwnedSourceWorker
  output: main.channels/items

main.workers/transform:
  is: ForwardingTransformWorker
  input: main.channels/items
  output: main.channels/names
  mode: scalar

main.workers/sink:
  is: ObservingSinkWorker
  input: main.channels/names
  label: sink
