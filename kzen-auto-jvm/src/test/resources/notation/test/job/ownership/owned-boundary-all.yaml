# OwnershipBoundaryTest route "all": owned records kept (all) as the Job's result.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/items:
  is: Channel

main.workers/source:
  is: OwnedSourceWorker
  output: main.channels/items

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/items
  keep: all
