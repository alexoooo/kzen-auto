# OwnershipBoundaryTest route "opaque": an owned opaque handle reaching a Result fails by name.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/items:
  is: Channel

main.workers/source:
  is: OwnedSourceWorker
  output: main.channels/items

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/items
  keep: last
