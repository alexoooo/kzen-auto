# Engine-side Job port (JobNotationTest): a linear reader -> filter -> writer pipeline with ALL Worker channel
# ports BLANK and NO Channel objects, so the run only succeeds if JobChannelSynthesis derives the two channels
# from Worker document order (reader.output -> filter.input, filter.output -> writer.input) and wires them.
# Mirrors job-synth-linear-test.yaml but with its own build dir so it can't collide with JobExecutionTest.


main:
  is: Job

# A deliberately blank source is in the Job graph but outside workers: it must construct without resolving,
# and must remain invisible to channel derivation and execution of the unchanged worker pipeline.
main.sources/unused:
  is: FileDataSource

main.workers/reader:
  is: FileSourceWorker
  files:
    - location: build/job-engine-linear/input.csv

main.workers/filter:
  is: FilterWorker
  where: 'flag == "yes"'

main.workers/writer:
  is: CsvWriterWorker
  path: build/job-engine-linear/output.csv
