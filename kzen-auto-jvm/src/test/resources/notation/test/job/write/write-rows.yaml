# WriteWorkerTest: rows straight into Write, with no Format to make bytes of them.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/write-worker/in/a.csv
    - location: build/write-worker/in/b.csv
    - location: build/write-worker/in/big.csv
    - location: build/write-worker/in/c.csv
  missing: skip

main.workers/parse:
  is: Parse
  format: auto-jvm/datasource/configured-delimited-format.yaml#ConfiguredCsv

main.workers/write:
  is: Write
  directory: build/write-worker/out
  compression: none

main.workers/collect:
  is: ResultSinkWorker
  keep: all
