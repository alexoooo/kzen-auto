  # WriteWorkerTest: the rows of the written output (or, by an edit, of the inputs).
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/write-worker/out/output.csv

main.workers/parse:
  is: Parse
  format: auto-jvm/datasource/configured-delimited-format.yaml#ConfiguredCsv

main.workers/collect:
  is: ResultSinkWorker
  keep: all
