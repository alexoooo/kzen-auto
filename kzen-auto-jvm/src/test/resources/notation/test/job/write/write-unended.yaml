# WriteWorkerTest: as write-bytes.yaml, with the chunks that end an output dropped on their way to Write.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/files:
  is: FileSourceWorker
  directory: build/write-worker/in
  filter: .csv

main.workers/parse:
  is: Parse
  format: auto-jvm/datasource/configured-delimited-format.yaml#ConfiguredCsv

main.workers/format:
  is: Format

main.workers/drop:
  is: ChunkEndDropWorker

main.workers/write:
  is: Write
  directory: build/write-worker/out
  compression: none

main.workers/collect:
  is: ResultSinkWorker
  keep: all
