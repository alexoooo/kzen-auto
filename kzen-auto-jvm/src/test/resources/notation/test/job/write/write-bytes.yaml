# WriteWorkerTest: rows Parsed and Formatted into chunks of Bytes, which Write puts in files (the grouping, the
# names, the compression and the existing policy are edited per test).
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/write-worker/in/a.csv
    - location: build/write-worker/in/b.csv
    - location: build/write-worker/in/big.csv
    - location: build/write-worker/in/c.csv
  missing: skip

main.workers/parse:
  is: Parse
  format: auto-jvm/datasource/configured-delimited-format.yaml#ConfiguredCsv

main.workers/format:
  is: Format

main.workers/write:
  is: Write
  directory: build/write-worker/out
  compression: none

main.workers/collect:
  is: ResultSinkWorker
  keep: all
