# RecyclableRouteTest route "result-all" (archetypes in recycle-test.yaml): source → result (keep all).
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/source:
  is: RecyclingSourceWorker
  count: 5

main.workers/collect:
  is: ResultSinkWorker
  keep: all
