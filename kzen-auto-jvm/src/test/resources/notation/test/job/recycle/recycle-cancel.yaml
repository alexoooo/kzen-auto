# RecyclableRouteTest route "cancel" (archetypes in recycle-test.yaml): source → a gated sink that never drains, so
# the run is cancelled with values in flight.
main:
  is: Job

main.channels/items:
  is: Channel
  capacity: 2
  batchSize: 8

main.workers/source:
  is: RecyclingSourceWorker
  output: main.channels/items
  count: 1000000

main.workers/sink:
  is: RecyclableSinkWorker
  input: main.channels/items
  gate: true
