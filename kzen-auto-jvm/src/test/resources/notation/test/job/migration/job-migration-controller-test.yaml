main:
  is: Job

# Small batch + buffer so a few step wavefronts leave the Preview partially filled (count > 0) yet far from
# done — the stable paused state JobStateMigrationTest migrates from.
main.channels/raw:
  is: Channel
  capacity: 1

# PreviewWorker requires a serve endpoint; non-external (no UI bridge) keeps the run on the plain
# quiescence/deadlock path (no external-channel suspension of deadlock detection).
main.channels/queries:
  is: DuplexChannel

main.channels/reader files:
  is: Channel

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/reader files
  files:
    - location: build/job-migration-controller/input.csv

main.workers/reader Parse:
  is: Parse
  input: main.channels/reader files
  output: main.channels/raw

main.workers/preview:
  is: PreviewWorker
  input: main.channels/raw
  serve: main.channels/queries
  sample: 1000
