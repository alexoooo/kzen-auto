# Script -> RunStep -> Job round trip (J2 JobSignatureTest.scriptRunStepBindsArgumentsIntoHostedJob): a FormulaStep
# produces listOf(1, 2, 3); a RunStep hosts the parameterized child Job (job-signature-child-test.yaml#main),
# binding the list to the Job's `items` parameter; a ResultStep ends the Script with the RunStep's value as the
# result. The Job streams the list and its sink keeps the LAST element, so the Script result is 3.
main:
  is: Script
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: false

main.steps/Items:
  is: FormulaStep
  code: "listOf(1, 2, 3)"

main.steps/RunJob:
  is: RunStep
  instructions: "test/job/signature/job-signature-child-test.yaml#main"
  arguments:
    items: main.steps/Items

main.steps/Result:
  is: ResultStep
  code: RunJob
