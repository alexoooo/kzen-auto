# Derivation net for JobSignatureCapability: INPUTS come from the `parameters` branch of typed ParameterBinding
# declarations — an untyped one (the archetype default types it Any), a String-typed one, and a generic
# List<Int> (proves TypeMetadata parsing incl. generics) — in document order; OUTPUTS come from the document's
# declared `results` signature map (Script parity) — `main` plus two named components, in declaration order,
# independent of the sink Workers. The ResultSink Workers below yield INTO those components; a 3rd-party
# ResultSink SUBTYPE proves inheritance-chain classification (CC-17), and a plain non-signature Worker
# classifies false. Never run: only its notation + metadata are read.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true
    summary:
      class: kotlin.Int
      generics: []
      nullable: false
    typed:
      class: kotlin.String
      generics: []
      nullable: false

main.parameters/items:
  is: ParameterBinding

main.parameters/records:
  is: ParameterBinding
  type:
    class: kotlin.String
    generics: []
    nullable: false

main.parameters/counts:
  is: ParameterBinding
  type:
    class: kotlin.collections.List
    generics:
      - class: kotlin.Int
        generics: []
        nullable: false
    nullable: false

# Plain source, not a signature marker -> not a ResultSink.
main.workers/plain:
  is: FormulaSourceWorker

# Blank result -> the `main` output component (the hosts' single-positional harvest convention).
main.workers/result:
  is: ResultSinkWorker

# Named result -> the `summary` output component.
main.workers/namedResult:
  is: ResultSinkWorker
  result: "summary"

# 3rd-party ResultSink subtype -> classifies via the inheritance chain (its component type comes from the
# declared `results` map above, like any sink's).
main.workers/subtypeResult:
  is: TypedResultSink
  result: "typed"

main.workers/writerYielder:
  is: TestResultYielder
  result: typed


#######################################################################################################################
# Test-only archetype (unique name, declared once, so there's no whole-graph reference ambiguity): a user-defined
# ResultSink subtype reusing the production class, with a typed input port. Must classify as a ResultSink purely
# via the inheritance chain, with no edit to JobSignatureCapability.
TypedResultSink:
  abstract: true
  is: ResultSink
  class: tech.kzen.auto.server.objects.job.worker.ResultSinkWorker
  input: ""
  meta:
    input:
      is: ChannelInput
      of: String
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


TestResultYielder:
  abstract: true
  is: ResultYielder
