main:
  is: Job

main.channels/data:
  is: Channel
  capacity: 8

main.channels/reader files:
  is: Channel

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/reader files
  files:
    - location: build/job-missing-input/does-not-exist.csv

main.workers/reader Parse:
  is: Parse
  input: main.channels/reader files
  output: main.channels/data

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/data
  path: build/job-missing-input/output.csv
