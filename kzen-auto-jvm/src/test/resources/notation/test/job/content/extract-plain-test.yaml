# ExtractWorkerTest "plain": File(units) -> Extract -> Filter(*.txt) -> Write -> ResultSink keep: all
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/members:
  is: Channel

main.channels/entries:
  is: Channel

main.channels/written:
  is: Channel

main.channels/files:
  is: Channel

main.workers/Archive:
  is: FileSourceWorker
  files:
    - location: build/content-scope/plain/input.tar.gz
  output: main.channels/files

main.workers/Extract:
  is: Extract
  input: main.channels/files
  output: main.channels/members

main.workers/Select:
  is: FilterWorker
  input: main.channels/members
  output: main.channels/entries
  where: 'name.endsWith(".txt")'

main.workers/Write:
  is: Write
  input: main.channels/entries
  output: main.channels/written
  directory: build/content-scope/plain/out
  coding: none

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/written
  keep: all
