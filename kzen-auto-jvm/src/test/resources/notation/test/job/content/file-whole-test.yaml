# WholeFileFormatTest: File (format: Whole file) -> ResultSink; the CSV is handed on as one file, never read
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.formats/whole:
  is: WholeFile
  catalogVisible: false

main.channels/files:
  is: Channel

main.workers/Files:
  is: FileSourceWorker
  files:
    - location: build/content-scope/whole/big.csv
  format: main.formats/whole
  output: main.channels/files

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/files
  keep: all
