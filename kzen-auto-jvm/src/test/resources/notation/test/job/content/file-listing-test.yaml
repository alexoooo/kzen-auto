# ArchiveListingTest: File (automatic format) over a .tar.gz -> ResultSink; one row per archive member
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/rows:
  is: Channel

main.channels/Archive files:
  is: Channel

main.workers/Archive:
  is: FileSourceWorker
  files:
    - location: build/content-scope/listing/input.tar.gz
  output: main.channels/Archive files

main.workers/Archive Parse:
  is: Parse
  input: main.channels/Archive files
  output: main.channels/rows

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/rows
  keep: all
