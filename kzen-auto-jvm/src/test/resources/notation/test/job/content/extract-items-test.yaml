# ExtractWorkerTest "items": File (emit left automatic) -> Extract -> Write; Extract takes files, so File hands
# the archive on whole instead of listing it
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/entries:
  is: Channel

main.channels/written:
  is: Channel

main.channels/files:
  is: Channel

main.workers/Archive:
  is: FileSourceWorker
  files:
    - location: build/content-scope/items/input.tar.gz
  output: main.channels/files

main.workers/Extract:
  is: Extract
  input: main.channels/files
  members: []
  output: main.channels/entries

main.workers/Write:
  is: Write
  input: main.channels/entries
  output: main.channels/written
  directory: build/content-scope/items/out
  name: "${name}${extension}"

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/written
  keep: all
