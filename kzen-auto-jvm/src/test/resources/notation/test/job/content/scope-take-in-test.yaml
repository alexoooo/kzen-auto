# ScopeReadPartTest "take-in": Archive(20 entries) -> [Take(10), Write] -> ResultSink keep: all
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/written:
  is: Channel

main.workers/Archive:
  is: EntryScope
  path: build/content-scope/take-in/input.tar.gz
  entries: []
  output: main.channels/written

main.workers/Archive.body/Take:
  is: ScopeTake
  count: 10

main.workers/Archive.body/Write:
  is: ContentWriter
  directory: build/content-scope/take-in/out

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/written
  keep: all
