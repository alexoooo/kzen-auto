# EntryScopeWorkerTest "fail": Archive(EntryScope) -> body -> ResultSink keep: all
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/written:
  is: Channel

main.workers/Archive:
  is: EntryScope
  path: build/content-scope/fail/input.tar.gz
  entries: []
  output: main.channels/written

main.workers/Archive.body/Fail:
  is: FailingBody

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/written
  keep: all
