# ExtractReadPartTest "sort": rows leaving the entry are independent, so a Sort (an accumulator) may retain them
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.formats/csv:
  is: ConfiguredCsv
  catalogVisible: false
  schema: test/job/content/content-schema-test.yaml#main

main.channels/entries:
  is: Channel

main.channels/rows:
  is: Channel

main.channels/sorted:
  is: Channel

main.channels/files:
  is: Channel

main.workers/Archive:
  is: FileSourceWorker
  files:
    - location: build/content-scope/sort/input.tar.gz
  emit: units
  output: main.channels/files

main.workers/Extract:
  is: Extract
  input: main.channels/files
  members:
    - bar.csv
  output: main.channels/entries

main.workers/Read:
  is: ReadPartWorker
  input: main.channels/entries
  output: main.channels/rows
  format: main.formats/csv

main.workers/sort:
  is: SortWorker
  input: main.channels/rows
  output: main.channels/sorted
  sort:
    "0|a": false

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/sorted
  keep: all
