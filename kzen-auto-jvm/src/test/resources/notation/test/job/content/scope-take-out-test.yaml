# ScopeReadPartTest "take-out": Archive(big.csv) -> ScopeReadPart -> Take(10) -> ResultSink keep: all
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.formats/csv:
  is: ConfiguredCsv
  catalogVisible: false

main.channels/rows:
  is: Channel

main.channels/taken:
  is: Channel

main.workers/Archive:
  is: EntryScope
  path: build/content-scope/take-out/input.tar.gz
  entries:
    - big.csv
  output: main.channels/rows

main.workers/Archive.body/Read:
  is: ScopeReadPart
  format: main.formats/csv

main.workers/take:
  is: TakeWorker
  input: main.channels/rows
  output: main.channels/taken
  count: 10

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/taken
  keep: all
