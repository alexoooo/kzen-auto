# EntryScopeWorkerTest "escape": Archive(EntryScope) -> body -> ResultSink keep: all
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/written:
  is: Channel

main.workers/Archive:
  is: EntryScope
  path: build/content-scope/escape/input.tar.gz
  entries: []
  output: main.channels/written

main.workers/Archive.body/Write:
  is: ContentWriter
  directory: build/content-scope/escape/out

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/written
  keep: all
