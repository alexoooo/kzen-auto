# Test-only Workers for the borrowed-elements tests (ExtractWorkerTest): each consumes an Entry inside its
# callback in a way the protocol must handle, and emits nothing.
StashingWorker:
  abstract: true
  is: Worker
  title: "Stashing (test)"
  class: tech.kzen.auto.server.objects.job.worker.content.StashingWorker
  input: ""
  output: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
    output:
      is: ChannelOutput
      creator: JobChannelCreator
    selfLocation:
      is: ObjectLocation
      by: Self


