# ExtractMigrationTest: File(units) -> Extract(big.csv) -> Read part -> Summary over a channel of capacity 1, then ResultSink
# keep: last; the sink is edited while the source is lending its one large entry
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.formats/csv:
  is: ConfiguredCsv
  catalogVisible: false

main.channels/entries:
  is: Channel

main.channels/rows:
  is: Channel
  capacity: 1

main.channels/summarized:
  is: Channel

main.channels/files:
  is: Channel

main.workers/Archive:
  is: FileSourceWorker
  files:
    - location: build/content-scope/migrate-summary/input.tar.gz
  output: main.channels/files

main.workers/Extract:
  is: Extract
  input: main.channels/files
  members:
    - big.csv
  output: main.channels/entries

main.workers/Read:
  is: Parse
  input: main.channels/entries
  output: main.channels/rows
  format: main.formats/csv

main.workers/summary:
  is: SummaryWorker
  input: main.channels/rows
  output: main.channels/summarized

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/summarized
  keep: last
  result: ""
