# ExtractWorkerTest "block": File(units) -> Extract -> BlockingWorker (test) -> ResultSink keep: all
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.channels/entries:
  is: Channel

main.channels/written:
  is: Channel

main.channels/files:
  is: Channel

main.workers/Archive:
  is: FileSourceWorker
  files:
    - location: build/content-scope/block/input.tar.gz
  output: main.channels/files

main.workers/Extract:
  is: Extract
  input: main.channels/files
  members: []
  output: main.channels/entries

main.workers/Blocking:
  is: BlockingWorker
  input: main.channels/entries
  output: main.channels/written

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/written
  keep: all
