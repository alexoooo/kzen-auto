# ExtractReadPartTest "read" reference: the same CSV extracted to a file, read by FileSourceWorker
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.formats/csv:
  is: ConfiguredCsv
  catalogVisible: false
  schema: test/job/content/content-schema-test.yaml#main

main.channels/rows:
  is: Channel

main.channels/read files:
  is: Channel

main.workers/read:
  is: FileSourceWorker
  output: main.channels/read files
  files:
    - location: build/content-scope/read/bar.csv

main.workers/read Parse:
  is: Parse
  input: main.channels/read files
  output: main.channels/rows
  format: main.formats/csv

main.workers/collect:
  is: ResultSinkWorker
  input: main.channels/rows
  keep: all
