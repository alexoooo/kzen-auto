# ParseWorkerAutomaticTest: small .csv files whose names choose CSV under Automatic, columns combined.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/parse-automatic/in/measurements-1.csv
    - location: build/parse-automatic/in/measurements-2.csv

main.workers/parse:
  is: Parse

main.workers/collect:
  is: ResultSinkWorker
  keep: all
