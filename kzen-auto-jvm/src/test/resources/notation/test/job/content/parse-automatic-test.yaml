# ParseWorkerAutomaticTest: small text files whose format and header Parse detects (Automatic), columns combined.
main:
  is: Job
  results:
    main:
      class: kotlin.Any
      generics: []
      nullable: true

main.workers/files:
  is: FileSourceWorker
  files:
    - location: build/parse-automatic/in/measurements-1.txt
    - location: build/parse-automatic/in/measurements-2.txt

main.workers/parse:
  is: Parse

main.workers/collect:
  is: ResultSinkWorker
  keep: all
