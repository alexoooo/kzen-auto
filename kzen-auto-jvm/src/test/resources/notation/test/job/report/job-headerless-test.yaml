main:
  is: Job

main.formats/input:
  is: ConfiguredCsv
  catalogVisible: false
  delimiter: ";"
  header: infer-labels

main.channels/raw:
  is: Channel
  capacity: 8

main.channels/kept:
  is: Channel
  capacity: 8

main.channels/reader files:
  is: Channel

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/reader files
  files:
    - location: build/job-headerless/input.csv

main.workers/reader Parse:
  is: Parse
  input: main.channels/reader files
  output: main.channels/raw
  format: main.formats/input

main.workers/filter:
  is: FilterWorker
  input: main.channels/raw
  output: main.channels/kept
  where: 'c0 == "Lviv"'

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/kept
  path: build/job-headerless/output.csv
  delimiter: ";"
  header: false
