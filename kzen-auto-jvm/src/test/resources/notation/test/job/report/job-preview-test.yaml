main:
  is: Job

main.channels/raw:
  is: Channel
  capacity: 8

# UI-facing duplex channel the Preview worker serves slice queries on (the bridge is its client).
main.channels/queries:
  is: DuplexChannel
  external: true

main.channels/reader files:
  is: Channel

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/reader files
  files:
    - location: build/job-preview/input.csv

main.workers/reader Parse:
  is: Parse
  input: main.channels/reader files
  output: main.channels/raw

main.workers/preview:
  is: PreviewWorker
  input: main.channels/raw
  serve: main.channels/queries
  sample: 1000
