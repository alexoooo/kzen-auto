main:
  is: Job

main.channels/raw:
  is: Channel
  capacity: 8

main.channels/filtered:
  is: Channel
  capacity: 8

main.channels/reader files:
  is: Channel

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/reader files
  files:
    - location: build/job-slice-test/input.csv

main.workers/reader Parse:
  is: Parse
  input: main.channels/reader files
  output: main.channels/raw

main.workers/filter:
  is: FilterWorker
  input: main.channels/raw
  output: main.channels/filtered
  where: 'flag == "yes"'

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/filtered
  path: build/job-slice-test/output.csv
