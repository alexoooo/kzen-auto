main:
  is: Job

main.channels/raw:
  is: Channel
  capacity: 8

main.channels/filtered:
  is: Channel
  capacity: 8

main.workers/reader:
  is: CsvReaderWorker
  output: main.channels/raw
  path: build/job-slice-test/input.csv

main.workers/filter:
  is: FilterWorker
  input: main.channels/raw
  output: main.channels/filtered
  where: 'flag eq "yes"'

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/filtered
  path: build/job-slice-test/output.csv
