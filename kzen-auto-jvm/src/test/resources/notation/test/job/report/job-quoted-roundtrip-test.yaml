main:
  is: Job

main.channels/data:
  is: Channel
  capacity: 8

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/data
  files:
    - location: build/job-quoted-roundtrip/input.csv

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/data
  path: build/job-quoted-roundtrip/output.csv
