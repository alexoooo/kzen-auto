main:
  is: Job

main.channels/raw:
  is: Channel
  capacity: 8

main.channels/kept:
  is: Channel
  capacity: 8

main.channels/reader files:
  is: Channel

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/reader files
  files:
    - location: build/job-filter-expr/input.csv

main.workers/reader Parse:
  is: Parse
  input: main.channels/reader files
  output: main.channels/raw

main.workers/filter:
  is: FilterWorker
  input: main.channels/raw
  output: main.channels/kept
  where: 'amount.toBigDecimal() > BigDecimal("2")'

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/kept
  path: build/job-filter-expr/output.csv
