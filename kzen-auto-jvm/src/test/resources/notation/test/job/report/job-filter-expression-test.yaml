main:
  is: Job

main.channels/raw:
  is: Channel
  capacity: 8

main.channels/kept:
  is: Channel
  capacity: 8

main.workers/reader:
  is: CsvReaderWorker
  output: main.channels/raw
  path: build/job-filter-expr/input.csv

main.workers/filter:
  is: FilterWorker
  input: main.channels/raw
  output: main.channels/kept
  where: 'amount.number > 2'

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/kept
  path: build/job-filter-expr/output.csv
