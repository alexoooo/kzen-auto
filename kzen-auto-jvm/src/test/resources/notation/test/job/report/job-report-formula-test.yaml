main:
  is: Job

main.channels/raw:
  is: Channel
  capacity: 8

main.channels/computed:
  is: Channel
  capacity: 8

main.workers/reader:
  is: FileSourceWorker
  output: main.channels/raw
  files:
    - location: build/job-formula-test/input.csv

main.workers/formula:
  is: FormulaWorker
  input: main.channels/raw
  output: main.channels/computed
  formula:
    total: "qty.toBigDecimal() * price.toBigDecimal()"

main.workers/writer:
  is: CsvWriterWorker
  input: main.channels/computed
  path: build/job-formula-test/output.csv
