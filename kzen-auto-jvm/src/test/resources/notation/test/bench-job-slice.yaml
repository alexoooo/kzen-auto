main:
  is: Job

main.workers/reader:
  is: FileSourceWorker
  files:
    - location: build/bench/slice/input.csv

main.workers/reader Parse:
  is: Parse

main.workers/filter:
  is: FilterWorker
  where: 'flag == "yes"'

main.workers/writer:
  is: CsvWriterWorker
  path: build/bench/slice/job-output.csv
