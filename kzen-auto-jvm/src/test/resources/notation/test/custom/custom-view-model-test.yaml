# Self-contained Custom-document fixture for CustomViewModelBuilderTest. Deliberately independent of the bundled
# main/Custom.yaml (which the test harness excludes from its notation scan anyway), so curating that starter
# document can never break these pins.

main:
  is: CustomDocument
  exports:
    - "main.objects/Greeting"

ViewModelPrototype:
  is: Prototype
  abstract: true
  class: tech.kzen.auto.server.objects.custom.test.AdhocDetached
  meta:
    tags:
      - detached
      - logic
    named:
      is: ViewModelNamed
      editor: SelectObjectEditor

ViewModelNamed:
  abstract: true
  class: tech.kzen.auto.server.objects.custom.test.AdhocNamed

ViewModelNamedImpl:
  is: ViewModelNamed
  class: tech.kzen.auto.server.objects.custom.test.AdhocNamedImpl
  name: "fixture"
  meta:
    name: String

ThirdPartyRecordSchema:
  is: AuthoredRecordSchema
  abstract: true
  fields:
    amount:
      class: kotlin.Int
      of: []
      nullable: false

NovelCapability:
  abstract: true
  class: tech.kzen.auto.server.objects.custom.test.AdhocNamedImpl
  customCreate:
    category: "Widgets"
    label: "Named widget"
    defaults:
      - name
  meta:
    name: String
    customCreate: CustomCreationSpec

NovelPrototype:
  is:
    - NovelCapability
    - CustomCreatable
  abstract: true
  name: "created"

main.objects/Greeting:
  is: ViewModelPrototype
  named: ViewModelNamedImpl

main.objects/Other:
  is: ViewModelPrototype
  named: ViewModelNamedImpl
