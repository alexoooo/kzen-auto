# Deterministic end-to-end channel-carryover migration fixture (JobMigrationCarryoverTest). A gated source
# streams into a small buffered channel drained by a sink whose first instance never consumes — so the source
# fills the buffer and parks mid-send, the exact "buffered + parked-mid-send" state JobExecution.migrate must
# carry across a pause / edit / continue without dropping or replaying a row. The external duplex `signal`
# channel (unserved) is present only to suspend deadlock detection while the gated state is quiescent, so the
# test can pause precisely at it. The worker archetypes are test-only (registered via GatedWorkerTestModule).


#######################################################################################################################
# Test-only Worker archetypes (the production analogues live in notation/auto-jvm/job/job-worker.yaml).

GatedSourceWorker:
  abstract: true
  is: Worker
  title: "Gated Source (test)"
  class: tech.kzen.auto.server.objects.job.worker.test.GatedSourceWorker
  output: ""
  total: 0
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
    total: Int
    selfLocation:
      is: ObjectLocation
      by: Self


GatedCountingSinkWorker:
  abstract: true
  is: Worker
  title: "Gated Counting Sink (test)"
  class: tech.kzen.auto.server.objects.job.worker.test.GatedCountingSinkWorker
  input: ""
  note: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
    note: String
    selfLocation:
      is: ObjectLocation
      by: Self


#######################################################################################################################
# The concrete Job: source -> buffered channel -> gated sink, plus the deadlock-suppressing external channel.

main:
  is: Job

main.channels/raw:
  is: Channel
  buffer: 4

main.channels/signal:
  is: DuplexChannel
  external: true

main.workers/source:
  is: GatedSourceWorker
  output: main.channels/raw
  total: 50

main.workers/sink:
  is: GatedCountingSinkWorker
  input: main.channels/raw
  note: ""
