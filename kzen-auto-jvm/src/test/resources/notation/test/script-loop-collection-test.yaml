# A loop run purely for its side effects: it is the Script's LAST root step, and nothing references it.
# ScriptLogic discards the root sequence's value (the result comes from a ResultStep, of which there is none
# here), so no one can ever read what this loop collected -> ForEachStep must not collect it.
#
# The referenced counterpart is script-engine-foreach-test.yaml, whose `Total` reads `Loop.sum()`.

main:
  is: Script

main.steps/Range:
  is: FormulaStep
  code: "1..3"

main.steps/Loop:
  is: ForEachStep
  items: main.steps/Range

main.steps/Loop.item/Item:
  is: ForEachItemBinding

main.steps/Loop.steps/Doubled:
  is: FormulaStep
  code: "Item * 2"
