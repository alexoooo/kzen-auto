main:
  is: Script
  results:
    main:
      class: kotlin.String
      generics: []
      nullable: false

main.parameters/threshold:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false

main.parameters/tags:
  is: ParameterBinding
  type:
    class: kotlin.collections.List
    generics:
      - class: kotlin.String
        generics: []
        nullable: false
    nullable: false

main.steps/Doubled:
  is: FormulaStep
  code: threshold * 2

main.steps/FirstTag:
  is: FormulaStep
  code: tags.first()

# Surfaces the parameter-derived value as the Script result (the observation point for the run tests).
main.steps/Result:
  is: ResultStep
  code: FirstTag
