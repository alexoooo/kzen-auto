
#######################################################################################################################
# Job paradigm core types (common SPI). Mirrors common-flow.yaml: these are the abstract notation archetypes
# pinned to the common api interfaces a Worker sees. Concrete Workers and the Channel impl live in
# notation/auto-jvm/job/job-jvm.yaml; the Job document archetype itself is in common-document.yaml.


Worker:
  abstract: true
  class: tech.kzen.auto.common.paradigm.job.api.Worker
  # The JS card component this Worker renders as — resolved by WorkerDisplayManager (see job-js.yaml). Every Worker
  # inherits WorkerDisplayDefault; a Worker overrides it to add behaviour (see job-worker.yaml). Inert server-side
  # (a plain String, in isManaged so it's never an editor), mirroring ScriptStep's `display:` marker (see CC-17).
  display: WorkerDisplayDefault
  # Per-output channel config lives in a free-form `channels` map keyed by output-port name, e.g.
  # `channels: { output: { batchSize: 7, capacity: 3 } }` — one entry per output port, so a Worker can tune each
  # of its output channels independently. JobChannelSynthesis reads `channels.<port>.<knob>` from the upstream
  # Worker and stamps it onto that port's one-way channel (precedence: Worker value > the Job-wide default on
  # `main` > the Channel archetype default). Because it lives on the Worker it follows the Worker across rename /
  # reorder — no name-coupled override object. DELIBERATELY UNDECLARED in `meta`: a free-form map infers to no
  # metadata (NotationMetadataReader.inferMetadata returns null for a MapAttributeNotation), so it renders no
  # Worker-card editor, isn't defined, and never triggers a "Missing" drop — yet it is preserved in notation and
  # readable via firstAttribute, and its Int leaves need no String workaround. The channel's inline editor edits
  # it. Absent = inherit.
  meta:
    display: String


#######################################################################################################################
# Channel endpoint views. A Worker declares zero or more arbitrarily-named attributes of these types, each
# referencing a named Channel object; JobChannelCreator resolves the shared channel and injects the view.


ChannelInput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.job.api.ChannelInput


ChannelOutput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.job.api.ChannelOutput


#######################################################################################################################
# Duplex (request/reply) channel endpoint views. A client endpoint sends Req / receives Rsp; the single server
# endpoint (the "actor" side) receives Req / sends Rsp. JobChannelCreator resolves the shared DuplexChannel.


ChannelClient:
  abstract: true
  class: tech.kzen.auto.common.paradigm.job.api.ChannelClient


ChannelServer:
  abstract: true
  class: tech.kzen.auto.common.paradigm.job.api.ChannelServer


#######################################################################################################################
# Semantic refinement of ChannelServer: same class (inherited — no own `class:`), so JobChannelPorts.kindOf,
# JobChannelCreator, ChannelTypeDefiner, and JobChannelSynthesis keep treating a port declared with it as a plain
# serve port. A Worker declares `serve: { is: SummaryServer }` to mark itself a summary source; the summary-aware
# editors (value-set filter / pivot) find their nearest upstream one via JobServeCapability's inheritance-chain
# walk (see JobUpstreamSchema). Card rendering is chosen by the Worker's own `display:` marker instead (CC-17), so
# no PreviewServer / TableServer subtypes are needed — a plain ChannelServer serve port carries the preview /
# download pulls.


SummaryServer:
  abstract: true
  is: ChannelServer


#######################################################################################################################
# Job signature markers (semantic Worker refinements, the SummaryServer pattern): a Worker whose inheritance
# chain reaches ParameterSource declares one Job input parameter (`parameter:` names it; its output port's
# `of:` types it); one reaching ResultSink contributes one output component (`result:` names it, blank = main;
# its input port's `of:` types it). JobSignatureCapability classifies by chain membership (CC-17), so a
# third-party source/sink is recognized with no code change. The name attributes live HERE so any subtype
# inherits the declaration contract. Neither marker touches Channel/DuplexChannel — both refine Worker (which has
# an `is:` chain), so the name attributes self-define through the normal chain.


ParameterSource:
  abstract: true
  is: Worker
  parameter: ""
  meta:
    parameter: String


ResultSink:
  abstract: true
  is: Worker
  result: ""
  meta:
    result: String
