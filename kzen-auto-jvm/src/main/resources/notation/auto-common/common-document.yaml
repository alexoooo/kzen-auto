
Document:
  abstract: true
  class: tech.kzen.auto.common.objects.document.DocumentArchetype
  title: "Document"
  directory: false
  group: ""
  meta:
    title: String
    icon: String
    group: String
    objectLocation:
      is: ObjectLocation
      by: Self
    directory: Boolean


###########################################################

# Cross-cutting marker mixed into the runnable paradigms (Script / Flow / Job / Report, and any 3rd-party
# paradigm): marks a document whose `main` implements a runnable Logic. AutoConventions.isLogic tests membership
# by the inheritance chain, so a new paradigm is recognized just by mixing in `Logic` — no code edit (see CC-17).
# NB: this is a BARE marker, NOT `is: Document`. It is composed *alongside* Document — each paradigm declares
# `is: [Document, Logic]` — never inserted as an intermediate in the Document archetype hierarchy. The sidebar's
# archetype registry (project-js.yaml `archetypeLocations`) autowires `of: Document` by DIRECT `is` match, so a
# paradigm must stay a direct Document child to appear in the tree and the create menu; making Logic an `is:
# Document` intermediate silently drops every paradigm from both. The server-side analogue is the LogicDocument
# interface each paradigm's `main` archetype implements.
Logic:
  abstract: true


###########################################################

# A named slot in the ambient scope a Logic runs against — the browser a Script opens, a system-under-test
# process, a database session a plugin manages, a plain String a report header uses. First-class notation, so
# a third party introduces one with zero framework changes: declare `is: Context` and the editor, the
# validation and the runtime pick it up.
#
# Three layers, deliberately separate:
#   type       the VALUE CONTRACT — what may be bound here (class, generics, nullability). Filters editors and
#              drives the conformance checks; it is not a lookup key.
#   qualifier  names ONE member of a family statically (`primary` / `reporting`), so each statically distinct
#              member is its own pickable declaration rather than a string typed at a use site. A declared
#              qualifier resolves EXACTLY; a computed one is legal only against an unqualified declaration.
#   key        an explicit ENGINE family, replacing the one derived from `type`. It is a GLOBAL NAMESPACE and
#              a deliberate interop alias: the raw-string resource API (`StepExecution.openResource`) names
#              plain strings, and "same key => same registration" is what lets a typed step and a raw one
#              interoperate. Omit it and the address derives from the canonical full type, so ordinary
#              notation types no key at all. Two declarations resolving to the same EXACT key are reported
#              graph-wide as an alias rather than prevented.
#
# A declaration is a CONCRETE object (the archetype below carries the class the graph builds, and the value
# type lives in `type:`), so it gets rename-refactor, reordering and per-entry editing from the same machinery
# a ParameterBinding uses. Attributes that NAME a Context (`provides:` / `requires:` / `releases:` /
# `context.exports` / `context.requires`) are declared `by: Nominal` (weak references), so a dangling entry
# degrades to a validation message instead of failing the referring object's definition, and renaming a
# Context propagates into them.
Context:
  abstract: true
  class: tech.kzen.auto.common.objects.document.logic.context.ContextDeclaration
  type:
    class: kotlin.Any
    generics: []
    nullable: false
  qualifier: ""
  key: ""
  title: ""
  icon: ""
  description: ""
  meta:
    type: TypeMetadata
    qualifier: String
    key: String
    title: String
    icon: String
    description: String


###########################################################

# A place a USER can declare Contexts, and a form to write them with. Discovery is graph-wide and by
# inheritance (ContextConventions.allContexts scans every object for an `is: Context` ancestor), so this
# document is AN authoring surface, never the home: shipped Contexts stay in script-jvm.yaml, a plugin's stay
# in the plugin's own notation, and all of them reach the picker identically. Nothing registers here.
#
# The declarations are NESTED OBJECTS (`by: NestedList`), the same shape a Script's `parameters` branch uses —
# each entry is a real notation object at `main.contexts/<Name>` with its own ObjectLocation. That is not a
# style choice: a Context is a nominal symbol other documents NAME, and ObjectLocation is that identity.
# `by: Nominal` references resolve through the coalesced OBJECT map, renameObjectRefactor asserts its target
# is in that map, and allContexts iterates it — so a spec-payload list attribute (the shape ObjectRegistry's
# `classes` uses, whose entries are AttributeNotations with no location) would reach none of it.
#
# There is no `contexts: []` default: a NestedList branch is DERIVED from object paths and is never stored,
# so an empty document is just `main: {is: Contexts}` (contrast ObjectRegistry, whose `classes` is a real
# attribute and therefore must declare one).
Contexts:
  abstract: true
  is: Document
  class: tech.kzen.auto.server.objects.context.ContextsDocument
  title: "Contexts"
  icon: "material-symbols:extension"
  group: "Customize"
  meta:
    contexts:
      is: List
      of: Context
      by: NestedList


###########################################################

# Typed parameter declarations, shared by every Logic flavour with a `parameters` branch (Script and Job).
# Moved here from script-jvm.yaml when the Job document gained the same branch.

# A type for a parameter (or other typed binding). Parsed once at definition time by the definer
# into a TypeMetadata, so a binding's constructor receives the type directly. Notation shape mirrors
# TypeMetadata: { class: <qualified name>, generics: [ <nested type maps> ], nullable: <bool> }.
# Bound at the type level (mirrors ResourceClosePolicy) so any `is: TypeMetadata` attribute inherits it.
TypeMetadata:
  abstract: true
  class: tech.kzen.lib.common.model.structure.metadata.TypeMetadata
  meta:
    ref:
      by: TypeMetadataDefiner

TypeMetadataDefiner:
  class: tech.kzen.auto.common.objects.document.logic.TypeMetadataDefiner


# Coerces a parameter's optional `default` notation scalar into a typed runtime value keyed on the
# sibling `type`; absent/unparseable/unsupported-type defaults resolve to null (see the definer class).
ParameterDefaultDefiner:
  class: tech.kzen.auto.common.objects.document.logic.ParameterDefaultDefiner


# A typed parameter declaration, named by the object's own name; `type` declares its TypeMetadata
# (defaults to Any) and `default` is the value used at runtime when a run supplies no argument (omitted =
# no default). Lives in a Script's or Job's `parameters` branch. In a Script it is validated like a step
# (its type flows into ScriptValidation) and referenceable by steps, but never executed — its value is
# resolved from the run arguments on demand. In a Job only the notation is read: JobSignatureCapability
# derives the typed signature and Worker expressions (Filter / Formula / FormulaSource) see it by name.
ParameterBinding:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.logic.ParameterBinding
  icon: "material-symbols:input"
  title: "Parameter"
  type:
    class: kotlin.Any
    generics: []
    nullable: false
  meta:
    type: TypeMetadata
    default:
      is: Object
      by: ParameterDefaultDefiner


###########################################################

# TODO: factor out DocumentArchetype (concrete) vs DocumentRoot (concrete)?

Script:
  abstract: true
  is:
    - Document
    - Logic
  class: tech.kzen.auto.server.objects.script.ScriptDocument
  title: "Script"
  icon: "material-symbols:playlist-play"
  results: {}
  # The document's context declarations, read from notation by LogicContextConventions:
  #   exports:  Contexts this document OFFERS to its caller, which then owns them — and passes them further up
  #             in turn if it exports them too. A Context one of this document's steps provides but this
  #             document does not export is PRIVATE: it binds here and is disposed at this document's settle,
  #             per the providing step's closePolicy. Ownership is offered, never claimed from above.
  #   requires: Contexts a CALLER must already have provided. Asserts an outer provider the local analysis
  #             cannot see, and seeds this document's own availability so its steps validate; a document
  #             declaring one fails immediately when run directly, since nobody supplied it.
  context: {}
  meta:
    steps:
      is: List
      of: ScriptStep
      by: NestedList
    parameters:
      is: List
      of: ParameterBinding
      by: NestedList
    # Weak references (by: Nominal): data for the validator/runtime/editor — never constructor-injected,
    # never pruned when an entry dangles or names an abstract Context; renames propagate.
    context:
      is: Map
      of:
        - String
        - is: List
          of: ObjectLocation
      by: Nominal
    # The result signature: a map (component name -> TypeMetadata) parsed into the output TupleDefinition.
    # Plain data (not a live step object); empty/absent => void. Only `main` is wired today, but the map
    # shape leaves room for additional named results with no schema change.
    results:
      is: Object
      by: ResultSignatureDefiner
    selfLocation:
      is: ObjectLocation
      by: Self


ResultSignatureDefiner:
  class: tech.kzen.auto.common.objects.document.logic.ResultSignatureDefiner


ScriptStep:
  abstract: true
  class: tech.kzen.auto.server.objects.script.api.ScriptStep
  description: "Script step"
  display: ScriptStepDisplayDefault
  uses: []
  releases: ""
  meta:
    icon: String
    title: String
    description: String
    display: String
    # Context declarations — weak references (by: Nominal): data for the validator/runtime/editor, never
    # constructor-injected, never pruned when an entry dangles or names an abstract Context; renames
    # propagate. `uses` names the Contexts this step reads, `releases` the one it disposes (`binds`, the
    # third kind, lives on the ContextBinder mix-in). `nullable` on `releases` lets the empty default
    # define; `of:` is mandatory on the `uses` list.
    # (Suppressed from the step-body editor by LogicContextConventions.isContextDeclaration.)
    uses:
      is: List
      of: ObjectLocation
      by: Nominal
    releases:
      is: ObjectLocation
      nullable: true
      by: Nominal


################################################################


Flow:
  abstract: true
  is:
    - Document
    - Logic
  class: tech.kzen.auto.server.objects.flow.FlowDocument
  title: "Flow"
  icon: "material-symbols:device-hub"
  vertices: []
  edges: []
  # Same document-level context signature as Script, with the same meaning — see the Script archetype above for
  # what `exports` / `requires` each assert. Declared per-flavour rather than hoisted onto the `Logic` marker
  # deliberately (CX doc §3 J): the four flavours do NOT all carry this contract. A Report is a leaf that never
  # hosts and never exports, and a Job's values live in its Workers — nested objects that never see their own
  # Execution — so a signature on the shared marker would read as a promise three of four flavours do not keep.
  #
  # What a Flow does with it differs from Script in ONE way worth knowing here: a Flow declares no per-vertex
  # `binds` / `uses` / `releases`, so a Flow REQUIRES Contexts and passes them to the Logic its host vertices
  # run, rather than binding any itself. That is why there is no availability analysis over the DAG — there is
  # nothing vertex-local to order (CX doc §8, Phase 9).
  context: {}
  meta:
    vertices:
      is: List
      of: FlowVertex
    # Weak references (by: Nominal): data for the validator/runtime/editor — never constructor-injected,
    # never pruned when an entry dangles or names an abstract Context; renames propagate.
    context:
      is: Map
      of:
        - String
        - is: List
          of: ObjectLocation
      by: Nominal
    edges:
      is: List
      of: EdgeDescriptor
      by: EdgesDefiner
    selfLocation:
      is: ObjectLocation
      by: Self


#################################################################


Job:
  abstract: true
  is:
    - Document
    - Logic
  class: tech.kzen.auto.server.objects.job.JobDocument
  title: "Job"
  icon: "material-symbols:lan"
  # Job-wide channel defaults applied by JobChannelSynthesis to every auto-synthesized channel (the common
  # path carries no `is: Channel` object to tune). A per-channel override — the upstream Worker's own
  # per-output-port config in its `channels.<port>` map (which follows the Worker across rename / reorder) —
  # takes precedence; a manual `is: Channel` object sets its own. Read from notation only — JobDocument takes no
  # constructor arg for them (like Channel's `elementType`).
  batchSize: 1024
  capacity: 0
  results: {}
  meta:
    batchSize: Int
    capacity: Int
    workers:
      is: List
      of: Worker
      by: NestedList
    channels:
      is: List
      of: Channel
      by: NestedList
    # Typed parameter declarations (Script parity): the Job's input signature derives from these
    # (JobSignatureCapability), and every Worker expression sees them by name, typed.
    parameters:
      is: List
      of: ParameterBinding
      by: NestedList
    # The result signature (Script parity, same shape): a map (component name -> TypeMetadata) parsed
    # into the output TupleDefinition — the Job's output signature (JobSignatureCapability), which each
    # ResultSink Worker yields into by component name. Empty/absent => void.
    results:
      is: Object
      by: ResultSignatureDefiner
    selfLocation:
      is: ObjectLocation
      by: Self


