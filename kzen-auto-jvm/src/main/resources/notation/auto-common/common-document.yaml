
Document:
  abstract: true
  class: tech.kzen.auto.common.objects.document.DocumentArchetype
  title: "Document"
  directory: false
  group: ""
  meta:
    title: String
    icon: String
    group: String
    objectLocation:
      is: ObjectLocation
      by: Self
    directory: Boolean


###########################################################

# Cross-cutting marker mixed into the runnable paradigms (Script / Flow / Job / Report, and any 3rd-party
# paradigm): marks a document whose `main` implements a runnable Logic. AutoConventions.isLogic tests membership
# by the inheritance chain, so a new paradigm is recognized just by mixing in `Logic` — no code edit (see CC-17).
# NB: this is a BARE marker, NOT `is: Document`. It is composed *alongside* Document — each paradigm declares
# `is: [Document, Logic]` — never inserted as an intermediate in the Document archetype hierarchy. The sidebar's
# archetype registry (project-js.yaml `archetypeLocations`) autowires `of: Document` by DIRECT `is` match, so a
# paradigm must stay a direct Document child to appear in the tree and the create menu; making Logic an `is:
# Document` intermediate silently drops every paradigm from both. The server-side analogue is the LogicDocument
# interface each paradigm's `main` archetype implements.
Logic:
  abstract: true


###########################################################

# A named kind of run-scoped resource a Logic can provide, require, or release — the browser a Script opens,
# a system-under-test process, a database session a plugin manages. First-class notation, so a third party
# introduces one with zero framework changes: declare `is: Context` and the editor, the validation and the
# runtime pick it up.
#
# `key` is the ENGINE resource key this Context names, and it is a GLOBAL NAMESPACE: two Context objects
# declaring the same key share one registration. That is deliberate — the raw-string resource API
# (`StepExecution.openResource`) names keys as plain strings, and "same key => same registration" is what
# lets a typed step and a raw one interoperate. Deriving the key from the object's location would make
# collisions impossible but would break that interop, so the aliasing risk is carried instead and surfaced
# as a validation warning (duplicate keys are reported graph-wide).
#
# A key may be QUALIFIED at run time as "<key>:<qualifier>" (a SUT addressed by name): each qualifier is an
# independent registration, and an export carries the whole family.
#
# A concrete Context declares `abstract: true` — the standard never-instantiated-archetype pattern
# (ResourceClosePolicy, TypeMetadata, IfBranch): its `class:` carries the type a provider registers without
# GraphCreator ever constructing it. Attributes that NAME a Context (`provides:` / `requires:` / `releases:` /
# `context.exports` / `context.requires`) are declared `by: Nominal` (weak references), so a dangling entry
# degrades to a validation message instead of failing the referring object's definition, and renaming a
# Context propagates into them.
Context:
  abstract: true
  key: ""
  title: ""
  icon: ""
  description: ""
  meta:
    key: String
    title: String
    icon: String
    description: String


###########################################################

# Typed parameter declarations, shared by every Logic flavour with a `parameters` branch (Script and Job).
# Moved here from script-jvm.yaml when the Job document gained the same branch.

# A type for a parameter (or other typed binding). Parsed once at definition time by the definer
# into a TypeMetadata, so a binding's constructor receives the type directly. Notation shape mirrors
# TypeMetadata: { class: <qualified name>, generics: [ <nested type maps> ], nullable: <bool> }.
# Bound at the type level (mirrors ResourceClosePolicy) so any `is: TypeMetadata` attribute inherits it.
TypeMetadata:
  abstract: true
  class: tech.kzen.lib.common.model.structure.metadata.TypeMetadata
  meta:
    ref:
      by: TypeMetadataDefiner

TypeMetadataDefiner:
  class: tech.kzen.auto.common.objects.document.logic.TypeMetadataDefiner


# Coerces a parameter's optional `default` notation scalar into a typed runtime value keyed on the
# sibling `type`; absent/unparseable/unsupported-type defaults resolve to null (see the definer class).
ParameterDefaultDefiner:
  class: tech.kzen.auto.common.objects.document.logic.ParameterDefaultDefiner


# A typed parameter declaration, named by the object's own name; `type` declares its TypeMetadata
# (defaults to Any) and `default` is the value used at runtime when a run supplies no argument (omitted =
# no default). Lives in a Script's or Job's `parameters` branch. In a Script it is validated like a step
# (its type flows into ScriptValidation) and referenceable by steps, but never executed — its value is
# resolved from the run arguments on demand. In a Job only the notation is read: JobSignatureCapability
# derives the typed signature and Worker expressions (Filter / Formula / FormulaSource) see it by name.
ParameterBinding:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.logic.ParameterBinding
  icon: "material-symbols:input"
  title: "Parameter"
  type:
    class: kotlin.Any
    generics: []
    nullable: false
  meta:
    type: TypeMetadata
    default:
      is: Object
      by: ParameterDefaultDefiner


###########################################################

# TODO: factor out DocumentArchetype (concrete) vs DocumentRoot (concrete)?

Script:
  abstract: true
  is:
    - Document
    - Logic
  class: tech.kzen.auto.server.objects.script.ScriptDocument
  title: "Script"
  icon: "material-symbols:playlist-play"
  results: {}
  # The document's context declarations, read from notation by LogicContextConventions:
  #   exports:  Contexts this document OFFERS to its caller, which then owns them — and passes them further up
  #             in turn if it exports them too. A Context one of this document's steps provides but this
  #             document does not export is PRIVATE: it binds here and is disposed at this document's settle,
  #             per the providing step's closePolicy. Ownership is offered, never claimed from above.
  #   requires: Contexts a CALLER must already have provided. Asserts an outer provider the local analysis
  #             cannot see, and seeds this document's own availability so its steps validate; a document
  #             declaring one fails immediately when run directly, since nobody supplied it.
  context: {}
  meta:
    steps:
      is: List
      of: ScriptStep
      by: NestedList
    parameters:
      is: List
      of: ParameterBinding
      by: NestedList
    # Weak references (by: Nominal): data for the validator/runtime/editor — never constructor-injected,
    # never pruned when an entry dangles or names an abstract Context; renames propagate.
    context:
      is: Map
      of:
        - String
        - is: List
          of: ObjectLocation
      by: Nominal
    # The result signature: a map (component name -> TypeMetadata) parsed into the output TupleDefinition.
    # Plain data (not a live step object); empty/absent => void. Only `main` is wired today, but the map
    # shape leaves room for additional named results with no schema change.
    results:
      is: Object
      by: ResultSignatureDefiner
    selfLocation:
      is: ObjectLocation
      by: Self


ResultSignatureDefiner:
  class: tech.kzen.auto.common.objects.document.logic.ResultSignatureDefiner


ScriptStep:
  abstract: true
  class: tech.kzen.auto.server.objects.script.api.ScriptStep
  description: "Script step"
  display: ScriptStepDisplayDefault
  requires: []
  releases: ""
  meta:
    icon: String
    title: String
    description: String
    display: String
    # Context declarations — weak references (by: Nominal): data for the validator/runtime/editor, never
    # constructor-injected, never pruned when an entry dangles or names an abstract Context; renames
    # propagate. `nullable` on `releases` lets the empty default define; `of:` is mandatory on the list.
    # (Suppressed from the step-body editor by LogicContextConventions.isContextDeclaration.)
    requires:
      is: List
      of: ObjectLocation
      by: Nominal
    releases:
      is: ObjectLocation
      nullable: true
      by: Nominal


