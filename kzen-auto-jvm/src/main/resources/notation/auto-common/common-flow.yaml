EdgesDefiner:
  class: tech.kzen.auto.common.objects.document.flow.EdgesDefiner


EdgeDescriptor:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.model.structure.cell.EdgeDescriptor


#######################################################################################################################


# KEEP IN SYNC with the ClassName constants in FlowWiring, which match a channel marker's declared type by
# string. Both sides agreeing is all that is enforced, so both drifted together when these classes moved into
# the api/input and api/output subpackages.
OptionalInput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.input.OptionalInput


RequiredInput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.input.RequiredInput


###########################################################


OptionalOutput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.output.OptionalOutput


RequiredOutput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.output.RequiredOutput


BatchOutput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.output.BatchOutput


StreamOutput:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.output.StreamOutput


###########################################################


FlowVertex:
  abstract: true
  class: tech.kzen.auto.common.paradigm.flow.api.FlowVertex
  description: "Process data"
  meta:
    icon: String
    description: String
    row: Int
    column: Int


StreamFlowVertex:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.common.paradigm.flow.api.StreamFlowVertex


FlowWiring:
  class: tech.kzen.auto.common.objects.document.flow.FlowWiring

