
#######################################################################################################################
# Job paradigm JVM-side notation: the Channel impl (JobChannel) and the channel-wiring AttributeCreator.
# Concrete Workers (is: Worker) live alongside in this folder once they exist (M1 step 4 onward).


# Detached action computing a Job document's validation (the ScriptValidator analogue): the static
# payload-type walk over the order-driven wiring — per-Worker inferred payload types plus expression compile
# errors — consumed by the Job editor's worker cards (JobValidationStore).
JobValidator:
  class: tech.kzen.auto.server.objects.job.JobValidator


# A first-class, named, buffered conduit shared by the Workers that reference it. Workers emit / consume single
# ELEMENTS; the channel transparently groups them into batches of `batchSize` elements for transfer (the batch
# granularity — also the checkpoint / step unit: one step ≈ one batch). `capacity` is the channel capacity in
# BATCHES: 0 (the default) is a rendezvous handoff, > 0 is a backpressured buffer. `elementType` declares the
# element type carried by the channel (a TypeMetadata; empty = untyped / Any): ChannelTypeDefiner validates at
# definition time that every referencing Worker port's `of:` element type matches, and that at most one Worker
# drains it (single-reader). The type is erased at run time (JobChannel takes only `capacity` / `batchSize`); it is
# authoring/wiring metadata, so the run-time `item as In` cast in TransformWorker / SinkWorker is safe.
Channel:
  abstract: true
  class: tech.kzen.auto.server.objects.job.channel.JobChannel
  capacity: 0
  batchSize: 1024
  elementType: ""
  meta:
    capacity: Int
    batchSize: Int
    elementType:
      is: TypeMetadata
      by: ChannelTypeDefiner


# Duplex (request/reply) counterpart of Channel: client endpoints request a value and suspend until the
# single serving endpoint replies. Same `capacity` semantics (request-stream capacity). When `external: true`,
# the client side is not a Worker but the UI bridge: JobRun opens a client at launch and routes inbound
# ExecutionRequests addressed to this channel (by name) to the serving Worker (see JobRun.route).
DuplexChannel:
  abstract: true
  class: tech.kzen.auto.server.objects.job.channel.DuplexJobChannel
  capacity: 0
  external: false
  meta:
    capacity: Int
    external: Boolean


# Resolves a Worker's channel-typed attribute (ChannelInput / ChannelOutput) to a view over the single
# shared JobChannel it references. Selected per attribute via `creator: JobChannelCreator`.
JobChannelCreator:
  class: tech.kzen.auto.server.objects.job.JobChannelCreator


# Preserves a nullable nominal reference as ObjectReference data for snapshot-scoped Worker resolution.
NominalReferenceCreator:
  class: tech.kzen.auto.server.objects.job.NominalReferenceCreator


# Parses a Channel's `elementType` and validates channel wiring (port type compatibility + single-reader) at
# definition time. Bound via the Channel's `elementType` meta (mirrors how TypeMetadataDefiner is bound).
# Every channel element is a DataValue at run time; `elementType` / a port's `of:` describe the value's
# PAYLOAD type (the built-in Workers ship untyped — flat-consuming stages accept any payload via auto-flatten).
ChannelTypeDefiner:
  class: tech.kzen.auto.common.objects.document.job.ChannelTypeDefiner
