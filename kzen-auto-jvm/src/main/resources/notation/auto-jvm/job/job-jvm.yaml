
#######################################################################################################################
# Job paradigm JVM-side notation: the Channel impl (JobChannel) and the channel-wiring AttributeCreator.
# Concrete Workers (is: Worker) live alongside in this folder once they exist (M1 step 4 onward).


# A first-class, named, buffered conduit shared by the Workers that reference it. Workers emit / consume single
# ELEMENTS; the channel transparently batches them into chunks of `chunk` elements for transfer (the batch
# granularity — also the checkpoint / step unit: one step ≈ one chunk). `buffer` is the channel capacity in
# CHUNKS: 0 (the default) is a rendezvous handoff, > 0 is a backpressured buffer. `elementType` declares the
# element type carried by the channel (a TypeMetadata; empty = untyped / Any): ChannelTypeDefiner validates at
# definition time that every referencing Worker port's `of:` element type matches, and that at most one Worker
# drains it (single-reader). The type is erased at run time (JobChannel takes only `buffer` / `chunk`); it is
# authoring/wiring metadata, so the run-time `item as In` cast in TransformWorker / SinkWorker is safe.
Channel:
  abstract: true
  class: tech.kzen.auto.server.objects.job.channel.JobChannel
  buffer: 0
  chunk: 1024
  elementType: ""
  meta:
    buffer: Int
    chunk: Int
    elementType:
      is: TypeMetadata
      by: ChannelTypeDefiner


# Duplex (request/reply) counterpart of Channel: client endpoints request a value and suspend until the
# single serving endpoint replies. Same `buffer` semantics (request-stream capacity). When `external: true`,
# the client side is not a Worker but the UI bridge: JobExecution opens a client at launch and routes inbound
# ExecutionRequests addressed to this channel (by name) to the serving Worker (see JobExecution.route).
DuplexChannel:
  abstract: true
  class: tech.kzen.auto.server.objects.job.channel.DuplexJobChannel
  buffer: 0
  external: false
  meta:
    buffer: Int
    external: Boolean


# Resolves a Worker's channel-typed attribute (ChannelInput / ChannelOutput) to a view over the single
# shared JobChannel it references. Selected per attribute via `creator: JobChannelCreator`.
JobChannelCreator:
  class: tech.kzen.auto.server.objects.job.JobChannelCreator


# Parses a Channel's `elementType` and validates channel wiring (port type compatibility + single-reader) at
# definition time. Bound via the Channel's `elementType` meta (mirrors how TypeMetadataDefiner is bound).
ChannelTypeDefiner:
  class: tech.kzen.auto.common.objects.document.job.ChannelTypeDefiner


# Type-only archetype (never instantiated) naming the element a data-pipeline Channel carries: one
# FlatFileRecord with its shared header — the self-describing records-lane element (see the DataRecord class). A
# Channel's `elementType` and a Worker port's `of:` both reference it by name so the two are checked equal.
DataRecord:
  abstract: true
  class: tech.kzen.auto.server.objects.job.worker.DataRecord
