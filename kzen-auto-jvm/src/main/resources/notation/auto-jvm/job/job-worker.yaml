
#######################################################################################################################
# Job Workers — the user-composable parallel data-processing stages. Each is `is: Worker`; channel-endpoint
# attributes are typed ChannelInput / ChannelOutput / ChannelServer and tagged `creator: JobChannelCreator`,
# which resolves each to a view over the shared Channel the attribute references (a one-way Channel, or a
# duplex DuplexChannel for request/reply). Value attributes carry defaults (the meta-scalar-needs-value
# convention). `selfLocation` is the Worker's own ObjectLocation (by: Self), used to publish live progress
# to its trace. Concrete Job documents wire these together — see the
# job-*-test.yaml fixtures under src/test/resources/notation/test/job/.


DataReadWorkerConfig:
  abstract: true
  role: ""
  schemaMode: superset
  meta:
    role:
      is: String
      label: "Part to read"
      description: "Only for sources whose files come in several named parts. Leave empty otherwise."
    schemaMode:
      is: String
      editor: SelectValuesEditor
      label: "When files have different columns"
      values:
        superset: "Combine all columns"
        strict: "Stop with an error"
      details:
        superset: "A column missing from a file is left empty for that file's rows"
        strict: "Every file must have exactly the same columns"


# What a manifest reader sends: the items inside each unit, or each unit whole with its attributes as metadata.
# Its own setting, never decided by the Worker below.
DataReadEmitConfig:
  abstract: true
  emit: items
  meta:
    emit:
      is: String
      editor: SelectValuesEditor
      label: "Send"
      values:
        items: "What is inside"
        units: "Each unit, whole"
      details:
        items: "The rows (or other items) of the selected part, one value each"
        units: "One value per unit, for a Run per unit or a Parse below; its attributes become metadata"


# Resolves one DataSource manifest per run, then emits the items of one role, or each unit whole. The source
# remains a nominal reference so blank, cross-document, and dangling values stay representable for validation;
# the Worker resolves it from the compiled run snapshot. One item shape is fixed across the manifest.
ReadWorker:
  abstract: true
  is:
    - Worker
    - DataSourceShapeProvider
    - DataReadWorkerConfig
    - DataReadEmitConfig
  title: "Read"
  class: tech.kzen.auto.server.objects.job.worker.data.ReadWorker
  output: ""
  source: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    source:
      is: DataSource
      nullable: true
      by: Nominal
      creator: NominalReferenceCreator
      editor: SelectDataSourceEditor
      summary: DataSourceAttributeView
    selfLocation:
      is: ObjectLocation
      by: Self


# Selects files, one value per file: the file's content (opaque) with its name, path, size, modified time, kind
# and Name-pattern values as metadata. Reads nothing: `Parse`, `Extract` or `Write` below decide what is done
# with the content.
FileSourceWorker:
  abstract: true
  is:
    - Worker
    - FileSelectionConfig
  title: "File"
  class: tech.kzen.auto.server.objects.job.worker.data.FileSourceWorker
  display: FileSourceWorkerDisplay
  output: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Hosts Logic that returns DataUnits and reads them through the same engine as ReadWorker while owning the Logic
# call configuration directly as an ordinary Worker.
LogicSourceWorker:
  abstract: true
  is:
    - Worker
    - DataReadWorkerConfig
    - DataReadEmitConfig
    - LogicDataSourceConfig
  title: "Logic"
  class: tech.kzen.auto.server.objects.job.worker.data.LogicSourceWorker
  output: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Reads what each incoming value holds — a file, an archive member, or a DataUnit's parts of the selected role —
# and emits its items, each with the incoming value's metadata as `parent`. `format` applies to content (a file is
# sampled when it is automatic; an archive member is chosen by its name); a DataUnit's parts carry their own.
Parse:
  abstract: true
  is:
    - Worker
    - DataReadWorkerConfig
  title: "Parse"
  class: tech.kzen.auto.server.objects.job.worker.data.ParseWorker
  input: ""
  output: ""
  format: auto-jvm/datasource/configured-delimited-format.yaml#AutomaticFormat
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    format:
      is: ConfiguredRecordFormat
      editor: SelectDataFormatEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Generates a stream from a single Kotlin expression — THE parameterized source: the Job's declared parameters
# are in `code`'s scope, bare by name and typed (`number`, `(1..number)`, `listOf("a", "b")`), compiled by the
# contract-native Job expression compiler shared with Filter and Formula. Dispatch is STATIC, from
# the expression's INFERRED type (the same inference the worker card displays): an Iterable, Sequence, or
# Iterator expression is streamed element-by-element (resuming from its position across a live edit; a null
# value under a nullable stream type is empty), any other type — including an untyped Any — is emitted as a
# single element; a blank `code` produces an empty stream. The output port carries no `of:` — the inferred payload
# type flows through the static walk instead, so any consumer is wire-compatible and still sees the type.
FormulaSourceWorker:
  abstract: true
  is: Worker
  title: "Formula Source"
  class: tech.kzen.auto.server.objects.job.worker.FormulaSourceWorker
  output: ""
  code: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    code:
      is: String
      multiline: true
    selfLocation:
      is: ObjectLocation
      by: Self


# Keeps each message for which the Kotlin boolean expression `where` is truthy, compiled against the complete
# lane contract: the lane's inferred payload type is the RECEIVER (a typed
# payload's members are bare, e.g. `age > 30`, shadowing same-named columns; `payload` is the explicit alias),
# typed fields are referenced by name (`City == "Lviv"`, `temperature > 30`), and the Job's declared parameters
# are bare and typed (`value > threshold`). An empty `where` keeps every message.
FilterWorker:
  abstract: true
  is: Worker
  title: "Filter"
  class: tech.kzen.auto.server.objects.job.worker.FilterWorker
  input: ""
  output: ""
  where: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    where: String
    selfLocation:
      is: ObjectLocation
      by: Self


# Keeps each record that passes a distinct-value WHITELIST (Report's value-set filter, NOT the Kotlin-expression
# predicate above). `filter` is a column -> {type, values} map (FilterSpec): RequireAny keeps a record only when
# the field is one of the whitelisted values, ExcludeAll drops it when it is; a record survives only if every
# configured column passes. Reuses ReportFilterStage's exact predicate, so it is byte-identical to Report's
# filter over the same data. The editor discovers a column's candidate values from an upstream SummaryWorker.
ValueSetFilterWorker:
  abstract: true
  is: Worker
  title: "Value Filter"
  class: tech.kzen.auto.server.objects.job.worker.ValueSetFilterWorker
  input: ""
  output: ""
  filter: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    filter:
      is: FilterSpec
      editor: ValueSetFilterEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Keeps or replaces each value's payload, and adds metadata (a value is payload + metadata, like a message's
# payload and headers). Each `formula` entry (FormulaSpec: name -> Kotlin) is a scalar expression whose result
# becomes a metadata field of that name, replacing one the value already has. The separate `payload` expression
# REPLACES the payload with its result (empty = keep it), e.g. promoting fields into a typed payload
# (`payload: Amount`) or mapping a typed stream (`payload: payload * 10`). The output keeps the incoming
# metadata. Expression scope, innermost first: the payload (`this`; its members and record fields bare), the
# metadata (fields bare, or `meta.x`), then the Job's declared parameters. Both lanes evaluate against the
# INCOMING value — formulas cannot see the new payload, nor each other's outputs.
FormulaWorker:
  abstract: true
  is: Worker
  title: "Formula"
  class: tech.kzen.auto.server.objects.job.worker.FormulaWorker
  input: ""
  output: ""
  formula: {}
  payload: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    formula:
      is: FormulaSpec
      editor: FormulaMapEditor
    payload:
      is: String
      multiline: true
    selfLocation:
      is: ObjectLocation
      by: Self


# Passthrough analytics Worker: summarizes every record flowing through it (per-column count / numeric stats /
# value histogram / opaque sample, reusing the genuine ValueSummaryBuilder engine — bounded memory, no scratch
# dir) while forwarding each record downstream UNCHANGED, so it composes into any pipeline. Serves the live
# TableSummary on-demand over an external duplex Channel `serve` (the value-set-filter editor reads a column's
# distinct values from it); pushes a running row count to its trace. Summary columns are discovered from the
# stream's header.
SummaryWorker:
  abstract: true
  is: Worker
  title: "Summary"
  class: tech.kzen.auto.server.objects.job.worker.SummaryWorker
  display: SummaryWorkerDisplay
  input: ""
  output: ""
  serve: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: SummaryServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Analytics Worker that accumulates every incoming record into a pivot table (reusing the genuine PivotBuilder
# engine over an H2-backed scratch dir) and, at end-of-stream, emits the built pivot table downstream row-by-row
# (row-key columns + one column per value/type), so it composes into any pipeline. `pivot` is a {rows, values}
# map (PivotSpec): `rows` are the group-by columns, `values` maps a column to its aggregate types (Count / Sum /
# Average / Min / Max). Serves live preview-slice queries over an external duplex Channel `serve`; the scratch
# dir is closed-then-deleted when the run ends.
PivotWorker:
  abstract: true
  is: Worker
  title: "Pivot"
  class: tech.kzen.auto.server.objects.job.worker.PivotWorker
  display: PreviewWorkerDisplay
  input: ""
  output: ""
  serve: ""
  pivot:
    rows: []
    values: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: ChannelServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    pivot:
      is: PivotSpec
      editor: PivotSpecEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Projects paths over the incoming object graph into flat scalar columns and unnests `[*]` lists / maps (E8):
# `paths` is an ordered list of entries — a path string, or `{path: executions[*].price, as: px}` — bound
# against the upstream contract (PathBinding: fields must exist, `[*]` needs a list or map, leaves must be
# scalar, output names — the dotted path with wildcards dropped, or the alias — must be unique). One output row
# per unnested element; paths on the same list share the iteration, on different lists they cross-product; a
# null intermediate keeps the row with nulls, an empty list yields no rows. The rows are fresh scalar copies:
# an owned upstream element (E9) closes once the callback returns.
PathProjectionWorker:
  abstract: true
  is: Worker
  title: "Paths"
  class: tech.kzen.auto.server.objects.job.worker.PathProjectionWorker
  input: ""
  output: ""
  paths: []
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    paths:
      is: PathProjectionSpec
      editor: PathProjectionEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Buffers every incoming record, then at end-of-stream emits them re-ordered by a multi-key sort (`sort`, a
# SortSpec): an ORDERED map of column -> ascending, first key primary, ties broken by the next. Per key, values
# that parse as numbers sort numerically and BEFORE non-numeric text (which sorts lexically) — a stable total
# order. In-memory v1 (buffers the whole stream; disk-spill is a documented follow-up), no serve, no scratch
# dir. The accumulated buffer is carried across a live edit, so a pause / edit / resume re-sorts the full input
# rather than only the tail an unchanged, resuming upstream reader would deliver next.
SortWorker:
  abstract: true
  is: Worker
  title: "Sort"
  class: tech.kzen.auto.server.objects.job.worker.SortWorker
  input: ""
  output: ""
  sort: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    sort:
      is: SortSpec
      editor: SortSpecEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Writes records to a delimited file with RFC-4180 quoting (delimiter-aware). `columns` (WriterColumnSpec) chooses
# how each value becomes a row: `*` (the default) is the payload's top-level columns, and a path entry (`meta.name`,
# `instrument.symbol`, or `{path, as}`) adds a metadata field or nested scalar. With header=false (a headerless
# round-trip) only the records are written.
CsvWriterWorker:
  abstract: true
  is: ResultYielder
  title: "CSV Writer"
  class: tech.kzen.auto.server.objects.job.worker.CsvWriterWorker
  input: ""
  path: ""
  delimiter: ","
  header: true
  columns: []
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    path: String
    delimiter: String
    header: Boolean
    columns:
      is: WriterColumnSpec
      editor: WriterColumnsEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Writes records to a delimited file with Report's EXACT export encoding — RFC-4180 CSV / TSV formatting → UTF-8
# → optional compression — so a Job export is byte-identical to Report's over the same data. `export` is an
# OutputExportSpec: `format` (csv/tsv), `compression` (none/zip/gz, via the shared ExportCompression.wrap seam),
# and `path` (a pattern; ${time}/${extension} resolved, ${report} = this Worker's own document name, ${group}
# empty for the single stream). `columns` (WriterColumnSpec) flattens each value as for CsvWriterWorker. The column
# header is written once from the first record. A SinkWorker: opens the file in onStart, closes (finalizes the
# compression container) in onClose; live edit RESTARTS (re-truncates), the WorkerBase sink default.
ExportWriterWorker:
  abstract: true
  is: ResultYielder
  title: "Export"
  class: tech.kzen.auto.server.objects.job.worker.ExportWriterWorker
  input: ""
  export:
    format: csv
    compression: none
    path: "../work/output/${report}_${time}.${extension}"
  columns: []
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    export:
      is: OutputExportSpec
      editor: ExportSpecEditor
    columns:
      is: WriterColumnSpec
      editor: WriterColumnsEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Sink that shows a LIVE sample of incoming data: pushes a teaser (first rows + running count) to its trace
# for the always-on view, and serves on-demand slice queries (offset / limit) over an external duplex Channel
# `serve` for the browser to read its larger buffered sample. `sample` bounds the buffered rows. Renders each
# message's flat part: the CSV lane column-for-column, a payload lane auto-flattened to a single `value`
# column — so the same view serves both the CSV lane and a scalar (FormulaSource / Run) lane.
PreviewWorker:
  abstract: true
  is: Worker
  title: "Preview"
  class: tech.kzen.auto.server.objects.job.worker.PreviewWorker
  display: PreviewWorkerDisplay
  input: ""
  serve: ""
  sample: 1000
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: ChannelServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    sample: Int
    selfLocation:
      is: ObjectLocation
      by: Self


# Sink that indexes EVERY incoming record into a disk-backed random-access table (Report's reused IndexedCsvTable
# over a run-scoped scratch dir) and serves on-demand random-access preview SLICES (offset / limit) over the
# external duplex Channel `serve` — so the browser can page through ANY window of the full result without
# buffering it all in memory. The Job analogue of Report's Explore output, and the heavy-duty counterpart to
# PreviewWorker's bounded in-memory live tail. Indexes each message's flat part (a payload lane auto-flattens).
# The scratch dir is closed-then-deleted when the run ends; live edit RESTARTS (re-indexes from a resuming
# upstream reader), the WorkerBase default (coherent since the scratch path is deterministic per run).
ExploreWorker:
  abstract: true
  is: Worker
  title: "Explore"
  class: tech.kzen.auto.server.objects.job.worker.ExploreWorker
  display: ExploreWorkerDisplay
  input: ""
  serve: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: ChannelServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Keeps a single element of the stream (`keep`: first / last) and, at end-of-stream, yields it as the Job's
# named output component (`result:`, blank = main), typed by the Job document's declared `results` signature
# (Script parity). An empty stream is a run failure unless the declared type is nullable (then the result is
# null). The Job-side analogue of Script's Result step. The kept element carries across a live edit and the
# yield is re-applied on the rebuilt run. `result` (name) + `keep` + their meta are inherited from the
# ResultSink marker; `input` sits here (gotcha 2: palette insert resolves every attribute blank-not-missing).
ResultSinkWorker:
  abstract: true
  is: ResultSink
  title: "Result"
  display: ResultWorkerDisplay
  class: tech.kzen.auto.server.objects.job.worker.ResultSinkWorker
  input: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Runs another Logic (a Script / Flow / Job, referenced by `instructions`) as a child once per incoming
# element: the element is passed as the child's first parameter and the child's main result is emitted
# downstream. The seam for composing reusable sub-Logics into a Job's dataflow — the Job analogue of a Script
# Run step. Named arguments compile against the incoming lane contract with the same typed fields and outer-Job
# parameters as Formula. The output lane carries the child's declared main-result contract.
RunWorker:
  abstract: true
  is: Worker
  title: "Run"
  class: tech.kzen.auto.server.objects.job.worker.RunWorker
  input: ""
  output: ""
  instructions: ""
  arguments: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    instructions:
      is: ObjectLocation
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: Map
      of:
        - String
        - String
      editor: RunLogicArgumentsEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# ---------------------------------------------------------------------------------------------------------------------
# Borrowed elements (docs/plans/2026-09-16_borrowed-elements.md): Extract opens each incoming file — a selected
# file from File, or a member of an enclosing archive — as a .tar.gz and lends its members, as file values, to the
# Workers downstream, advancing only once the member's last hold is released; Write and Parse read a member inside
# their callback and emit independent values (a Written record, rows).

Extract:
  abstract: true
  is: Worker
  title: "Extract"
  class: tech.kzen.auto.server.objects.job.worker.content.ExtractWorker
  input: ""
  output: ""
  members: []
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    members:
      is: List
      of: String
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


Write:
  abstract: true
  is: Worker
  title: "Write"
  class: tech.kzen.auto.server.objects.job.worker.content.WriteWorker
  input: ""
  output: ""
  directory: ""
  name: "${name}${extension}"
  coding: gzip
  existing: fail
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    directory: String
    name: String
    coding:
      is: String
      editor: SelectValuesEditor
      values:
        gzip: "Gzip"
        none: "None"
    existing:
      is: String
      editor: SelectValuesEditor
      values:
        fail: "Fail"
        replace: "Replace"
        skip: "Skip"
    selfLocation:
      is: ObjectLocation
      by: Self


# CS2: Take(n) as an ordinary Worker — forwards n elements, then completes, closing its input on the consumer
# side so its upstream sees a closed (not paused) downstream.
TakeWorker:
  abstract: true
  is: Worker
  title: "Take"
  class: tech.kzen.auto.server.objects.job.worker.TakeWorker
  input: ""
  output: ""
  count: 10
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    count: Int
    selfLocation:
      is: ObjectLocation
      by: Self

