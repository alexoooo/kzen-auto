
#######################################################################################################################
# Job Workers — the user-composable parallel data-processing stages. Each is `is: Worker`; channel-endpoint
# attributes are typed ChannelInput / ChannelOutput / ChannelServer and tagged `creator: JobChannelCreator`,
# which resolves each to a view over the shared Channel the attribute references (a one-way Channel, or a
# duplex DuplexChannel for request/reply). Value attributes carry defaults (the meta-scalar-needs-value
# convention). `selfLocation` is the Worker's own ObjectLocation (by: Self), used to publish live progress
# to its trace. Concrete Job documents wire these together — see the
# job-*-test.yaml fixtures under src/test/resources/notation/test/.


# Reads a delimited text file (full RFC-4180 parsing: quoted fields, embedded delimiters / newlines, doubled
# quotes) and emits batched records. With header=false (a headerless file, e.g. the 1BRC measurement set)
# the schema is synthesized as positional names c0, c1, … so the column-based downstream stages can still
# reference columns by name over headerless data.
CsvReaderWorker:
  abstract: true
  is: Worker
  title: "CSV Reader"
  class: tech.kzen.auto.server.objects.job.worker.CsvReaderWorker
  output: ""
  path: ""
  delimiter: ","
  header: true
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    path: String
    delimiter: String
    header: Boolean
    selfLocation:
      is: ObjectLocation
      by: Self


# Reads MULTIPLE delimited text files as one combined stream (same RFC-4180 parsing as CsvReaderWorker),
# emitting their records concatenated in `paths` order — the multi-file generalization of CsvReaderWorker, the
# Job analogue of Report's multi-location input. The column schema is taken from the FIRST file; with header=true
# each subsequent file's header row is skipped and its data emitted under the shared schema, with header=false
# the schema is synthesized positionally (c0, c1, …) from the first file's first record and every row is data.
# State migration carries a `(fileIndex, open-reader-position)` cursor, so a pause / edit / resume continues from
# the exact spot in the current file (when paths / delimiter / header are unchanged) rather than re-reading from
# the top. `paths` is a resolved, ordered list of concrete file paths — directory browse / glob discovery is the
# editor's job (P4i MultiFileInputEditor), keeping the resume cursor deterministic.
MultiFileReaderWorker:
  abstract: true
  is: Worker
  title: "Multi-File Reader"
  class: tech.kzen.auto.server.objects.job.worker.MultiFileReaderWorker
  output: ""
  paths: []
  delimiter: ","
  header: true
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    paths:
      is: List
      of: String
      editor: MultiFileInputEditor
    delimiter: String
    header: Boolean
    selfLocation:
      is: ObjectLocation
      by: Self


# Generates a stream from a single Kotlin expression: `code` evaluates to an Iterable (e.g. `(1..100)`,
# `listOf("a", "b")`, a generated sequence), compiled by the genuine StepExpressionCompiler / Kotlin compiler
# (same engine as FormulaStep), and each element is iterated into the output channel. The output is untyped
# (the iterable's element type is arbitrary), so the port carries no `of:` and any consumer is compatible.
FormulaSourceWorker:
  abstract: true
  is: Worker
  title: "Formula Source"
  class: tech.kzen.auto.server.objects.job.worker.FormulaSourceWorker
  output: ""
  code: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    code:
      is: String
      multiline: true
    selfLocation:
      is: ObjectLocation
      by: Self


# Streams the Job's bound run argument for the parameter it declares (`parameter:`): a Collection argument is
# streamed element-by-element (resuming from its position across a live edit), any other value (including an
# unbound null) is emitted as a single element. The Job-side analogue of Flow's FlowInput vertex — what makes a
# Job invocable with arguments from a Script RunStep / Flow Run vertex / Job RunWorker. Output is untyped (any
# argument); a concrete object may declare `of:` on the output port to type the Job's signature (for a Collection
# the `of:` describes the ELEMENT type). `parameter` (name) + its meta are inherited from the ParameterSource
# marker; `output` sits here (gotcha 2: palette insert resolves every attribute blank-not-missing via the chain).
ParameterSourceWorker:
  abstract: true
  is: ParameterSource
  title: "Parameter"
  class: tech.kzen.auto.server.objects.job.worker.ParameterSourceWorker
  output: ""
  meta:
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Keeps each record for which the Kotlin boolean expression `where` (columns referenced by name, e.g.
# `City eq "Lviv"` or `temp.number > 30`) is truthy, compiled by the genuine CalculatedColumnEval engine.
# An empty `where` keeps every record.
FilterWorker:
  abstract: true
  is: Worker
  title: "Filter"
  class: tech.kzen.auto.server.objects.job.worker.FilterWorker
  input: ""
  output: ""
  where: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    where: String
    selfLocation:
      is: ObjectLocation
      by: Self


# Keeps each record that passes a distinct-value WHITELIST (Report's value-set filter, NOT the Kotlin-expression
# predicate above). `filter` is a column -> {type, values} map (FilterSpec): RequireAny keeps a record only when
# the field is one of the whitelisted values, ExcludeAll drops it when it is; a record survives only if every
# configured column passes. Reuses ReportFilterStage's exact predicate, so it is byte-identical to Report's
# filter over the same data. The editor discovers a column's candidate values from an upstream SummaryWorker.
ValueSetFilterWorker:
  abstract: true
  is: Worker
  title: "Value Filter"
  class: tech.kzen.auto.server.objects.job.worker.ValueSetFilterWorker
  input: ""
  output: ""
  filter: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    filter:
      is: FilterSpec
      editor: ValueSetFilterEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Appends one calculated column per `formula` entry (arbitrary Kotlin expression over the record's columns),
# reusing the genuine CalculatedColumnEval engine. `formula` is a column-name -> Kotlin map (FormulaSpec).
FormulaWorker:
  abstract: true
  is: Worker
  title: "Formula"
  class: tech.kzen.auto.server.objects.job.worker.FormulaWorker
  input: ""
  output: ""
  formula: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    formula:
      is: FormulaSpec
      editor: FormulaMapEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Passthrough analytics Worker: summarizes every record flowing through it (per-column count / numeric stats /
# value histogram / opaque sample, reusing the genuine ValueSummaryBuilder engine — bounded memory, no scratch
# dir) while forwarding each record downstream UNCHANGED, so it composes into any pipeline. Serves the live
# TableSummary on-demand over an external duplex Channel `serve` (the value-set-filter editor reads a column's
# distinct values from it); pushes a running row count to its trace. Summary columns are discovered from the
# stream's header.
SummaryWorker:
  abstract: true
  is: Worker
  title: "Summary"
  class: tech.kzen.auto.server.objects.job.worker.SummaryWorker
  display: SummaryWorkerDisplay
  input: ""
  output: ""
  serve: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: SummaryServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Analytics Worker that accumulates every incoming record into a pivot table (reusing the genuine PivotBuilder
# engine over an H2-backed scratch dir) and, at end-of-stream, emits the built pivot table downstream row-by-row
# (row-key columns + one column per value/type), so it composes into any pipeline. `pivot` is a {rows, values}
# map (PivotSpec): `rows` are the group-by columns, `values` maps a column to its aggregate types (Count / Sum /
# Average / Min / Max). Serves live preview-slice queries over an external duplex Channel `serve`; the scratch
# dir is closed-then-deleted when the run ends.
PivotWorker:
  abstract: true
  is: Worker
  title: "Pivot"
  class: tech.kzen.auto.server.objects.job.worker.PivotWorker
  display: PreviewWorkerDisplay
  input: ""
  output: ""
  serve: ""
  pivot:
    rows: []
    values: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: ChannelServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    pivot:
      is: PivotSpec
      editor: PivotSpecEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Buffers every incoming record, then at end-of-stream emits them re-ordered by a multi-key sort (`sort`, a
# SortSpec): an ORDERED map of column -> ascending, first key primary, ties broken by the next. Per key, values
# that parse as numbers sort numerically and BEFORE non-numeric text (which sorts lexically) — a stable total
# order. In-memory v1 (buffers the whole stream; disk-spill is a documented follow-up), no serve, no scratch
# dir. The accumulated buffer is carried across a live edit, so a pause / edit / resume re-sorts the full input
# rather than only the tail an unchanged, resuming upstream reader would deliver next.
SortWorker:
  abstract: true
  is: Worker
  title: "Sort"
  class: tech.kzen.auto.server.objects.job.worker.SortWorker
  input: ""
  output: ""
  sort: {}
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    sort:
      is: SortSpec
      editor: SortSpecEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Writes records to a delimited file with RFC-4180 quoting (delimiter-aware). With header=false (a headerless
# round-trip) only the records are written.
CsvWriterWorker:
  abstract: true
  is: Worker
  title: "CSV Writer"
  class: tech.kzen.auto.server.objects.job.worker.CsvWriterWorker
  input: ""
  path: ""
  delimiter: ","
  header: true
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    path: String
    delimiter: String
    header: Boolean
    selfLocation:
      is: ObjectLocation
      by: Self


# Writes records to a delimited file with Report's EXACT export encoding — RFC-4180 CSV / TSV formatting → UTF-8
# → optional compression — so a Job export is byte-identical to Report's over the same data. `export` is an
# OutputExportSpec: `format` (csv/tsv), `compression` (none/zip/gz, via the shared ExportCompression.wrap seam),
# and `path` (a pattern; ${time}/${extension} resolved, ${report} = this Worker's own document name, ${group}
# empty for the single stream). The column header is written once from the first record. A SinkWorker: opens the
# file in onStart, closes (finalizes the compression container) in onClose; live edit RESTARTS (re-truncates),
# the WorkerBase sink default.
ExportWriterWorker:
  abstract: true
  is: Worker
  title: "Export"
  class: tech.kzen.auto.server.objects.job.worker.ExportWriterWorker
  input: ""
  export:
    format: csv
    compression: none
    path: "../work/output/${report}_${time}.${extension}"
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    export:
      is: OutputExportSpec
      editor: ExportSpecEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Sink that shows a LIVE sample of incoming data: pushes a teaser (first rows + running count) to its trace
# for the always-on view, and serves on-demand slice queries (offset / limit) over an external duplex Channel
# `serve` for the browser to read its larger buffered sample. `sample` bounds the buffered rows. Renders each
# message's flat part: the CSV lane column-for-column, a payload lane auto-flattened to a single `value`
# column — so the same view serves both the CSV lane and a scalar (FormulaSource / Run) lane.
PreviewWorker:
  abstract: true
  is: Worker
  title: "Preview"
  class: tech.kzen.auto.server.objects.job.worker.PreviewWorker
  display: PreviewWorkerDisplay
  input: ""
  serve: ""
  sample: 1000
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: ChannelServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    sample: Int
    selfLocation:
      is: ObjectLocation
      by: Self


# Sink that indexes EVERY incoming record into a disk-backed random-access table (Report's reused IndexedCsvTable
# over a run-scoped scratch dir) and serves on-demand random-access preview SLICES (offset / limit) over the
# external duplex Channel `serve` — so the browser can page through ANY window of the full result without
# buffering it all in memory. The Job analogue of Report's Explore output, and the heavy-duty counterpart to
# PreviewWorker's bounded in-memory live tail. Indexes each message's flat part (a payload lane auto-flattens).
# The scratch dir is closed-then-deleted when the run ends; live edit RESTARTS (re-indexes from a resuming
# upstream reader), the WorkerBase default (coherent since the scratch path is deterministic per run).
ExploreWorker:
  abstract: true
  is: Worker
  title: "Explore"
  class: tech.kzen.auto.server.objects.job.worker.ExploreWorker
  display: ExploreWorkerDisplay
  input: ""
  serve: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    serve:
      is: ChannelServer
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Collects every incoming element and, at end-of-stream, yields the collection as the Job's named output component
# (`result:`, blank = main) — the single element itself when exactly one arrived, matching the hosts'
# single-positional convention, so a per-element RunWorker round trip is scalar-in / scalar-out. The Job-side
# analogue of Flow's FlowOutput vertex. The accumulated collection carries across a live edit (Sort's-buffer
# precedent) and the yield is re-applied on the rebuilt run. `result` (name) + its meta are inherited from the
# ResultSink marker; `input` sits here (gotcha 2: palette insert resolves every attribute blank-not-missing).
ResultSinkWorker:
  abstract: true
  is: ResultSink
  title: "Result"
  class: tech.kzen.auto.server.objects.job.worker.ResultSinkWorker
  input: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    selfLocation:
      is: ObjectLocation
      by: Self


# Runs another Logic (a Script / Flow / Job, referenced by `instructions`) as a child once per incoming
# element: the element is passed as the child's first parameter and the child's main result is emitted
# downstream. The seam for composing reusable sub-Logics into a Job's dataflow — the Job analogue of a Script
# Run step. Untyped ports (`Any?`): what flows is whatever the child consumes / produces.
RunWorker:
  abstract: true
  is: Worker
  title: "Run"
  class: tech.kzen.auto.server.objects.job.worker.RunWorker
  input: ""
  output: ""
  instructions: ""
  meta:
    input:
      is: ChannelInput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    output:
      is: ChannelOutput
      creator: JobChannelCreator
      editor: SelectChannelEditor
    instructions:
      is: ObjectLocation
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    selfLocation:
      is: ObjectLocation
      by: Self
