# An if / else-if / ... / else chain: N condition branches evaluated in order (first true wins), plus one
# optional trailing Else. A branch is a nested IfBranch object carrying its OWN condition and steps, so branch
# order is document order of those objects and adding / removing / reordering a branch renames nothing.
IfStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.IfStep
  display: IfStepDisplay
  icon: "material-symbols:share"
  title: "If"
  description: "Run the first branch whose Kotlin condition holds, else the Else steps"
  meta:
    branches:
      is: List
      of: IfBranch
      by: NestedList
      # Children are structural branch groups (condition + steps), not steps themselves — read via
      # ScriptConventions.stepGroupAttributeNames (a metadata key like `rerun` / `scope`, inert for definition).
      group: true
    else:
      is: List
      of: ScriptStep
      by: NestedList


# One branch of an IfStep chain: a Kotlin Boolean condition and the steps that run when it is the first true
# one. Deliberately NOT `is: ScriptStep` — it is never executed, so ScriptValidator's step collection (an
# inheritance-chain filter on ScriptStep) skips it and it never enters a step-validation surface. Parentless,
# so `title` needs its own metadata to define (see the Channel archetype gotcha in AGENTS.md); it feeds
# ScriptCommander.findNextAvailable's name prefix ("Branch", "Branch 2", ...).
IfBranch:
  abstract: true
  class: tech.kzen.auto.server.objects.script.step.control.IfBranch
  title: "Branch"
  condition: ""
  meta:
    title: String
    # Compiled with a forced Boolean return by IfStep (which owns every branch's condition — see IfStep's
    # KDoc), exactly like DoWhileStep.condition below. NO `scope: body` marker: a branch condition is
    # evaluated BEFORE its branch runs, so its in-scope references are the If's own predecessors plus the
    # in-scope bindings — the default scoping both KotlinExpressionEditor and StepExpressionSupport apply
    # (ScriptTree.predecessors already excludes the sibling branch groups).
    condition:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
    steps:
      is: List
      of: ScriptStep
      by: NestedList


ForEachStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.foreach.ForEachStep
  display: ForEachStepDisplay
  icon: "material-symbols:forward"
  title: "ForEach"
  description: "Use each item in a list"
  items: ""
  meta:
    items:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    steps:
      is: List
      of: ScriptStep
      by: NestedList
      # This branch re-runs each iteration (read by ScriptNestingAnalysis): a ControlStep may target this loop,
      # and a move-to jump into this body is invalid (execution-control decision 8). Inert for definition.
      rerun: true
    selfLocation: SelfLocation

ForEachItemBinding:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.binding.ForEachItemBinding
  icon: "material-symbols:label"
  title: "Item"
  meta:
    selfLocation: SelfLocation


DoWhileStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.DoWhileStep
  display: DoWhileStepDisplay
  icon: "material-symbols:repeat"
  title: "Do While"
  description: "Repeat steps while a Kotlin condition (over the body's values) holds true"
  condition: ""
  meta:
    condition:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
      summary: TextAttributeView
      # The condition's in-scope references are this loop's own body steps, not its predecessors (read by the
      # client KotlinExpressionEditor via ScriptConventions.isBodyScopedExpression; the server counterpart is
      # DoWhileStep.conditionScopeTypes itself). Inert for definition, like `rerun` below.
      scope: body
    steps:
      is: List
      of: ScriptStep
      by: NestedList
      # This branch re-runs each iteration (read by ScriptNestingAnalysis) — see ForEachStep.steps.rerun.
      rerun: true
    selfLocation: SelfLocation


# Structured loop control (continue / break): raises a completion signal targeting an enclosing loop so the loop
# skips the rest of this iteration (action: skipIteration) or exits (action: finishLoop). Produces no value. A
# `loop` that is not a `rerun`-flagged enclosing ancestor is a validation error that blocks Run.
ControlStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.ControlStep
  icon: "material-symbols:step-out"
  title: "Loop Control"
  loop: ""
  action: "skipIteration"
  meta:
    loop:
      is: ObjectLocation
      by: Nominal
      editor: SelectEnclosingLoopEditor
    action:
      is: String
      editor: SelectValuesEditor
      values:
        skipIteration: "Skip Iteration"
        finishLoop: "Finish Loop"
      summary: ControlSummaryAttributeView
    selfLocation: SelfLocation

