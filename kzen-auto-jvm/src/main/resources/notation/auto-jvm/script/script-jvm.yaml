

# NB: referenced in FeatureDocument
ScriptValidator:
  class: tech.kzen.auto.server.objects.script.ScriptValidator


#######################################################################################################################

# Run-scoped resource disposal policy (kzen-lib enum). Parsed once at definition time by the definer, so
# an opening step's `closePolicy` constructor param receives the enum directly; rendered as a labelled
# dropdown by the editor. Bound here at the type level so any `is: ResourceClosePolicy` attribute inherits both.
ResourceClosePolicy:
  abstract: true
  class: tech.kzen.lib.common.exec.logic.ResourceClosePolicy
  meta:
    ref:
      by: ResourceClosePolicyDefiner
      editor: SelectClosePolicyEditor

ResourceClosePolicyDefiner:
  class: tech.kzen.auto.common.objects.document.script.ResourceClosePolicyDefiner

# Mix-in for any Logic that registers a run-scoped resource: contributes the `closePolicy` attribute
# (default `auto`) bound to ResourceClosePolicy. Combined via multiple inheritance — e.g.
# `is: [ScriptStep, ScopedResource]` — so the policy is not pinned to the script-step lineage.
ScopedResource:
  abstract: true
  closePolicy: auto
  meta:
    closePolicy: ResourceClosePolicy


#######################################################################################################################

# A type for a Script parameter (or other typed binding). Parsed once at definition time by the definer
# into a TypeMetadata, so a binding's constructor receives the type directly. Notation shape mirrors
# TypeMetadata: { class: <qualified name>, generics: [ <nested type maps> ], nullable: <bool> }.
# Bound at the type level (mirrors ResourceClosePolicy) so any `is: TypeMetadata` attribute inherits it.
TypeMetadata:
  abstract: true
  class: tech.kzen.lib.common.model.structure.metadata.TypeMetadata
  meta:
    ref:
      by: TypeMetadataDefiner

TypeMetadataDefiner:
  class: tech.kzen.auto.common.objects.document.script.TypeMetadataDefiner


# Coerces a Script parameter's optional `default` notation scalar into a typed runtime value keyed on the
# sibling `type`; absent/unparseable/unsupported-type defaults resolve to null (see the definer class).
ParameterDefaultDefiner:
  class: tech.kzen.auto.common.objects.document.script.ParameterDefaultDefiner


# A Script parameter, exposed to steps by name and fully typed, without a body row (replaces the old
# ArgumentStep). Lives in the Script's `parameters` branch; the parameter name is this object's own name,
# and `type` declares its TypeMetadata (defaults to Any). `default` is the value used at runtime when a run
# supplies no argument for the parameter (omitted = no default). Validated like a step so its type flows
# into ScriptValidation, but never executed — its value is resolved from the run arguments on demand.
ParameterBinding:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.binding.ParameterBinding
  icon: "material-symbols:input"
  title: "Parameter"
  type:
    class: kotlin.Any
    generics: []
    nullable: false
  meta:
    type: TypeMetadata
    default:
      is: Object
      by: ParameterDefaultDefiner
    selfLocation: SelfLocation


