

# NB: referenced in ScriptConventions
ScriptValidator:
  class: tech.kzen.auto.server.objects.script.ScriptValidator


#######################################################################################################################

# Run-scoped resource disposal RULE (kzen-lib enum). Parsed once at definition time by the definer, so
# an opening step's `closePolicy` constructor param receives the enum directly; rendered as a labelled
# dropdown by SelectValuesEditor from the `values:` map below (keys are the enum's wire values).
# Bound here at the type level so any `is: ResourceClosePolicy` attribute inherits both.
#
# The OWNER is not chosen here: it is the furthest document reachable from the providing document along an
# unbroken chain of `context.exports` declarations, falling back to the providing document when that exports
# nothing. So "when the owning Script finishes" may mean several documents up — one hop per export
# declaration, resting at the first document that does not export the Context onward.
ResourceClosePolicy:
  abstract: true
  class: tech.kzen.lib.common.exec.logic.ResourceClosePolicy
  meta:
    ref:
      by: ResourceClosePolicyDefiner
      editor: SelectValuesEditor
      values:
        auto: "Auto — close when the owning Script finishes (success, failure, or cancel)"
        manual: "Manual — keep open; only an explicit close step disposes it"
        keepOnFailure: "Keep on failure — close on the owner's success/cancel, keep on failure to inspect"

ResourceClosePolicyDefiner:
  class: tech.kzen.auto.common.objects.document.script.ResourceClosePolicyDefiner

# Mix-in for any step that PROVIDES a Context (opens the run-scoped resource it names): contributes the
# `provides` declaration plus the `closePolicy` attribute (default `auto`) bound to ResourceClosePolicy.
# Combined via multiple inheritance — e.g. `is: [ScriptStep, ContextProvider]` — so it is not pinned to the
# script-step lineage.
#
# `provides` is a weak reference (by: Nominal, like every context declaration): data for the
# validator/runtime/editor, never constructor-injected, and a dangling or abstract-targeted entry degrades
# to a validation message instead of failing the object's definition; renaming a Context propagates into it.
# `nullable` lets the empty default define. `closePolicy` stays meta-declared with a real definer because it
# IS a constructor param and needs the dropdown.
ContextProvider:
  abstract: true
  provides: ""
  closePolicy: auto
  meta:
    closePolicy: ResourceClosePolicy
    provides:
      is: ObjectLocation
      nullable: true
      by: Nominal


