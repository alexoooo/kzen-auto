

# NB: referenced in ScriptConventions
ScriptValidator:
  class: tech.kzen.auto.server.objects.script.ScriptValidator


#######################################################################################################################

# Run-scoped resource disposal RULE (kzen-lib enum). Parsed once at definition time by the definer, so
# an opening step's `closePolicy` constructor param receives the enum directly; rendered as a labelled
# dropdown by SelectValuesEditor from the `values:` map below (keys are the enum's wire values).
# Bound here at the type level so any `is: ResourceClosePolicy` attribute inherits both.
#
# The OWNER is not chosen here: it is the furthest document reachable from the providing document along an
# unbroken chain of `context.exports` declarations, falling back to the providing document when that exports
# nothing. So "when the owning Script finishes" may mean several documents up — one hop per export
# declaration, resting at the first document that does not export the Context onward.
ResourceClosePolicy:
  abstract: true
  class: tech.kzen.lib.common.exec.logic.ResourceClosePolicy
  meta:
    ref:
      by: ResourceClosePolicyDefiner
      editor: SelectValuesEditor
      values:
        auto: "Auto — close when the owning Script finishes (success, failure, or cancel)"
        manual: "Manual — keep open; only an explicit close step disposes it"
        keepOnFailure: "Keep on failure — close on the owner's success/cancel, keep on failure to inspect"

ResourceClosePolicyDefiner:
  class: tech.kzen.auto.common.objects.document.script.ResourceClosePolicyDefiner


# Disposal rule for an ANONYMOUS frame-scoped cleanup (kzen-lib enum) — the registration DisposeAtSettleStep
# makes, which has no value and no name. Two values where ResourceClosePolicy above has three, and the
# missing one is not an oversight: `manual` is a promotion, handing a registration one frame up so a later
# step can still find it and close it, and an anonymous registration has no name for anything to find it by.
SettleDisposalPolicy:
  abstract: true
  class: tech.kzen.lib.common.exec.engine.disposal.SettleDisposalPolicy
  meta:
    ref:
      by: SettleDisposalPolicyDefiner
      editor: SelectValuesEditor
      values:
        auto: "Auto — run when the owning Script finishes (success, failure, or cancel)"
        keepOnFailure: "Keep on failure — run on the owner's success/cancel, skip on failure to inspect"

SettleDisposalPolicyDefiner:
  class: tech.kzen.auto.common.objects.document.script.SettleDisposalPolicyDefiner

# Mix-in for any step that BINDS a Context: it publishes a value into the run's scope under the Context it
# names, and carries the `binds` declaration — nothing else.
#
# `binds` is a weak reference (by: Nominal, like every context declaration): data for the
# validator/runtime/editor, never constructor-injected, and a dangling or abstract-targeted entry degrades
# to a validation message instead of failing the object's definition; renaming a Context propagates into it.
# `nullable` lets the empty default define.
ContextBinder:
  abstract: true
  binds: ""
  meta:
    binds:
      is: ObjectLocation
      nullable: true
      by: Nominal

# Mix-in for any step that OWNS a disposable run-scoped resource: carries the `closePolicy` attribute
# (default `auto`) bound to ResourceClosePolicy, which is what decides when the engine disposes whatever the
# step opened. Unlike the context declarations, `closePolicy` IS a real constructor param, so it stays
# meta-declared with a real definer and needs the dropdown.
#
# Deliberately SEPARATE from ContextBinder, because binding a value into scope and owning a disposable
# resource are independent: a step that binds a computed String owns nothing to close, and a step that
# deletes a temp file at settle owns a resource while binding nothing. Every step today happens to do both,
# so it takes both halves — but the split is what lets a later one bind without owning.
#
# Both combine via multiple inheritance — e.g. `is: [ScriptStep, ContextBinder, ResourceOwner]` — so neither
# is pinned to the script-step lineage.
ResourceOwner:
  abstract: true
  closePolicy: auto
  meta:
    closePolicy: ResourceClosePolicy


#######################################################################################################################

# NB: the TypeMetadata / ParameterDefaultDefiner / ParameterBinding archetypes moved to common-document.yaml —
# the `parameters` branch (and its typed bindings) is shared by Script and Job.


FormulaStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.eval.FormulaStep
  icon: "material-symbols:functions"
  title: "Formula"
  code: ""
  meta:
    code:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
      summary: TextAttributeView
    selfLocation: SelfLocation


# The Script's `return`: the Kotlin `code` must evaluate to the Script's declared `main` result type (the
# result signature), and the step captures that value and ends the Script. No declared signature is a
# validation error (the Script is void), and a type mismatch surfaces as the step's compile error.
ResultStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.eval.ResultStep
  icon: "material-symbols:keyboard-return"
  title: "Result"
  code: ""
  meta:
    code:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
      summary: TextAttributeView
    selfLocation: SelfLocation


DisplayValueStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.DisplayValueStep
  icon: "material-symbols:print"
  title: "Display"
  text: ""
  meta:
    text:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor


RunStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.RunStep
  display: RunStepDisplay
  icon: "material-symbols:play-arrow"
  title: "Run"
  instructions: ""
  arguments: {}
  contexts: {}
  meta:
    instructions:
      is: ObjectLocation
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: Map
      of:
        - String
        - ObjectLocation
      by: Nominal
      editor: RunStepArgumentsEditor
    # What this call SUPPLIES to the document it runs: `{<callee's slot>: <a Context this caller holds>}`,
    # installed on the child's frame before its first instruction and gone when the call returns. It is the
    # `with(…)` shape — the callee declares `context.requires` and is run twice against two different values
    # without being edited — and the two sides are deliberately different namespaces, so a caller holding
    # `Browser A` and `Browser B` can drive a callee that declares one unqualified `Browser` slot.
    #
    # A borrow, never a handover: no close policy appears here because the value's owner is whatever bound it
    # on the caller's side, and that frame outlives the sequential child by construction.
    #
    # Read from notation only, never constructor-injected (the `Logic.context` pattern, NOT the `arguments`
    # one above): a weak reference that dangles fails its whole host object at creation, and a mis-picked
    # Context must degrade to a validation finding rather than take the RunStep with it.
    #
    # The value generic is `nullable: true` for the same reason `ContextBinder.binds` is: it lets an EMPTY
    # reference define. A row is authored target-first (a map entry is keyed by its target, so a row with no
    # target has no notation representation at all), which means the instant between picking the slot and
    # picking the source is a real, reachable state — and without `nullable` the weak definer answers
    # `Empty object reference` for it, failing the whole RunStep's definition mid-edit.
    contexts:
      is: Map
      of:
        - String
        - is: ObjectLocation
          nullable: true
      by: Nominal
      editor: RunStepContextsEditor
    selfLocation: SelfLocation


WaitStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.WaitStep
  icon: "material-symbols:timer"
  title: "Wait"
  milliseconds: 1000
  meta:
    milliseconds:
      is: Long
      summary: TextAttributeView


PauseStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.PauseStep
  icon: "material-symbols:pause"
  title: "Pause"
  description: "Pause execution until resumed"


# An if / else-if / ... / else chain: N condition branches evaluated in order (first true wins), plus one
# optional trailing Else. A branch is a nested IfBranch object carrying its OWN condition and steps, so branch
# order is document order of those objects and adding / removing / reordering a branch renames nothing.
IfStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.IfStep
  display: IfStepDisplay
  icon: "material-symbols:share"
  title: "If"
  description: "Run the first branch whose Kotlin condition holds, else the Else steps"
  meta:
    branches:
      is: List
      of: IfBranch
      by: NestedList
      # Children are structural branch groups (condition + steps), not steps themselves — read via
      # ScriptConventions.stepGroupAttributeNames (a metadata key like `rerun` / `scope`, inert for definition).
      group: true
    else:
      is: List
      of: ScriptStep
      by: NestedList


# One branch of an IfStep chain: a Kotlin Boolean condition and the steps that run when it is the first true
# one. Deliberately NOT `is: ScriptStep` — it is never executed, so ScriptValidator's step collection (an
# inheritance-chain filter on ScriptStep) skips it and it never enters a step-validation surface. Parentless,
# so `title` needs its own metadata to define (see the Channel archetype gotcha in AGENTS.md); it feeds
# ScriptCommander.findNextAvailable's name prefix ("Branch", "Branch 2", ...).
IfBranch:
  abstract: true
  class: tech.kzen.auto.server.objects.script.step.control.IfBranch
  title: "Branch"
  condition: ""
  meta:
    title: String
    # Compiled with a forced Boolean return by IfStep (which owns every branch's condition — see IfStep's
    # KDoc), exactly like DoWhileStep.condition below. NO `scope: body` marker: a branch condition is
    # evaluated BEFORE its branch runs, so its in-scope references are the If's own predecessors plus the
    # in-scope bindings — the default scoping both KotlinExpressionEditor and StepExpressionSupport apply
    # (ScriptTree.predecessors already excludes the sibling branch groups).
    condition:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
    steps:
      is: List
      of: ScriptStep
      by: NestedList


ForEachStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.foreach.ForEachStep
  display: ForEachStepDisplay
  icon: "material-symbols:forward"
  title: "ForEach"
  description: "Loop over the items a Kotlin expression evaluates to"
  items: ""
  meta:
    # Compiled in the INFERENCE form by ForEachStep (see ForEachItemsExpression), not with a forced
    # Iterable<*> return: the inferred ELEMENT type is what the `item` binding below publishes to the body.
    # NO `summary:` — a branch-header step never wires StepHeader's attributeViewManager, so the marker would
    # be inert (IfBranch.condition omits it for the same reason). NO `scope: body` either: the expression is
    # evaluated at loop ENTRY, so its in-scope references are this loop's predecessors plus the in-scope
    # bindings — the default scoping both KotlinExpressionEditor and StepExpressionSupport apply.
    items:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
    steps:
      is: List
      of: ScriptStep
      by: NestedList
      # This branch re-runs each iteration (read by ScriptNestingAnalysis): a ControlStep may target this loop,
      # and a move-to jump into this body is invalid (execution-control decision 8). Inert for definition.
      rerun: true
    selfLocation: SelfLocation

ForEachItemBinding:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.binding.ForEachItemBinding
  icon: "material-symbols:label"
  title: "Item"
  meta:
    selfLocation: SelfLocation


DoWhileStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.DoWhileStep
  display: DoWhileStepDisplay
  icon: "material-symbols:repeat"
  title: "Do While"
  description: "Repeat steps while a Kotlin condition (over the body's values) holds true"
  condition: ""
  meta:
    condition:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
      summary: TextAttributeView
      # The condition's in-scope references are this loop's own body steps, not its predecessors (read by the
      # client KotlinExpressionEditor via ScriptConventions.isBodyScopedExpression; the server counterpart is
      # DoWhileStep.conditionScopeTypes itself). Inert for definition, like `rerun` below.
      scope: body
    steps:
      is: List
      of: ScriptStep
      by: NestedList
      # This branch re-runs each iteration (read by ScriptNestingAnalysis) — see ForEachStep.steps.rerun.
      rerun: true
    selfLocation: SelfLocation


# Structured loop control (continue / break): raises a completion signal targeting an enclosing loop so the loop
# skips the rest of this iteration (action: skipIteration) or exits (action: finishLoop). Produces no value. A
# `loop` that is not a `rerun`-flagged enclosing ancestor is a validation error that blocks Run.
ControlStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.ControlStep
  icon: "material-symbols:step-out"
  title: "Loop Control"
  loop: ""
  action: "skipIteration"
  meta:
    loop:
      is: ObjectLocation
      by: Nominal
      editor: SelectEnclosingLoopEditor
    action:
      is: String
      editor: SelectValuesEditor
      values:
        skipIteration: "Skip Iteration"
        finishLoop: "Finish Loop"
      summary: ControlSummaryAttributeView
    selfLocation: SelfLocation

#######################################################################################################################

# The flavour-neutral Context steps: bind a value into the run's ambient scope, read one back out, end one,
# and register anonymous frame cleanup. The Browser steps below are the same four operations written for one
# particular Context; these work against any Context a user or a plugin declares.


# `is: [ScriptStep, ContextBinder]` and deliberately NOT ResourceOwner. Binding a value says nothing about
# disposing it, so a Bind of a String shows no close-policy control — not because an editor hides it, but
# because this archetype declares no such attribute for anything to render. That is what the ContextBinder /
# ResourceOwner split buys: a step that also OWNS what it binds takes both mix-ins (BrowserOpenStep).
BindStep:
  abstract: true
  is:
    - ScriptStep
    - ContextBinder
  class: tech.kzen.auto.server.objects.script.step.context.BindStep
  icon: "material-symbols:add-link"
  title: "Bind"
  description: "Publish a Kotlin expression's value into the run's scope under a Context"
  value: ""
  qualifier: ""
  binds: ""
  meta:
    value:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
      summary: TextAttributeView
    qualifier:
      is: String
      summary: TextAttributeView
    # Restated IN FULL rather than inherited from ContextBinder: attribute metadata resolves by
    # `firstAttribute`, so the closest declaration REPLACES the inherited one instead of merging with it.
    # Dropping `is` / `nullable` / `by` here would lose the weak-reference contract and the empty default
    # would stop defining. `editor:` is the addition — the opt-in that makes the Context picker render, since
    # a context declaration is otherwise suppressed from the step body.
    binds:
      is: ObjectLocation
      nullable: true
      by: Nominal
      editor: SelectContextEditor
    selfLocation: SelfLocation


# Reads a Context into the value graph, so the ordinary value steps (Formula, Display) can consume it by
# reference without knowing Contexts exist.
UseContextStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.context.UseContextStep
  icon: "material-symbols:input"
  title: "Use"
  description: "Read a Context into this Script's values"
  qualifier: ""
  uses: ""
  meta:
    qualifier:
      is: String
      summary: TextAttributeView
    # Narrowed from the inherited LIST form to a single nullable reference (restatement rule: see
    # BindStep.meta.binds). This step publishes ONE value, the editor writes one reference, and the list form
    # costs the empty default its definition — WeakAttributeDefiner resolves an empty reference against
    # `nullable`, which a List type is not. Reading is unaffected: LogicContextConventions.referenceList
    # accepts either shape, so `stepUses` still yields a one-element list here.
    uses:
      is: ObjectLocation
      nullable: true
      by: Nominal
      editor: SelectContextEditor
    selfLocation: SelfLocation


# `releases:`, not `uses:` — a closer's job is to make the absence true, so it is never gated by the runtime
# `uses` check and "nothing was bound" is success. The declaration also supplies the descriptor that lets the
# step resolve argument-free, and drops the Context from the static analysis's availability, so a step reading
# it after this one warns.
ReleaseStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.context.ReleaseStep
  icon: "material-symbols:link-off"
  title: "Release"
  description: "End a Context: unbind it and run the disposal its binder attached"
  qualifier: ""
  releases: ""
  meta:
    qualifier:
      is: String
      summary: TextAttributeView
    # Restatement rule: see BindStep.meta.binds.
    releases:
      is: ObjectLocation
      nullable: true
      by: Nominal
      editor: SelectContextEditor


# Frame cleanup with no value and no name — the disposal half of a binding without the binding half. It
# declares no Context because there is nothing anyone would want to read; inventing one purely to obtain a
# `finally` is exactly what this step exists to avoid. `label` is a display string for the trace, NOT a key:
# it introduces no namespace and nothing resolves it.
DisposeAtSettleStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.context.DisposeAtSettleStep
  icon: "material-symbols:auto-delete"
  title: "Dispose at finish"
  description: "Run a Kotlin expression for its effect when the owning Script finishes"
  code: ""
  label: ""
  disposal: auto
  meta:
    code:
      is: String
      multiline: true
      editor: KotlinExpressionEditor
      summary: TextAttributeView
    label:
      is: String
      summary: TextAttributeView
    disposal: SettleDisposalPolicy
    selfLocation: SelfLocation


#######################################################################################################################

# The browser a Script drives: one RemoteWebDriver, opened by BrowserOpenStep and read by every browser
# action step. `key: browser` is the engine resource key — the same plain string WebDriverSupport.resourceKey
# names, so a raw-string step and a typed one share one registration.
BrowserContext:
  is: Context
  type:
    class: org.openqa.selenium.remote.RemoteWebDriver
    generics: []
    nullable: false
  key: browser
  icon: "material-symbols:open-in-new"
  title: "Browser"
  description: "A browser window driven by this run"


BrowserOpenStep:
  abstract: true
  is:
    - ScriptStep
    - ContextBinder
    - ResourceOwner
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserOpenStep
  icon: "material-symbols:open-in-new"
  title: "Open browser"
  description: "Open a new browser window (existing one will be closed)"
  binds: BrowserContext


# `releases:`, not `uses:` — a closer's job is to make the absence true, so "already absent" is success,
# not an error. It is therefore never gated by the runtime `uses` check and never ambers; it does supply
# the descriptor that lets `contextValueOrNull()` / `releaseContext()` resolve argument-free, and it removes
# the Context from the static analysis's availability so a browser step placed AFTER a Close warns.
BrowserCloseStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserCloseStep
  icon: "material-symbols:close"
  title: "Close browser"
  description: "Close the browser window"
  releases: BrowserContext


BrowserGetStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserGetStep
  icon: "material-symbols:http"
  title: "Browse to URL"
  description: "Navigate to a new URL"
  location: "https://www.google.com/"
  screenshotDelayMilliseconds: 0
  uses:
    - BrowserContext
  meta:
    location:
      is: String
      summary: TextAttributeView
    screenshotDelayMilliseconds: Long


BrowserClickStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserClickStep
  icon: "material-symbols:touch-app"
  title: "Click"
  target:
    type: Focus
  delaySeconds: 0
  uses:
    - BrowserContext
  meta:
    target:
      is: TargetSpec
      summary: TargetAttributeView
    delaySeconds: Double


BrowserReadStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserReadStep
  icon: "material-symbols:text-fields"
  title: "Read"
  description: "Read the visible text (or a named attribute) of a target element"
  target:
    type: Focus
  attribute: ""
  delaySeconds: 0
  uses:
    - BrowserContext
  meta:
    target:
      is: TargetSpec
      summary: TargetAttributeView
    attribute:
      is: String
      summary: TextAttributeView
    delaySeconds: Double


BrowserWriteStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserWriteStep
  icon: "material-symbols:keyboard"
  title: "Write"
  description: "Send text into input field"
  text: ""
  target:
    type: Focus
  overwrite: false
  delaySeconds: 0
  uses:
    - BrowserContext
  meta:
    text:
      is: String
      multiline: true
      summary: TextAttributeView
    target:
      is: TargetSpec
      summary: TargetAttributeView
    overwrite:
      is: Boolean
      summary: TextAttributeView
    delaySeconds: Double


BrowserSubmitStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserSubmitStep
  icon: "material-symbols:send"
  title: "Submit"
  target:
    type: Focus
  delaySeconds: 0
  uses:
    - BrowserContext
  meta:
    target:
      is: TargetSpec
      summary: TargetAttributeView
    delaySeconds: Double


BrowserEscapeStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserEscapeStep
  icon: "material-symbols:cancel-presentation"
  title: "Escape"
  uses:
    - BrowserContext


BrowserEnterStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserEnterStep
  icon: "material-symbols:keyboard-return"
  title: "Enter"
