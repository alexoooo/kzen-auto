      is: TargetSpec
      summary: TargetAttributeView
    selfLocation: SelfLocation


BrowserEscapeStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.browser.BrowserEscapeStep
