ArgumentStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.ArgumentStep
  icon: ArrowForward
  title: "Argument"
  parameter: "main"
  meta:
    parameter:
      is: String
      summary: TextAttributeView
    selfLocation: SelfLocation


BooleanLiteralStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.BooleanLiteralStep
  icon: ToggleOn
  title: "True or false"
  value: false
  meta:
    value:
      is: Boolean
      summary: TextAttributeView
    selfLocation: SelfLocation


TextLiteralStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.TextLiteralStep
  icon: Textsms
  title: "Text"
  value: ""
  meta:
    value:
      is: String
      summary: TextAttributeView
    selfLocation: SelfLocation


FormulaStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.eval.FormulaStep
  icon: Functions
  title: "Formula"
  code: ""
  meta:
    code:
      is: String
      multiline: true
      summary: TextAttributeView
    selfLocation: SelfLocation


NumberLiteralStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.NumberLiteralStep
  icon: LooksOne
  title: "Number"
  value: 0
  meta:
    value:
      is: Double
      summary: TextAttributeView
    selfLocation: SelfLocation


NumberRangeStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.NumberRangeStep
  icon: TripOrigin
  title: "Number range"
  from: 1
  to: 10
  meta:
    from: Int
    to: Int
    selfLocation: SelfLocation


DivisibleCheckStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.logic.DivisibleCheckStep
  icon: FilterList
  title: "Is divisible by"
  number: ""
  divisor: 1
  meta:
    number:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    divisor: Int
    selfLocation: SelfLocation


LogicalAndStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.logic.LogicalAndStep
  icon: AddBox
  title: "Logical AND"
  condition: ""
  and: ""
  meta:
    condition:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    and:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    selfLocation: SelfLocation


DisplayValueStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.value.DisplayValueStep
  icon: Print
  title: "Display"
  text: ""
  meta:
    text:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    selfLocation: SelfLocation


#######################################################################################################################


MultiScriptStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.MultiStep
  display: MultiStepDisplay
  icon: ToggleOn
  title: "Sub-script"
  steps: []
  meta:
    steps:
      is: List
      of: ScriptStep
      by: Nominal


RunStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.RunStep
  icon: PlayArrow
  title: "Run"
  instructions: ""
  arguments: {}
  meta:
    instructions:
      is: ObjectLocation
      by: Nominal
      editor: SelectLogicEditor
    arguments:
      is: Map
      of:
        - String
        - ObjectLocation
      by: Nominal
      editor: RunStepArgumentsEditor
    selfLocation: SelfLocation


WaitStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.WaitStep
  icon: Timer
  title: "Wait"
  milliseconds: 1000
  meta:
    milliseconds:
      is: Long
      summary: TextAttributeView
    selfLocation: SelfLocation


IfStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.IfStep
  display: IfStepDisplay
  icon: Share
  title: "If"
  description: "Do one thing or another based on condition"
  condition: ""
  then: []
  else: []
  meta:
    condition:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    then:
      is: List
      of: ScriptStep
      by: Nominal
    else:
      is: List
      of: ScriptStep
      by: Nominal


MappingStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.mapping.MappingStep
  display: MappingStepDisplay
  icon: Forward
  title: "Loop"
  description: "Use each item in a list"
  items: ""
  steps: []
  meta:
    items:
      is: ObjectLocation
      by: Nominal
      editor: SelectStepEditor
    steps:
      is: List
      of: ScriptStep
      by: Nominal
    selfLocation: SelfLocation

MappingItemStep:
  abstract: true
  is: ScriptStep
  class: tech.kzen.auto.server.objects.script.step.control.mapping.MappingItemStep
  icon: Share
  title: "Item"
  meta:
    selfLocation: SelfLocation

