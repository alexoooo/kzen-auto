# Which files: shared by the File data source (which also reads them, in its `format`) and the File Worker (which
# only selects them).
FileSelectionConfig:
  abstract: true
  files: []
  missing: fail

  # Chooser navigation state (FileSelectionBrowserConventions): where the chooser was last browsing; it selects
  # nothing.
  browser:
    directory: "./"
    filter: ""
  meta:
    files:
      is: List
      editor: FileSelectionEditor
      browser: browser
      of:
        is: Map
        of:
          - String
          - String
    missing:
      is: String
      editor: SelectValuesEditor
      label: "If a file is missing"
      values:
        fail: "Stop with an error"
        skip: "Skip it"


FileDataSourceConfig:
  abstract: true
  is: FileSelectionConfig
  format: auto-jvm/datasource/configured-delimited-format.yaml#AutomaticFormat
  meta:
    format:
      is: ConfiguredRecordFormat
      editor: SelectDataFormatEditor


FileDataSource:
  abstract: true
  is:
    - DataSource
    - FileDataSourceConfig
  title: "File"
  class: tech.kzen.auto.server.objects.datasource.FileDataSource
  meta:
    selfLocation:
      is: ObjectLocation
      by: Self


LogicDataSourceConfig:
  abstract: true
  instructions: ""
  arguments: []
  schema: ""
  meta:
    instructions:
      is: ObjectLocation
      nullable: true
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: List
      of: String
    schema:
      is: DataSchema
      nullable: true
      by: DataSchemaReference
      editor: SelectObjectEditor


LogicDataSource:
  abstract: true
  is:
    - DataSource
    - LogicDataSourceConfig
  title: "Logic"
  class: tech.kzen.auto.server.objects.datasource.LogicDataSource


DataSourceActions:
  class: tech.kzen.auto.server.objects.datasource.DataSourceActions
