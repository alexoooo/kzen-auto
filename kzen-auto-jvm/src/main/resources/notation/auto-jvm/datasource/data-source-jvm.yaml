FileDataSourceConfig:
  abstract: true
  directory: ""
  filter: ""
  files: []
  format: ""
  encoding: ""
  groupPattern: ""
  missing: fail
  schema: ""

  # Chooser navigation state, deliberately separate from the runtime `directory` / `filter` query above: browsing
  # must never turn the last visited directory into a directory scan (FileSelectionBrowserConventions).
  browser:
    directory: "./"
    filter: ""
  meta:
    directory: String
    filter: String
    files:
      is: List
      editor: FileSelectionEditor
      browser: browser
      of:
        is: Map
        of:
          - String
          - String
    # Defaults for every file this source reads, each overridable per file in the selection's Details. Blank is
    # the normal setting: format falls back to extension inference, encoding to the format's own default.
    format:
      is: String
      editor: SelectDataFormatEditor
    encoding:
      is: String
      editor: SelectDataEncodingEditor
    groupPattern: String
    missing:
      is: String
      editor: SelectValuesEditor
      values:
        fail: "Fail if a file is missing"
        skip: "Skip the unit"
    schema:
      is: DataSchema
      nullable: true
      by: DataSchemaReference
      editor: SelectObjectEditor


FileDataSource:
  abstract: true
  is:
    - DataSource
    - FileDataSourceConfig
  title: "File"
  class: tech.kzen.auto.server.objects.datasource.FileDataSource


LogicDataSourceConfig:
  abstract: true
  instructions: ""
  arguments: []
  schema: ""
  meta:
    instructions:
      is: ObjectLocation
      nullable: true
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: List
      of: String
    schema:
      is: DataSchema
      nullable: true
      by: DataSchemaReference
      editor: SelectObjectEditor


LogicDataSource:
  abstract: true
  is:
    - DataSource
    - LogicDataSourceConfig
  title: "Logic"
  class: tech.kzen.auto.server.objects.datasource.LogicDataSource


DataSourceActions:
  class: tech.kzen.auto.server.objects.datasource.DataSourceActions
