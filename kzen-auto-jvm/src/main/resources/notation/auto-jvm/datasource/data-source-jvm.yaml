# Which files: shared by the File data source (which also reads them, in its `format`) and the File Worker (which
# only selects them).
FileSelectionConfig:
  abstract: true
  directory: ""
  filter: ""
  files: []
  groupPattern: ""
  missing: fail

  # Chooser navigation state, deliberately separate from the runtime `directory` / `filter` query above: browsing
  # must never turn the last visited directory into a directory scan (FileSelectionBrowserConventions).
  browser:
    directory: "./"
    filter: ""
  meta:
    directory:
      is: String
      label: "Folder to scan"
      description: "Optional: take every matching file in this folder, in addition to the files picked above."
    filter:
      is: String
      label: "File name filter"
      description: "Which files in the folder to take, for example *.csv"
    files:
      is: List
      editor: FileSelectionEditor
      browser: browser
      of:
        is: Map
        of:
          - String
          - String
    groupPattern:
      is: String
      label: "Name pattern"
      description: "Optional: picks values out of each file name by named group, for example (?<year>[0-9]{4})"
    missing:
      is: String
      editor: SelectValuesEditor
      label: "If a file is missing"
      values:
        fail: "Stop with an error"
        skip: "Skip it"


FileDataSourceConfig:
  abstract: true
  is: FileSelectionConfig
  format: auto-jvm/datasource/configured-delimited-format.yaml#AutomaticFormat
  meta:
    format:
      is: ConfiguredRecordFormat
      editor: SelectDataFormatEditor


FileDataSource:
  abstract: true
  is:
    - DataSource
    - FileDataSourceConfig
  title: "File"
  class: tech.kzen.auto.server.objects.datasource.FileDataSource


LogicDataSourceConfig:
  abstract: true
  instructions: ""
  arguments: []
  schema: ""
  meta:
    instructions:
      is: ObjectLocation
      nullable: true
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: List
      of: String
    schema:
      is: DataSchema
      nullable: true
      by: DataSchemaReference
      editor: SelectObjectEditor


LogicDataSource:
  abstract: true
  is:
    - DataSource
    - LogicDataSourceConfig
  title: "Logic"
  class: tech.kzen.auto.server.objects.datasource.LogicDataSource


DataSourceActions:
  class: tech.kzen.auto.server.objects.datasource.DataSourceActions
