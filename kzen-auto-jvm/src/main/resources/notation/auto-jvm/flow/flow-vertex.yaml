        - is: ObjectLocation
          nullable: true
      by: Nominal
      editor: RunStepContextsEditor
    first:
      is: RequiredInput
      by: FlowWiring
    second:
      is: RequiredInput
      by: FlowWiring
    output:
      is: RequiredOutput
      by: FlowWiring


