IntRangeSource:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.IntRangeSource
  icon: "material-symbols:trip-origin"
  title: "Number Range"
  description: "Range of integers, starting at 'from' and ending at 'to' (inclusively)"
  from: 1
  to: 10
  meta:
    output:
      is: StreamOutput
      by: FlowWiring
    from: Int
    to: Int


