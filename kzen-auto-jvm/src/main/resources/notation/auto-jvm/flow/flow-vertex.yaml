DivisibleFilter:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.DivisibleFilter
  icon: "material-symbols:filter-list"
  title: "Divisible Filter"
  description: "Filter divisible by"
  divisor: 1
  meta:
    input:
      is: RequiredInput
      by: FlowWiring
    output:
      is: OptionalOutput
      by: FlowWiring
    divisor: Int


ReplaceProcessor:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.ReplaceProcessor
  icon: "material-symbols:forward"
  title: "Replace"
  description: "Substitute the input value (which is ignored) with the given replacement"
  replacement: ""
  meta:
    input:
      is: RequiredInput
      by: FlowWiring
    output:
      is: OptionalOutput
      by: FlowWiring
    replacement: String


RepeatProcessor:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.RepeatProcessor
  icon: "material-symbols:file-copy"
  title: "Repeat"
  description: "Repeat the input value a given number of times"
  times: 2
  meta:
    input:
      is: RequiredInput
      by: FlowWiring
    output:
      is: BatchOutput
      by: FlowWiring
    times: Int


CountSink:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.CountSink
  icon: "material-symbols:exposure-plus-1"
  title: "Count"
  description: "Counter"
  meta:
    input:
      is: RequiredInput
      by: FlowWiring


AccumulateSink:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.AccumulateSink
#  icon: PlaylistAdd
  icon: "material-symbols:print"
  title: "Display"
  description: "List of all seen values"
  meta:
    input:
      is: RequiredInput
      by: FlowWiring


AppendText:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.AppendText
  icon: "material-symbols:add"
  title: "Append Text"
  description: "Concatenate two (or possibly one) text inputs"
  meta:
    prefix:
      is: OptionalInput
      by: FlowWiring
    suffix:
      is: OptionalInput
      by: FlowWiring
    output:
      is: RequiredOutput
      by: FlowWiring


SelectLast:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.SelectLast
  icon: "material-symbols:compare-arrows"
  title: "Select Last"
  description: "Second if it's available, otherwise first"
  meta:
    first:
      is: OptionalInput
      by: FlowWiring
    second:
      is: OptionalInput
      by: FlowWiring
    output:
      is: RequiredOutput
      by: FlowWiring


RunLogic:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.RunLogicVertex
  icon: "material-symbols:play-arrow"
  title: "Run"
  description: "Invoke another Logic (e.g. a Script), passing the input as its first parameter and emitting its result; 'arguments' binds literal text to further parameters by name"
  instructions: ""
  arguments: {}
  meta:
    instructions:
      is: ObjectLocation
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: Map
      of:
        - String
        - String
      editor: RunLogicArgumentsEditor
    input:
      is: RequiredInput
      by: FlowWiring
    output:
      is: RequiredOutput
      by: FlowWiring


RunLogic2:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.RunLogicVertex2
  icon: "material-symbols:play-arrow"
  title: "Run (2 inputs)"
  description: "Invoke another Logic, passing the two inputs as its first two parameters and emitting its result; 'arguments' binds literal text to further parameters by name"
  instructions: ""
  arguments: {}
  meta:
    instructions:
      is: ObjectLocation
      by: Nominal
      editor: SelectLogicEditor
      summary: ReferenceLinkAttributeView
    arguments:
      is: Map
      of:
        - String
        - String
      editor: RunLogicArgumentsEditor
    first:
      is: RequiredInput
      by: FlowWiring
    second:
      is: RequiredInput
      by: FlowWiring
    output:
      is: RequiredOutput
      by: FlowWiring


#######################################################################################################################
# Flow signature vertices: input parameters (source) and result (sink).


FlowInput:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.FlowInputVertex
  icon: "material-symbols:login"
  title: "Input"
  description: "Flow input parameter (value supplied as a run argument)"
  parameter: ""
  meta:
    parameter: String
    output:
      is: RequiredOutput
      by: FlowWiring


FlowOutput:
  abstract: true
  is: FlowVertex
  class: tech.kzen.auto.server.objects.flow.vertex.FlowOutputVertex
  icon: "material-symbols:logout"
  title: "Output"
  description: "Flow result (contributes to the run's return value)"
  result: ""
  meta:
    input:
      is: RequiredInput
      by: FlowWiring
    result: String
