
#######################################################################################################################

ScriptController:
  is: DocumentController
  class: tech.kzen.auto.client.objects.document.script.ScriptController$Wrapper
  archetype: Script
  stepDisplayManager: StepDisplayManager
  scriptCommander: ScriptCommander
  ribbonController: RibbonController


ScriptCommander:
  class: tech.kzen.auto.client.objects.document.script.command.ScriptCommander
  meta:
    stepCommanders: ChildList


ScriptStepCommander:
  abstract: true
  is: ParentPointer
  class: tech.kzen.auto.client.objects.document.script.command.ScriptStepCommander


################################################################

StepDisplayManager:
  class: tech.kzen.auto.client.objects.document.script.display.StepDisplayManager$Wrapper
  handle: StepDisplayManagerHandle
  meta:
    stepDisplays:
      is: List
      of: ScriptStepDisplay
      by: Autowired


StepDisplayManagerHandle:
  class: tech.kzen.auto.client.objects.document.script.display.StepDisplayManager$Handle


ScriptStepDisplay:
  abstract: true
  class: tech.kzen.auto.client.objects.document.script.display.ScriptStepDisplayWrapper
  meta:
    objectLocation:
      is: ObjectLocation
      by: Self


ScriptStepDisplayDefault:
  is: ScriptStepDisplay
  class: tech.kzen.auto.client.objects.document.script.display.ScriptStepDisplayDefault$Wrapper
  attributeEditorManager: AttributeEditorManager
  attributeViewManager: AttributeViewManager


RunStepDisplay:
  is: ScriptStepDisplay
  class: tech.kzen.auto.client.objects.document.script.step.control.RunStepDisplay$Wrapper
  attributeEditorManager: AttributeEditorManager
  attributeViewManager: AttributeViewManager


MultiStepDisplay:
  is: ScriptStepDisplay
  class: tech.kzen.auto.client.objects.document.script.step.control.MultiStepDisplay$Wrapper
  stepDisplayManager: StepDisplayManagerHandle
  scriptCommander: ScriptCommander


IfStepDisplay:
  is: ScriptStepDisplay
  class: tech.kzen.auto.client.objects.document.script.step.control.IfStepDisplay$Wrapper
  attributeEditorManager: AttributeEditorManager
  stepDisplayManager: StepDisplayManagerHandle
  scriptCommander: ScriptCommander

#IfStepCommander:
