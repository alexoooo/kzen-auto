#      by: Nominal

ForEachStepDisplay:
  is: ScriptStepDisplay
  class: tech.kzen.auto.client.objects.document.script.step.control.foreach.ForEachStepDisplay$Wrapper
  attributeEditorManager: AttributeEditorManager
  stepDisplayManager: StepDisplayManagerHandle
  scriptCommander: ScriptCommander

DoWhileStepDisplay:
  is: ScriptStepDisplay
  class: tech.kzen.auto.client.objects.document.script.step.control.DoWhileStepDisplay$Wrapper
  attributeEditorManager: AttributeEditorManager
  stepDisplayManager: StepDisplayManagerHandle
  scriptCommander: ScriptCommander

ForEachStepCommander:
  is: ScriptStepCommander
  class: tech.kzen.auto.client.objects.document.script.step.control.foreach.ForEachStepCommander
  parent: ScriptCommander
  forEachStepArchetype: ForEachStep
  itemArchetype: ForEachItemBinding
  meta:
    forEachStepArchetype:
      is: ObjectLocation
      by: Nominal
    itemArchetype:
      is: ObjectLocation
      by: Nominal

#######################################################################################################################


SelectStepEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.script.display.edit.SelectStepEditor$Wrapper


KotlinExpressionEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.script.display.edit.KotlinExpressionEditor$Wrapper


SelectLogicEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.script.display.edit.SelectLogicEditor$Wrapper


RunStepArgumentsEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.script.step.control.RunStepArgumentsEditor$Wrapper


TargetSpecEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.script.display.edit.TargetSpecEditor$Wrapper
  meta:
    targetTypes:
      is: List
      of: TargetTypeDisplay
      by: Autowired


SelectClosePolicyEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.script.display.edit.SelectClosePolicyEditor$Wrapper


TargetAttributeView:
  is: AttributeView
  class: tech.kzen.auto.client.objects.document.script.display.view.TargetAttributeView$Wrapper
  meta:
    targetTypes:
      is: List
      of: TargetTypeDisplay
      by: Autowired


# Per-target-type client fragments (dropdown label, value row, collapsed summary), autowired into
# the TargetSpecEditor / TargetAttributeView hosts and matched by the `type:` notation value — a
# new target type contributes its UI by registering an `is: TargetTypeDisplay` object (the
# notation/server counterparts are TargetSpecType in common-action.yaml and TargetTypeLocator).
TargetTypeDisplay:
  abstract: true
  class: tech.kzen.auto.client.objects.document.script.display.target.TargetTypeDisplay
  meta:
    objectLocation:
      is: ObjectLocation
      by: Self

FocusTargetDisplay:
  is: TargetTypeDisplay
  class: tech.kzen.auto.client.objects.document.script.display.target.FocusTargetTypeDisplay

TextTargetDisplay:
  is: TargetTypeDisplay
  class: tech.kzen.auto.client.objects.document.script.display.target.TextTargetTypeDisplay

XpathTargetDisplay:
  is: TargetTypeDisplay
  class: tech.kzen.auto.client.objects.document.script.display.target.XpathTargetTypeDisplay

VisualTargetDisplay:
  is: TargetTypeDisplay
  class: tech.kzen.auto.client.objects.document.script.display.target.VisualTargetTypeDisplay


