

JobController:
  is: DocumentController
  class: tech.kzen.auto.client.objects.document.job.JobController$Wrapper
  archetype: Job
  ribbonController: RibbonController
  attributeEditorManager: AttributeEditorManager
  attributeViewManager: AttributeViewManager


# Channel-reference picker: lists the Job document's Channel objects in a dropdown and writes the chosen
# reference into the Worker's ChannelInput / ChannelOutput / ChannelServer / ChannelClient attribute.
# Selected per attribute via `editor: SelectChannelEditor` in the Worker archetype metadata.
SelectChannelEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.SelectChannelEditor$Wrapper


# Calculated-column map editor: edits a FormulaWorker's `formula` attribute (a FormulaSpec — column-name ->
# Kotlin-expression map), since the generic value editor can't edit a structured map attribute. Selected via
# `editor: FormulaMapEditor` on the FormulaWorker's `formula` metadata.
FormulaMapEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.FormulaMapEditor$Wrapper


# Sort-keys editor: edits a SortWorker's `sort` attribute (a SortSpec — an ordered column -> ascending map where
# the map order IS the multi-key sort priority), as add / remove / direction-toggle rows, since the generic value
# editor can't edit a structured map attribute. Selected via `editor: SortSpecEditor` on the SortWorker's `sort`
# metadata.
SortSpecEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.SortSpecEditor$Wrapper


# Export-config editor: edits an ExportWriterWorker's `export` attribute (an OutputExportSpec — format /
# compression / path-pattern), a thin composition of the same Select / Text field editors Report's export panel
# uses, pointed at the Job-relative `export.*` paths. Selected via `editor: ExportSpecEditor` on the
# ExportWriterWorker's `export` metadata.
ExportSpecEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.ExportSpecEditor$Wrapper


# Multi-file input editor: edits a MultiFileReaderWorker's `paths` attribute (an ordered List<String> of concrete
# input file paths) — a reorderable selected-paths list plus a directory browser (directory + name filter, backed
# by the document-agnostic /file-listing route reusing FileListingAction) to pick files. Selected via
# `editor: MultiFileInputEditor` on the MultiFileReaderWorker's `paths` metadata.
MultiFileInputEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.MultiFileInputEditor$Wrapper


# Value-set filter editor: edits a ValueSetFilterWorker's `filter` attribute (a FilterSpec — a column ->
# {type, values} distinct-value whitelist) as add/remove-column rows, each with a RequireAny / ExcludeAll toggle
# and a value set editable via histogram checkboxes + free text. A column's candidate distinct values come from
# the nearest upstream SummaryWorker's live TableSummary, threaded here through the JobSummaryStore that
# JobController provides into the DocumentBridge. Selected via `editor: ValueSetFilterEditor` on the
# ValueSetFilterWorker's `filter` metadata.
ValueSetFilterEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.ValueSetFilterEditor$Wrapper


# Pivot-config editor: edits a PivotWorker's `pivot` attribute (a PivotSpec — `rows` group-by columns + `values`,
# a column -> set of aggregate types Count/Sum/Average/Min/Max). Both column pickers draw candidate columns from
# the nearest upstream SummaryWorker's live TableSummary (threaded via the JobSummaryStore), degrading to free-text
# entry with no Summary upstream. Selected via `editor: PivotSpecEditor` on the PivotWorker's `pivot` metadata.
PivotSpecEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.job.edit.PivotSpecEditor$Wrapper


#######################################################################################################################
# Job insert ribbon: each RibbonTool delegates to a Worker / Channel archetype; clicking it inserts that
# archetype into the active Job document (Workers nest under `workers`, Channels under `channels`).


JobGroup_Sources:
  is: RibbonGroup
  title: "Sources"
  archetype: Job


CsvReaderTool:
  is: RibbonTool
  parent: JobGroup_Sources
  delegate: CsvReaderWorker


FormulaSourceTool:
  is: RibbonTool
  parent: JobGroup_Sources
  delegate: FormulaSourceWorker


MultiFileReaderTool:
  is: RibbonTool
  parent: JobGroup_Sources
  delegate: MultiFileReaderWorker


################################################################

JobGroup_Transforms:
