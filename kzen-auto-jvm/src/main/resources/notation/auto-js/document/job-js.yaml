FormulaTool:
  is: RibbonTool
  parent: JobGroup_Transforms
  delegate: FormulaWorker


RunTool:
  is: RibbonTool
  parent: JobGroup_Transforms
  delegate: RunWorker


SortTool:
  is: RibbonTool
