

FlowController:
  is: DocumentController
  class: tech.kzen.auto.client.objects.document.flow.FlowController$Wrapper
  archetype: Flow
  attributeController: AttributeEditorManager
  ribbonController: RibbonController


#######################################################################################################################


FlowInsertGroup:
  is: RibbonGroup
  title: "Insert"
  archetype: Flow


FlowPipeGroup:
  is: RibbonGroup
  title: "Pipes"
  archetype: Flow


###########################################################
# Signature vertices (input parameters / result) first, then sources / processors / sinks.


FlowInputTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: FlowInput


FlowOutputTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: FlowOutput


FlowIntRangeSourceTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: IntRangeSource


FlowDivisibleFilterTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: DivisibleFilter


FlowReplaceProcessorTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: ReplaceProcessor


FlowRepeatProcessorTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: RepeatProcessor


FlowCountSinkTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: CountSink


FlowAccumulateSinkTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: AccumulateSink


FlowAppendTextTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: AppendText


FlowSelectLastTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: SelectLast


FlowRunLogicTool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: RunLogic


FlowRunLogic2Tool:
  is: RibbonTool
  parent: FlowInsertGroup
  delegate: RunLogic2


###########################################################


FlowTopToBottomPipeTool:
