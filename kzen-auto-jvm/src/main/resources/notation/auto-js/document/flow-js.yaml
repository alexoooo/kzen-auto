  delegate: TopToBottomPipe


FlowTopToLeftPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: TopToLeftPipe


FlowTopToRightPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: TopToRightPipe


FlowTopToLeftAndRightPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: TopToLeftAndRightPipe


FlowTopToBottomAndLeftPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: TopToBottomAndLeftPipe


FlowTopToBottomAndRightPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: TopToBottomAndRightPipe


FlowTopToBottomAndLeftAndRightPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: TopToBottomAndLeftAndRightPipe


FlowLeftToRightPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: LeftToRightPipe


FlowLeftToBottomPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
  delegate: LeftToBottomPipe


FlowLeftToBottomAndRightPipeTool:
  is: RibbonTool
  parent: FlowPipeGroup
