
AttributeEditorManager:
  class: tech.kzen.auto.client.objects.document.common.attribute.AttributeEditorManager$Wrapper
  meta:
    attributeEditors:
      is: List
      of: AttributeEditor
      by: Autowired

AttributeEditor:
  abstract: true
  class: tech.kzen.auto.client.objects.document.common.attribute.AttributeEditor
  meta:
    objectLocation:
      is: ObjectLocation
      by: Self

DefaultAttributeEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.common.attribute.DefaultAttributeEditor$Wrapper


SelectObjectEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.common.edit.SelectObjectEditor$Wrapper


SelectContextEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.common.edit.SelectContextEditor$Wrapper


# Button-group twin of SelectValuesEditor (same `values` / `details` meta), for a short fixed value set whose
# choices should all be visible at once. Selected via `editor: ToggleValuesEditor`.
ToggleValuesEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.common.edit.ToggleValuesEditor$Wrapper


# A directory path: typed, or chosen by walking folders in place (the file browser's listing, folders only).
# Selected via `editor: DirectoryEditor`.
DirectoryEditor:
  is: AttributeEditor
  class: tech.kzen.auto.client.objects.document.common.file.DirectoryEditor$Wrapper


################################################################


AttributeViewManager:
  class: tech.kzen.auto.client.objects.document.common.attribute.AttributeViewManager$Wrapper
  meta:
    attributeViews:
      is: List
      of: AttributeView
      by: Autowired

AttributeView:
  abstract: true
  class: tech.kzen.auto.client.objects.document.common.attribute.AttributeView
  meta:
    objectLocation:
      is: ObjectLocation
      by: Self

TextAttributeView:
  is: AttributeView
  class: tech.kzen.auto.client.objects.document.common.attribute.TextAttributeView$Wrapper


ReferenceLinkAttributeView:
  is: AttributeView
  class: tech.kzen.auto.client.objects.document.common.attribute.ReferenceLinkAttributeView$Wrapper

