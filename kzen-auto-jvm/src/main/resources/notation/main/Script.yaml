main:
  is: Script
  context:
    requires:
      - main.contexts/My Context

main.steps/Formula:
  is: FormulaStep
  code: listOf(1, 2, 3, 4, 5)

main.steps/Bind:
  is: BindStep
  value: Formula
  binds: main.contexts/My Context

main.steps/Display:
  is: DisplayValueStep
  text: main.steps/Formula