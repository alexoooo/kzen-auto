main:
  is: Script
  results:
    main:
      class: kotlin.String
      generics: []
      nullable: false

main.parameters/number:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false
  default: 3

main.steps/div 3:
  is: FormulaStep
  code: "number % 3 == 0"

main.steps/div 5:
  is: FormulaStep
  code: "number % 5 == 0"

main.steps/If:
  is: IfStep
  condition: main.steps/div 3

main.steps/If.else/If 3:
  is: IfStep
  condition: main.steps/div 5

main.steps/If.else/If 3.else/Formula 3:
  is: FormulaStep
  code: "number.toString()"

main.steps/If.else/If 3.then/Formula 2:
  is: FormulaStep
  code: '"Buzz"'

main.steps/If.then/If 2:
  is: IfStep
  condition: main.steps/div 5

main.steps/If.then/If 2.else/Text 2:
  is: TextLiteralStep

main.steps/If.then/If 2.then/Text:
  is: TextLiteralStep
  value: Buzz

main.steps/If.then/Formula:
  is: FormulaStep
  code: '"Fizz" + `If 2`'

main.steps/Result:
  is: ResultStep
  code: If