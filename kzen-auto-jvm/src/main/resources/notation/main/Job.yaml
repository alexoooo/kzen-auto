main:
  is: Job
  capacity: 10

main.workers/File:
  is: FileSourceWorker
  browser:
    directory: C:/~/data
    filter: ""
  files:
    - location: C:/~/data/measurements-100000.txt
    - location: C:/~/data/measurements-10000000.txt

main.workers/Parse:
  is: Parse
  format: auto-jvm/datasource/configured-delimited-format.yaml#AutomaticFormat

main.workers/Export:
  is: ExportWriterWorker