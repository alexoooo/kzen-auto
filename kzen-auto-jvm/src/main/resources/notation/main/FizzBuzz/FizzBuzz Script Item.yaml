main:
  is: Script
  results:
    main:
      class: kotlin.String
      generics: []
      nullable: false

main.parameters/number:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false
  default: 15

main.steps/Divisible By 15:
  is: FormulaStep
  code: "number % 15 == 0"

main.steps/Divisible By 3:
  is: FormulaStep
  code: "number % 3 == 0"

main.steps/Divisible By 5:
  is: FormulaStep
  code: "number % 5 == 0"

main.steps/FizzBuzz:
  is: IfStep

main.steps/FizzBuzz.branches/Branch:
  is: IfBranch
  condition: main.steps/Divisible By 15

main.steps/FizzBuzz.branches/Branch.steps/Formula:
  is: FormulaStep
  code: '"fizzbuzz"'

main.steps/FizzBuzz.branches/Branch 2:
  is: IfBranch
  condition: main.steps/Divisible By 3

main.steps/FizzBuzz.branches/Branch 2.steps/Formula 4:
  is: FormulaStep
  code: '"fizz"'

main.steps/FizzBuzz.branches/Branch 3:
  is: IfBranch
  condition: main.steps/Divisible By 5

main.steps/FizzBuzz.branches/Branch 3.steps/Formula 5:
  is: FormulaStep
  code: '"buzz"'

main.steps/FizzBuzz.else/Formula 2:
  is: FormulaStep
  code: "number.toString()"

main.steps/Display:
  is: DisplayValueStep
  text: main.steps/FizzBuzz

main.steps/Result:
  is: ResultStep
  code: "FizzBuzz"
