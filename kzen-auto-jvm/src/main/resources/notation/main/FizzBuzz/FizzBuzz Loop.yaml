main:
  is: Script
  results: {}

main.steps/Number range:
  is: NumberRangeStep
  to: 100

main.steps/Range:
  is: FormulaStep
  code: 1..100

main.steps/Loop:
  is: ForEachStep
  items: main.steps/Range

main.steps/Loop.steps/Run:
  is: RunStep
  instructions: "main/FizzBuzz/FizzBuzz Item.yaml#main"
  arguments:
    number: main.steps/Loop.item/Item

main.steps/Loop.item/Item:
  is: ForEachItemBinding

main.steps/Display:
  is: DisplayValueStep
  text: main.steps/Loop

main.steps/ForEach:
  is: ForEachStep
  items: main.steps/Number range

main.steps/ForEach.steps/Run 2:
  is: RunStep
  instructions: "main/FizzBuzz/FizzBuzz Flow Item.yaml#main"
  arguments:
    number: main.steps/ForEach.item/Item

main.steps/ForEach.steps/Formula:
  is: FormulaStep
  code: "`Run 2`.toString()"

main.steps/ForEach.item/Item:
  is: ForEachItemBinding

main.steps/Display 2:
  is: DisplayValueStep
  text: main.steps/ForEach