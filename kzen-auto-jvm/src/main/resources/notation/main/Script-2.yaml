main:
  is: Script

main.steps/Formula:
  is: FormulaStep
  code: 1..100

main.steps/ForEach:
  is: ForEachStep
  items: main.steps/Formula

main.steps/ForEach.item/Item:
  is: ForEachItemBinding

main.steps/ForEach.steps/Run:
  is: RunStep
  instructions: main/Job-3.yaml#main
  arguments:
    number: main.steps/ForEach.item/Item

main.steps/Display:
  is: DisplayValueStep
  text: main.steps/ForEach