main:
  is: Job
  results:
    main:
      class: kotlin.String
      generics: []
      nullable: false

main.workers/Formula Source:
  is: FormulaSourceWorker
  code: listOf(number)

main.workers/Formula:
  is: FormulaWorker
  payload: |-
      if (this % 3 == 0 && this% 5 == 0) "fizzbuzz"
      else if (this % 3 == 0) "fizz"
      else if (this % 5 == 0) "buzz"
      else this.toString()

main.workers/Result:
  is: ResultSinkWorker

main.parameters/number:
  is: ParameterBinding
  type:
    class: kotlin.Int
    generics: []
    nullable: false
  default: 15