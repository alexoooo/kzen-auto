main:
  is: Script
  parameters:
    - main

main.steps/Argument:
  is: ArgumentStep

main.steps/Formula:
  is: FormulaStep
  code: "Argument.toString().length * 2 + 1"

main.steps/True or false:
  is: BooleanLiteralStep
  value: true

main.steps/If:
  is: IfStep
  condition: main.steps/True or false

main.steps/If.then/Text:
  is: TextLiteralStep
  value: foo

main.steps/If.then/Formula 3:
  is: FormulaStep
  code: "Text.length + Argument.toString().length + Formula.toString().length"

main.steps/If.else/Text 2:
  is: TextLiteralStep

main.steps/Number range:
  is: NumberRangeStep

main.steps/Loop:
  is: MappingStep
  items: main.steps/Number range

main.steps/Loop.steps/Item:
  is: MappingItemStep

main.steps/Loop.steps/Text 3:
  is: TextLiteralStep

main.steps/Formula 2:
  is: FormulaStep
  code: "Argument.toString().length * 2 + 2"